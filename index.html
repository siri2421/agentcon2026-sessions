 live somewhere and outlive the access tokens. But in the meantime, if I send somebody to do the work, I send Claude to go and build this mini video game for me, and if it prompted me in the middle of the night to consent to some servers, I wouldn't be there.", "takeaways": "\u2022 **Operational Discipline:** That's an important it's an important point because this is obviously we've we've shown why this is particularly relevant for MCP because it is the scale of the agents wanting to access all of these things at the same time.\n\u2022 **Production Finding:** It's very it's very important for the security and experience of MCP but it's not unique to MCP."}, {"session_id": "1256098", "title": "Interoperable Agent Discovery: AI Catalog, ARD, and the AGNTCY Directory", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Breakout", "video_id": "JUBXq9-apOA", "recording_link": "https://www.youtube.com/watch?v=JUBXq9-apOA", "company": "Cisco, Google", "speaker": "Luca Muscariello, Junjie Bu", "word_count": 4668, "has_transcript": true, "premise": "Multi-agent systems today compose across MCP servers, A2A agents, and agent skills \u2014 artifacts that live in separate registries with incompatible metadata formats. AI Catalog addresses this at the standard level: a typed JSON format that gives each artifact type a common envelope for identity, capability, and provenance, without replacing the formats each community has standardized. What makes the standard operational is federation. AI Catalog's well-known discovery mechanism lets clients traverse distributed registries without a central index. ARD complements it with a user-facing API \u2014 enabling any code assistant (Claude, Copilot, Gemini) to discover AgentSkills, MCP servers, and A2A cards across federated catalogs, verify them cryptographically, and resolve them to a live endpoint without knowing the source registry. The AGNTCY directory implements content management, multi-registry discovery, and federation end to end. We demo the full flow: publishing an AgentSkill, an MCP server, and an A2A card under the AI Catalog standard, federating them through ARD, and discovering them securely from a code assistant at runtime. In practice, the primary operational challenge stems from this breakdown: Of course people can there's some dashboard can do some scan but still and the information exposed could be limited. I think there's some snook check scan say oh there are some skills there are some vulnerability.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: The robot can also use another tool or use something else, how it can know this tools it's trustful it can be used. For clients they can either check the well-known file or they can just according the registry to dynamically query the capability. It can verify by the registry, and the client can verify as well.", "takeaways": "\u2022 **Operational Discipline:** I said, three sellers in this case in the wild, they are discovered, they are found by globally unique identifiers.\n\u2022 **Production Finding:** Course a I think that's another important problem."}, {"session_id": "1254998", "title": "One Server, Many Apps: A Composable MCP Architecture for Observability", "category": "Observability & Evaluations", "topic": "MCPCon", "type": "Breakout", "video_id": "3TzG9NYlpwo", "recording_link": "https://www.youtube.com/watch?v=3TzG9NYlpwo", "company": "AWS OpenSearch, OpenSearch", "speaker": "Shenoy Pratik Gurudatt, Kyle Hounslow", "word_count": 4187, "has_transcript": true, "premise": "The first wave of MCP Apps shipped standalone tool surfaces, each with its own auth, routing, and conventions. That works for one app. It fails the moment a responder (an on-call engineer or an AI agent) has to move from a firing alert, to the trace that explains it, to the logs the span emitted, to the dashboard tracking the trend. Every hop loses context. We took the opposite path. Our team built and operates OpenSearch observability as a single MCP server with shared capabilities: auth, time-and-data routing, correlation, saving, and inspectability, defined once at the server and inherited by every app. The result: 295 jobs across 15 families (triage, logs, traces, metrics, SLOs, agent observability, dashboards, ingestion, stack health) served by ~51 composable MCP apps, all sharing a universal traceId/spanId correlation pivot so context follows the responder across tools. This talk walks through what that buys responders: faster jumps from alert to root cause, consistent auth and routing across clusters, correlation that just works, and how a five-person team ships two new apps a week without rebuilding the same plumbing. In practice, the primary operational challenge stems from this breakdown: But the problem here is you have multiple browser tabs, you're looking at your ticket and there's something missing pulling all of them. The agent finally comes out with a response saying the payment database is down and it's timing out and that's why you're seeing an issue.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: They look at the tool, you get the tool output, but the tool output is also shown as a visualization. You have the MCP server, you have the tool call, and the UI resource. The UI resource is the differentiation between an MCP server without with the tools and ones with the MCP apps.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Shenoy Pratik Gurudatt, Kyle Hounslow.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1254758", "title": "The Agentic SDLC: How We Shipped AI-Native Software at a Legacy Company", "category": "Enterprise & Production", "topic": "Enterprise Adoption in Practice", "type": "Breakout", "video_id": "UKuYBrJVsz8", "recording_link": "https://www.youtube.com/watch?v=UKuYBrJVsz8", "company": "A Place for Mom", "speaker": "Austin Brown", "word_count": 5410, "has_transcript": true, "premise": "A Place for Mom has served senior care families for 20 years. In 2025 we built a B2C home care platform \u2014 AI-native from the first commit. Not \"we added Copilot.\" Every layer runs with agentic tooling: planning, coding, review, deployment, observability. In production since November 2025. July 2025 through May 2026: 3,478 PRs across four repos, 2,822 merged, 81% merge rate. We built a five-layer stack. CLAUDE.md files give agents persistent context so they aren't starting fresh each session. Structured planning prevents the 200-lines-down-the-wrong-path failure mode. Git worktrees let parallel sessions run in isolation. A 10-stage multi-agent review pipeline with confidence scoring vets every PR. And platform-mcp \u2014 a Go service connecting Claude to New Relic, PagerDuty, Jira, GitHub, AWS, and Databricks through one endpoint \u2014 replaced six integrations. The harder question is what that pace does to comprehension. Velocity is measurable. Understanding is not. When an engineer ships in two hours what took two days, do they understand it well enough to debug it at 2am? We call this comprehension debt \u2014 and the guardrails built for code quality are the best defense. In practice, the primary operational challenge stems from this breakdown: If we're swimming by hand, I can look over my shoulder and I can see my teammate and we've drifted apart a little and I can call out to them and we can meet back in the middle. This is a big problem that I that I've seen on these teams is people just aren't talking to each other anymore.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: So, throughout the Grace experience, we tried a bunch of tools. We're a Claude and Codex users now, but name a tool, we've tried it. The models were way dumber and the tools weren't as sophisticated, so it's been fun watch it grow over time.", "takeaways": "\u2022 **Operational Discipline:** The one rule, if a finding doesn't make the code safer, faster, or clearer for the next human reading it, ignore it.\n\u2022 **Production Finding:** I have some recommendations, some strategies that we've tried to mitigate this.\n\u2022 **Failure Mode Mitigation:** We had Claude rules that was never run the unit test, bash deny the unit tests."}, {"session_id": "1264264", "title": "Your AI Agent Installed Malware Because a SKILL.md Told It To", "category": "Developer Tools & Frameworks", "topic": "Building Reliable Agent Systems", "type": "Breakout", "video_id": "wG2Q7etEIZY", "recording_link": "https://www.youtube.com/watch?v=wG2Q7etEIZY", "company": "Snyk", "speaker": "Liran Tal", "word_count": 4771, "has_transcript": true, "premise": "That SKILL.md file you just installed to supercharge your AI coding agent? It might be exfiltrating your AWS credentials right now. Yikes. Just like with early npm, attackers are abusing various Agent Skill ecosystems to launch malware campaigns. So now AI builders rush to add Skills which inherit the agent's full execution environment, yet ToxicSkills research found 37% of nearly 4000 skills malware and other security weaknesses, and even one \"security scanner\" skill that was itself malware, ha! The next AI security frontier is hijacking the agent's own reasoning to suppress safety warnings. Here\u2019s your chance to see in action how coding agents crumble under a malicious skill. In this session you'll watch live hacking of a malicious skill and how it fools a coding agent for rogue actions, a prompt injection leaks your secrets over email, and a leaky skill passes credit card numbers straight through the LLM context. Then I\u2019ll show you how to detect these malware and dangerous skill.md files and catch what every regex-based scanner misses. You'll leave with a concrete threat model for Agent Skills supply chains. In practice, the primary operational challenge stems from this breakdown: We looked into what would be the attack surface here. Out of that, and back then, on those numbers, almost 4,000 skills on Claw Hub, we had one of seven of those being vulnerable and tagged as potentially malicious or prompt injection or credential theft.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: We were, rushing very quickly to all of those AI components rules and commands and skills and,, MCPs having our MCP task and so many things and we're rushing rushing and it's great, it's fun. One specifically, this little trifecta is something that is has been happening, throughout many, many incidents that involve MCP servers and whatnot, because all of them compromise, extend the agent and compromise its execution. First off, the popular the popular aspect of skills.", "takeaways": "\u2022 **Operational Discipline:** I'll show you an example of why that's important and how is it different from other ways.\n\u2022 **Production Finding:** Remember it has these hidden not hidden but it they're just instructions that give an intent as if it's doing something correct, but it's really malicious.\n\u2022 **Failure Mode Mitigation:** These are my key takeaways and I'll say thank you so much."}, {"session_id": "1291380", "title": "Workshop: Governing Enterprise AI Agents: Tools, Exploits & Prompt Injection (hands-on with Obot)", "category": "Enterprise & Production", "topic": "Workshops", "type": "Workshop", "video_id": "3Ke2wRBz3_o", "recording_link": "https://www.youtube.com/watch?v=3Ke2wRBz3_o", "company": "Obot", "speaker": "Shannon Williams, Bill Maxwell", "word_count": 8542, "has_transcript": true, "premise": "MCP is quickly becoming the main way AI agents reach enterprise tools and data. Building MCP servers is the easy part. The harder questions are which actions agents are allowed to take, who can take them, and whether you can prove it later. Model guardrails can\u2019t answer those questions, because the controls that work sit outside the model. This hands-on session is for security architects, platform and AI engineers, and engineering leaders who need those answers before agents scale across the org. In this workshop, we will: - Map the agent attack surface: cover how tool integrations get exploited (tool poisoning, indirect prompt injection, rug pulls, cross-server shadowing and confused-deputy attacks), and why the model on its own can\u2019t stop them - Run a live prompt-injection attack: connect Claude Code to a vulnerable support server through the Obot gateway, watch a poisoned ticket pull customer PII and send it out, then trace every step in the audit log. - Break the \u201clethal trifecta\u201d by design: use a virtual MCP server so the agent gets only the tools its task needs, making the same attack impossible. Then add gateway filters for sensitive data and see why an untested filter will leak. - Bring shadow AI under control: use Obot Sentry to inventory local AI clients, MCP servers and skills, forward local tool calls to a central audit log, and block unapproved servers on the device. - Scale governance across the org: cover managed registries, access by user and group, human-in-the-loop approval for high-risk actions, and visibility into token spend. Leave with a working mental model for securing agents: the model isn\u2019t a security control, least privilege beats detection, and governance has to cover gateway and local activity **Space Limited - First Come, First Served. Please bring a fully charged laptop to the workshop** In practice, the primary operational challenge stems from this breakdown: We are have been working on this problem for the last year and a half. You still having the problem as you refresh it?", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: You've got an MCP server and it's working support tickets. The ability to inspect your data and filter and have guard rails around it. We've got an MCP server that gives you all three legs.", "takeaways": "\u2022 **Operational Discipline:** If you remember the 9901 ticket from the previous example was the one that tried to excfiltrate data.\n\u2022 **Production Finding:** So these become important things to be able to look at."}, {"session_id": "1367170", "title": "AAIF Technical Committee Office Hours", "category": "Protocols & Standards", "topic": "Breaks / Meals / Special Events", "type": "Breakout", "video_id": "", "recording_link": "", "company": "N/A", "speaker": "N/A", "word_count": 0, "has_transcript": false, "premise": "Drop by and meet with Manik Surtani (AAIF CTO) and the AAIF Technical Committee, share what's on your mind.", "technical_depth": "The technical architecture presented by N/A (N/A) establishes concrete mechanisms to resolve these failure modes: Drop by and meet with Manik Surtani (AAIF CTO) and the AAIF Technical Committee, share what's on your mind.", "takeaways": "\u2022 **Production Strategy:** Drop by and meet with Manik Surtani (AAIF CTO) and the AAIF Technical Committee, share what's on your mind.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Breaks / Meals / Special Events workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1243642", "title": "Beyond Chat: Lessons Learned Building Intelligent UIs with MCP Apps", "category": "Protocols & Standards", "topic": "Multi-Agent & Distributed Systems", "type": "Breakout", "video_id": "qd3W4iAUv0E", "recording_link": "https://www.youtube.com/watch?v=qd3W4iAUv0E", "company": "Reboot (reboot.dev)", "speaker": "Riley Scheid", "word_count": 4070, "has_transcript": true, "premise": "With MCP Apps, AI interactions are no longer limited to text. MCP Apps unlock the full power of the web within AI chat, letting us build AI-enriched UIs that persist, react and collaborate in real-time. Through demos and code deep-dives, I'll showcase foundational patterns we've found effective as MCP Apps gain ubiquity. Durability: A \"social media management platform\" that persists across conversations, threads, and even different AI clients\u2014shared memory that allows collaboration between authors. Async background tasks: Kick off a long-running process, monitor progress live, and get a completion notification in chat while other work continues. Works even on clients without async MCP support. Realtime sync: watch the async stream back how done it is as it works to completion. You'll leave with patterns you can apply to your own MCP Apps today. In practice, the primary operational challenge stems from this breakdown: What we had to do, some of the some of the problems that we ran into, some of the differences between these environments. I you might still need to do this from time to time, but this problem is largely solved in modern web app programming.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: In fact, in reboot, the very first thing that we do when we try to render an MCP app is we have to know, are we in cloud, are we in chat.openai, are we in dev mode where we want hot module reloading, or we in prod? It needs to work in both the web and as an MCP app. It allows us to share a bunch of the same components, so we're not writing two completely separate apps for, a web app and an MCP app.", "takeaways": "\u2022 **Operational Discipline:** You get the one the one return and importantly this information is returned to the host.\n\u2022 **Production Finding:** Would you still recommend if our apps don't really change as much to go ahead and deploy it?\n\u2022 **Failure Mode Mitigation:** He was, \"Why would you ever want your app to run over to local host?\" It's in production, never."}, {"session_id": "1250899", "title": "Don't Route What You Can't Redact: Sensitivity-Aware LLM Routing", "category": "Security & Governance", "topic": "Open Source Tools", "type": "Breakout", "video_id": "OB4x_byHNhI", "recording_link": "https://www.youtube.com/watch?v=OB4x_byHNhI", "company": "Red Hat", "speaker": "Christopher Nuland, Grace Ableidinger", "word_count": 3700, "has_transcript": true, "premise": "Semantic routing between LLMs typically prioritizes query complexity or latency over data sensitivity, leaking confidential PII, financial records, and medical data from internal tools to third-party hosted SaaS models.", "technical_depth": "Red Hat architected a multi-dimensional routing matrix that evaluates query complexity on the Y-axis and sensitivity classification on the X-axis:\n1. Three-Tier Egress Enforcement: (a) Direct SaaS for public non-sensitive queries; (b) Redact-then-SaaS using Microsoft Presidio and custom regex recognizers to pseudonymize PII (e.g., 'Chris Nuland' -> 'PERSON_1') before external egress; (c) Local-only isolation for high-sensitivity data routed to vLLM-hosted small models.\n2. Low-Latency Classification Engine: Utilizes lightweight local ONNX models for semantic classification rather than high-overhead KV-cache comparisons.", "takeaways": "\u2022 **ONNX Outperforms Semantic Caching:** For high-throughput enterprise workloads (tens of thousands of requests), lightweight local ONNX classifiers provide significantly lower latency and cost than complex semantic cache comparisons.\n\u2022 **Redaction is Not a Replacement for Guardrails:** Redaction sanitizes data at egress, but dedicated input/output guardrails (NeMo Guardrails) remain mandatory at network perimeters.\n\u2022 **Data Sovereignty by Design:** Automatically enforce organizational compliance policies before any token exits the corporate network perimeter."}, {"session_id": "1353088", "title": "Mapping Industry Representation and Gaps in Agentic AI Standards", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Breakout", "video_id": "zFGLlvNm1HQ", "recording_link": "https://www.youtube.com/watch?v=zFGLlvNm1HQ", "company": "The Linux Foundation", "speaker": "Jake Pineda", "word_count": 3226, "has_transcript": true, "premise": "In under a year, the Agentic AI Foundation reached 300 members. We will categorize contributors, maintainers, and funders by industry. We will highlight strong industry representation and identify gaps that need closing. Those who shape standards like MCP, AGENTS.md, AgentGateway, Agent Router A2A and goose define whose needs are met. If key industries teams stay absent, they risk inheriting mismatched specifications and costly workarounds. Attendees will learn which sectors lack a voice and how your organization can get involved.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Sandbox phase is the newest one that was just announced. The sandbox is meant to help fix that and address that and capture these high acceleration projects and high potential projects, Two at the start and it does have quarterly reviews and we have impact projects which obviously MCP.", "takeaways": "\u2022 **Operational Discipline:** I would highly recommend you do so, and reach out to me, I'd be more than happy to point you in the right direction."}, {"session_id": "1362617", "title": "Open Source Software Factories: Building an Operating System for Our Agents", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "plLfvs9QH18", "recording_link": "https://www.youtube.com/watch?v=plLfvs9QH18", "company": "Gas City, Inc.", "speaker": "Chris Sells", "word_count": 4249, "has_transcript": true, "premise": "An operating system has a few core pieces: a process table, working memory, a file system, and a scheduler, all providing services to apps. An agentic OS needs the same services: work to do (the process table), context (working memory), agentic memory (the file system), and workflows (the scheduler). At Gas City, Inc., we've built an open source agentic OS: Beads tracks the work and memories, and Gas City assembles the context and orchestrates the workflows. In this session, we'll walk through the part that surprised us: a software factory is just one kind of app to run on this agentic OS. We keep building others, including the infrastructure on which we run our whole company. In practice, the primary operational challenge stems from this breakdown: My phone was the only device that was having this problem. Nothing was working until I said, \"Oh, dig a little deeper.\" And it said, \"Oh, here's the problem.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: I have, a really cool, registry catalog that I built from scratch long before I thought, \" maybe this is a solved problem. By the way, here's my here's my little registry I built. With a software factory specifically an orchestrator-based software factory what you get are structure and guard rails and quality.", "takeaways": "\u2022 **Operational Discipline:** But one very important thing that they bring is this idea of recursive self-improvement.\n\u2022 **Production Finding:** We experimented across them as I said, but that was one of the big findings we had."}, {"session_id": "1297865", "title": "Ship Your Most Powerful Agent: 7 Factors for Production Guarantees", "category": "Enterprise & Production", "topic": "Building Reliable Agent Systems", "type": "Sponsored Session", "video_id": "XQpE6BefELY", "recording_link": "https://www.youtube.com/watch?v=XQpE6BefELY", "company": "Workato", "speaker": "Zayne Turner", "word_count": 3399, "has_transcript": true, "premise": "You built an agent that's genuinely impressive: memory architecture, eval suite, harness, all dialed in. Then you try to ship it, and it stalls in review. The business needs guarantees: this action has to be authorized at runtime, this payment can only fire once, every change must be auditable, often to a regulatory standard. So you reach for what you have: more guardrails, tighter prompts, supervisor agents. The agent drifts from what made it worth building, and you still can't ship. What you can't guardrail your way around: an agent can't own consequences. Agents are probabilistic by nature. This makes them powerful, and is why correctness can't live with them. Reducing agent capability won't give the business the safety it needs. Seven Factors is an engineering methodology for another path: a deterministic layer that can own the consequences your agent never will. We'll walk through implementation patterns for authorization, idempotency, recovery, audit, more. You'll leave able to spot anti-patterns before building, and techniques to get capable agents to production, even under regulation. Stop fighting your agents. Build the partner they've been missing instead. ******************************* _In order to facilitate networking and business relationships at the event, you may choose to visit a third party\u2019s booth or access sponsored content. You are never required to visit third party booths or to access sponsored content. When visiting a booth or participating in sponsored activities, the third party will receive some of your registration data. This data includes your first name, last name, title, company, address, email, standard demographics questions (i.e. job function, industry), and details about the sponsored content or resources you interacted with. If you choose to interact with a booth or access sponsored content, you are explicitly consenting to receipt and use of such data by the third-party recipients, which will be subject to their own privacy policies_", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: The control plane is what makes it so that your engineering of your agent can handle real consequences. If you have a correctly engineered control plane, that's that's the hope of this framework. Then there's going to be a principles layer that's going to go deep into what does this look in terms of engineering methodology?", "takeaways": "\u2022 **Operational Discipline:** We think that this is something that the industry is converging on, that these are should be the common sense best practices that make it safe for agentic AI in production."}, {"session_id": "1256939", "title": "Shipping Agent Skills Safely: CI/CD, Evals, and Guardrails", "category": "Observability & Evaluations", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "gE7VpVmyLpo", "recording_link": "https://www.youtube.com/watch?v=gE7VpVmyLpo", "company": "Christensen Solutions", "speaker": "Michael Larson", "word_count": 2783, "has_transcript": true, "premise": "Agent skills, prompts, workflow instructions, and attached assets are quickly becoming things teams share, reuse, and depend on. But in many organizations, these are still copied around like helpful notes instead of treated like software that can break, drift, or create risk. This session looks at what it means to build CI/CD for agent skills before rolling them out across an organization. We will cover practical ways to test whether a skill still works, run regression evals, check common failure modes, review tool permissions, test for prompt injection in skill files and assets, and safely roll out changes. The goal is to move beyond \u201cthis prompt seemed to work for me\u201d toward a disciplined engineering workflow for agent skills. Attendees will leave with a practical model for versioning, testing, validating, shipping, and improving agent skills so teams can adopt agentic workflows without creating compounding reliability or security problems. In practice, the primary operational challenge stems from this breakdown: But there's a problem is that how do we know our skills work? Another problem is that skills are being used to deliver malicious attacks.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: The solution is just that we treat it just any other piece of software that we have. Of course using a CICD pipeline so that you can compare different versions with each other and to see if performance is degrading over time. There might be come a time where the model gets so good that it performs better without the skill than with the skill and you need to be able to running a pipeline to know that.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Michael Larson.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1329828", "title": "Your Agents Need a Router: One Integration for Every Model and Tool", "category": "Developer Tools & Frameworks", "topic": "Open Source Tools", "type": "Breakout", "video_id": "rQ8KaTQk4Mc", "recording_link": "https://www.youtube.com/watch?v=rQ8KaTQk4Mc", "company": "Tetrate", "speaker": "Varun Talwar", "word_count": 3805, "has_transcript": true, "premise": "Every agent starts simple: one model, one SDK, a demo that works. Then comes the second provider, the MCP tools, the fallback logic, the rate-limit backoff \u2014 and suddenly half your codebase is integration glue that has nothing to do with what your agent actually does. Agent Router \u2014 newly donated to the Agentic AI Foundation, with a 1.0 GA release and production deployments at scale \u2014 collapses all of it into a single integration: every model, every tool, one declarative API. We'll walk through a live agent workload end-to-end: routing across model providers with automatic failover; understanding exactly what each agent and team spends \u2014 and capping it before it surprises you; and choosing which MCP tools each agent can see and call. All declared in one place, none of it in your application code. You'll leave knowing exactly where a router fits in your agent stack, what it takes to run one in production, and how to get involved in the Agent Router project. In practice, the primary operational challenge stems from this breakdown: There's a lot that adds up when it comes to cost, capabilities, there's a lot of model choices out there and they're fast evolving. The root of this is there are problems in the agent that shouldn't really be coded in the agent.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: The other things is which is well known is the protocol differences. You do need to handle AI traffic in a little bit different way when it comes to the gateways that are in between, which are enabling things model virtualization and model choice. Obviously in you, it sits in between I think your agent and the models and tools.", "takeaways": "\u2022 **Operational Discipline:** In the summary message is, you should have your agent focus on reasoning and let a middleware router this do the traffic problems and security problems and credential handling, retries, availability problems.\n\u2022 **Production Finding:** I have something running in production with non-deterministic Right."}, {"session_id": "1262097", "title": "Your Tool Is in Another Castle: How Five Frameworks Reshape the Same MCP Server", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "mF_pCrFvGY0", "recording_link": "https://www.youtube.com/watch?v=mF_pCrFvGY0", "company": "Arcade.dev", "speaker": "Thierry Damiba", "word_count": 4182, "has_transcript": true, "premise": "\"Isn't the whole point of MCP that every client behaves the same???\" That's the promise...until you run one server through five agent frameworks and watch the model receive five different things. Schema fields vanish, descriptions get truncated, one server's single tool shows up as sixty-two in another, error semantics quietly change. The USB of agents, it turns out, ships with three different connectors. Some of that is the MCP client. Much of it is the harness above it making its own calls about tool search, result retrieval, and context management. A client can be perfectly spec-compliant and still reshape what your tool looks like. This talk separates those layers and makes the differences measurable, using real jobs-to-be-done that deliberately stress MCP capabilities like resources, progress, and structured output. (Dropping fields isn't always bad! But it should always be visible.) You'll leave with a layered mental model for blaming the right layer, a jobs-to-be-done method for benchmarking client compliance, defensive patterns for tool authors, and mcp-mirror: an open-source diff tool plus a public, data-driven leaderboard. In practice, the primary operational challenge stems from this breakdown: The problem is this intern is stuck in a room with no windows, no internet, no computer, no clock. The problem here is that there's no standardization here of how it should happen exactly.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: The problem here is that while MCP has standardized what should come back, In framework A, we get a real tool call where the card was declined. Some of the enterprising engineers in here might be thinking well one second.", "takeaways": "\u2022 **Operational Discipline:** I can show you this as well where I went through and I measured cloud code, cursor, gemini, open code, goose, client, codeex cli, and we have these different things that I'm measuring the frameworks on.\n\u2022 **Production Finding:** Just because a tool says destructive and you have a rule that says don't do any destructive without human approval, you can't trust it because it might get dropped depending on the framework that you're using.\n\u2022 **Failure Mode Mitigation:** Then also always I recommend pending versions so if something changes you won't get surprised.\n\u2022 **Deployment Rule:** That's really the big takeaway and the big focus here with this presentation is when you're building an MCP server, you cannot just trust the conformance test."}, {"session_id": "1357702", "title": "Agentic State Machines: Turning an Agent Loop into an Experimentation Platform", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "Xu_wu17C4b4", "recording_link": "https://www.youtube.com/watch?v=Xu_wu17C4b4", "company": "Block", "speaker": "Douwe Osinga", "word_count": 3909, "has_transcript": true, "premise": "Agent loops started simple: ask a model what to do, run a tool and return the result. As agents gained approvals, context management, hooks, skills, retries and steering, that loop became a tangle of concerns influencing one another. This talk explains how goose replaced its central loop with a re-entrant state machine. The conversation is the state, and independent but cooperative Operations inspect that state and return effects. We will look at what this changes for cancellation, persistence and testing, then follow a real experiment: using a decision model to select reasoning effort for each user turn. The experiment remains one removable Operation; inference and tool execution never need to know it exists. The result is not only cleaner architecture. It turns goose into a platform where new agent behaviors can be tested without first redesigning the entire agent. In practice, the primary operational challenge stems from this breakdown: One of the problem with this though is that over time we added more and more concerns to this simple concept.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: That's what we observed in in goose where our original state machine was a few hundred lines and it exploded to a few thousand lines with lots of things checking here and there what was going on. So, after a tool call or before a tool call, you execute this hook and the hook does something. A skill operation owns its own slash command, the tool, and the prompts for skills.", "takeaways": "\u2022 **Operational Discipline:** We've the main thing in our test code now is just a state machine that is exactly the same state machine as we run in production except for that we've replaced the HTTP component in the thing with something that is a scriptable engine.\n\u2022 **Production Finding:** Now we can run the exact agent harness exactly the way that we would do in production except that we feed it in with a script.\n\u2022 **Failure Mode Mitigation:** So, the is the purpose of this approach to add more traceability and detect failure modes even before we move to production?"}, {"session_id": "1258037", "title": "Context Is the Substrate: Production Patterns for Knowledge-Graph-Backed Agents", "category": "Enterprise & Production", "topic": "Building Reliable Agent Systems", "type": "Breakout", "video_id": "mkoN1DMoUTU", "recording_link": "https://www.youtube.com/watch?v=mkoN1DMoUTU", "company": "Praxa, Inc", "speaker": "Cassie Shum", "word_count": 4726, "has_transcript": true, "premise": "Coding agents can open a pull request in minutes. Whether that change is correct, traceable, and worth keeping is a different problem, and it is the one that decides whether an agent fleet is an asset or a liability in production. This talk shares patterns from running a knowledge-graph-backed agent fleet in production, where humans and agents work on the same codebase, on the same timeline, against the same audit log. Here are some examples of those patterns: -Context as a bundle: assemble everything a task needs up front, instead of letting the agent retrieve chunk by chunk at query time. -Provenance as working memory: an audit trail the agent reads to know what it did to understand why a decision was made. -Code as truth: reconcile intent and reality - Visibility as a query: treat throughput, context size, cost, and audit completeness. A recurring theme: agents are a fast, honest mirror of your engineering culture. The same fleet, pointed at a healthy codebase and a brittle one, produces very different outcomes at identical speed. We close on where this connects to MCP, AGENTS.md, and the broader push toward structured, interoperable context. In practice, the primary operational challenge stems from this breakdown: Just some problem statements in the very beginning. So, just in some of the enterprises we've been working with over the last year, we're seeing some of these trends of what the bottlenecks are that's inhibiting this AI impact that we're seeing.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: You heard a lot about evals, and how do we verify that what we had the spec in is what's in production now? Previously, I would sit in a scrum room, and I would talk to my product manager and we would talk about the specs and then I would develop it and then I would test it and then we put in front of the customer. I'm going to talk about four different patterns that we have been working on and this will derive out at least what we have seen in the customers.", "takeaways": "\u2022 **Operational Discipline:** The reason being is because if any of those things go out into production and produce some defect or bug that causes an outage, how do you trace that back and where does it go to?\n\u2022 **Production Finding:** I don't know why it doesn't work in production,\n\u2022 **Failure Mode Mitigation:** If you build up the infrastructure that you can sandbox an environment that's very similar to production, you're going to have a better chance with your agents because it's going to figure out what that environment is.\n\u2022 **Deployment Rule:** So, visibility is really important and I know people talk about ooh, dashboards and things that."}, {"session_id": "1257163", "title": "From Pain Points to Production: What We Learned Building MCP-Powered ChatGPT Apps", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "98lX-rnv1Do", "recording_link": "https://www.youtube.com/watch?v=98lX-rnv1Do", "company": "Alpic", "speaker": "Nikolay Rodionov", "word_count": 3537, "has_transcript": true, "premise": "Building ChatGPT Apps with MCP sounds straightforward\u2014until you hit the real-world challenges: double iframes breaking your CSP, data sync issues between model and UI, mysterious HTML caching that defeats hot reload mobile testing that seems impossible\u2026 At Alpic, we shipped multiple production ChatGPT Apps and distilled our hard-won lessons into Skybridge, a modern framework that accelerates MCP app development. In this talk, we'll share the practical patterns that actually work: managing widget state across the model-UI boundary, navigating Content Security Policy constraints, leveraging widgetParameters for tool visibility control, and handling multi-step conversations with intentional widget replacement strategies. We'll cover concrete solutions including our dev server that solves OpenAI's HTML caching problem, how we enabled mobile testing, and why we added React hooks like `useCallTool` and Zustand-based store state management. Whether you're building your first ChatGPT App or scaling to production, you'll leave with actionable best practices you can apply immediately. In practice, the primary operational challenge stems from this breakdown: But, the problem is that because of this iframe architecture, MCP apps are not compatible with all of the dev tools that have been built for modern web applications over past 10 years. We built a framework to solve most of these problems.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: As I was saying, MCP apps are an extension of MCP servers and so with a normal MCP server you would have an AI agent or MCP client that can decide to call a tool available on the MCP server, for instance, search products. The MCP server returns structured data the product name, description, or prices. When with an MCP app, what happens is that the server will not only return the structured data, but it will also return an HTML resource that will then be rendered inside the MCP host inside an iframe.", "takeaways": "\u2022 **Operational Discipline:** The solution to that, as I was saying, is to put a summary of the of the response that you're showing in the UI in your in your structured content.\n\u2022 **Production Finding:** So I strongly recommend you to, try it to make it to make the agent UI interaction a lot faster and, smoother.\n\u2022 **Failure Mode Mitigation:** Let's see, what you should be careful of while moving your MCP app into production.\n\u2022 **Deployment Rule:** Don't forget to double-check them when you go into production."}, {"session_id": "1253934", "title": "Making Swarm Work: Coordination Primitives for Decentralized Multi-Agent Systems", "category": "Multi-Agent & Orchestration", "topic": "Multi-Agent & Distributed Systems", "type": "Breakout", "video_id": "lJVWCQt7Tho", "recording_link": "https://www.youtube.com/watch?v=lJVWCQt7Tho", "company": "Cisco", "speaker": "Jodee Varney", "word_count": 4579, "has_transcript": true, "premise": "Swarm architectures matter when coordination itself is the hard problem. Central orchestration works well for decomposable tasks with clear authority, but it breaks down in open-ended coordination: multi-party negotiation, conflicting objectives, partial knowledge, dynamic membership, and cases where no single agent has enough context or authority to direct the work. This session explores what it takes to support peer-to-peer coordination in open source agent systems. Using Mycelium, an open source project we have been working on, we will demo coordination primitives such as agent discovery, intent alignment, constraint negotiation, and shared state across a collectively evolving task. This session will show where current collaboration features in OpenClaw-style agent systems fall short when agents need to coordinate as peers rather than simply exchange delegated tasks. Attendees will come away with a clearer understanding of the coordination problems that arise in peer collaboration, practical approaches to address them, use cases where swarm is the right fit, and the infrastructure needed to support swarm patterns. In practice, the primary operational challenge stems from this breakdown: We've seen in the news about more loosely constructed agent teams and swarms going off and tackling problems. We started moving towards a orchestrator system for many reasons beyond just the memories issue, but we you'll see this a lot in the wild where one agent is handing work off to sub agents.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Two, maybe we have conflicting objectives that we legitimately want to represent and you want to make sure that you're making real tradeoffs and not just one agent making the decision, the orchestrator on behalf of others. That isn't that isn't necessarily restrict you to a swarm type system, but it is one of the aspects that is interesting. But as soon as I said earlier, as soon as you cross the boundaries between teams or companies, it's really hard to have a single orchestrator.", "takeaways": "\u2022 **Operational Discipline:** Then that say shared summary is saved to the room's memory.\n\u2022 **Production Finding:** But then a summary again, written back to memory that includes all those open items.\n\u2022 **Failure Mode Mitigation:** Then a fixed rule chooses the option whose lowest rating is highest and you'll I'll you'll see an example here so you can understand what that means.\n\u2022 **Deployment Rule:** Again, the rule picked the option at least happy member liked the most."}, {"session_id": "1330567", "title": "Stop Making Agents Guess: Engineering Context at the Gateway", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Sponsored Session", "video_id": "ukItLVv2rCc", "recording_link": "https://www.youtube.com/watch?v=ukItLVv2rCc", "company": "CData", "speaker": "Amit Naik", "word_count": 3101, "has_transcript": true, "premise": "AI gateways have emerged to solve the agent governance and runaway token spend challenges facing enterprise teams today. They offer control over how requests are routed, how data is reached, and who is allowed to do what. But static routing and token budget control is only half the battle. In this session, CData\u2019s VP of AI Architecture Amit Naik will lay out why a gateway must also provide meaning to truly drive token efficiency, agent control, and companywide trust. Join as Amit walks through the four types of context that deliver meaning to any prompt, how that context should be surfaced at each stage of the prompt journey, and where the context layer must live within the gateway architecture to dynamically build new company knowledge with every AI interaction. ******************************* _In order to facilitate networking and business relationships at the event, you may choose to visit a third party\u2019s booth or access sponsored content. You are never required to visit third party booths or to access sponsored content. When visiting a booth or participating in sponsored activities, the third party will receive some of your registration data. This data includes your first name, last name, title, company, address, email, standard demographics questions (i.e. job function, industry), and details about the sponsored content or resources you interacted with. If you choose to interact with a booth or access sponsored content, you are explicitly consenting to receipt and use of such data by the third-party recipients, which will be subject to their own privacy policies_ In practice, the primary operational challenge stems from this breakdown: Before we dive into the problem that we are trying to talk about today, a little bit about CData. There is a huge explosion of people who are trying to connect to different models, who are trying to spin up MCP servers, create stdout, fork GitHub repos, whatnot, and trying to get at your enterprise data.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: I got AI gateway, and there are lots of AI gateway products in the market. This is where context engineering starts to have a role. One is what does context engineering have to do with an AI gateway, and how that helps with the AI gateway stack.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Amit Naik.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1258050", "title": "The Agentic Orchestration Stack: Durability, Guardrails, and Attestation", "category": "Observability & Evaluations", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "qGG4QzZ_Hzk", "recording_link": "https://www.youtube.com/watch?v=qGG4QzZ_Hzk", "company": "Diagrid", "speaker": "Yaron Schneider", "word_count": 4698, "has_transcript": true, "premise": "AI agents introduce a fundamentally different orchestration problem. Unlike traditional workflows, agents make decisions at runtime, interact with humans and external systems, and often execute over hours, days, or weeks. Durable execution is a necessary foundation - but durability alone is not enough. As agents become responsible for increasingly important tasks, organizations need the ability to prove what happened, verify who or what performed an action, enforce policies and guardrails, and establish trust in execution outcomes. This requires a new set of capabilities that go beyond workflow orchestration, including identity-aware execution, cryptographic attestation, execution provenance, and verifiable audit trails. In this talk, we'll explore the shift from workflow orchestration to agentic orchestration and the architectural patterns emerging to support it. Attendees will learn how durable execution, guardrails, and cryptographically verifiable execution histories work together to make autonomous systems reliable, governable, and trustworthy in production. In practice, the primary operational challenge stems from this breakdown: As we want to give it more and more autonomy, we're going to be encountering more of these problems. AI didn't eliminate distributed systems problems.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: So, in the workflows working group, we're really trying to envision how agentic workflows are going to be seen. For example, there's lots of companies who build on traditional workflow semantics BPMN. That's just the nature of the transformer architecture.", "takeaways": "\u2022 **Operational Discipline:** This is really important because you want to remove things from the way the LLM does things by just reasoning about stuff it shouldn't reason about.\n\u2022 **Production Finding:** This is going to become extremely important with agents.\n\u2022 **Failure Mode Mitigation:** It's not really focused on production layer infrastructure.\n\u2022 **Deployment Rule:** One open source project that I recommend you check out is Dapr."}, {"session_id": "1258054", "title": "What Happens When You Integrate MCP and A2A at the Infrastructure Layer", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Breakout", "video_id": "PpTfGwnIhBE", "recording_link": "https://www.youtube.com/watch?v=PpTfGwnIhBE", "company": "Vultr", "speaker": "Mohamed Maktal", "word_count": 4086, "has_transcript": true, "premise": "MCP and A2A both let a client hand off long-running work and check back later, trusting the server to report progress. When the process doing the work crashes or hangs, the one party that could report the failure is gone. The client sees \"working\" until its timeout gives up. I hit this gap working with agent sandbox providers, then again building a persistent agent runtime. Sandboxes are built for short, disposable jobs, where a lost task costs one retry. Once work runs for hours, that retry stops being cheap. Closing it takes no new protocol and no SDK inside the agent. The agent's supervisor, whether a VMM, systemd, or a container runtime, already sees the crash, the hang, and the restore. This talk shows how to feed those signals into the task states both protocols define: end client connections at the host, keep the task record outside the owning process, and translate supervisor events into task transitions. For each protocol, I'll show what the client sees when the worker crashes or hangs, before and after runtime awareness, with time-to-detection and task-survival numbers against a reverse proxy with liveness probes. All of it runs on stock microVMs. MCP first, then A2A. In practice, the primary operational challenge stems from this breakdown: That's definitely something that is a cost to the labs, and it also it also slows down their progress at that point as well. I guess the there's three different ways we can alleviate a lot of these issues and ensure that number drops down significantly.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Then from there, you're able to essentially isolate and have your tools and your tool calls all done through a specific channel that you that you choose at that point. But the I the most part I guess what this really matters is just to show you why the failures occur at the sandbox level rather than I guess just go over it. If you see here, the agent call goes directly to the or the LLM call goes directly to the agent harness, and then to the tool MCP, then back to the harness, and then back to the model.", "takeaways": "\u2022 **Operational Discipline:** It's all the best practices that we're carrying over from infrastructure now into this world of agents."}, {"session_id": "1254115", "title": "Your Agent Sandbox Is Built Backwards", "category": "Security & Governance", "topic": "Building Reliable Agent Systems", "type": "Breakout", "video_id": "RPy2bI72lD8", "recording_link": "https://www.youtube.com/watch?v=RPy2bI72lD8", "company": "Edera, Edera, Inc.", "speaker": "Dan Fernandez, Ariadne Conill", "word_count": 3444, "has_transcript": true, "premise": "Most agent security starts with broad authority and chips away at it: pre-approved command lists, destructive-action warnings, trust tiers wrapping a shell. Claude Code is the most sophisticated public version of this subtractive model, and it is excellent engineering. The trouble is the model. You have to anticipate every dangerous thing an agent might do, and agents decide what they do at runtime. An older idea from operating-systems security inverts it. Start the agent with zero authority and inject scoped capability objects. There is no policy to bypass, because authority that was never minted cannot be invoked. An agent cannot hallucinate past a capability it was never given. We will trace what the additive model takes in practice: capabilities minted narrow, narrowed further when delegated, and gone after a single use. The lifecycle that grants authority is also the audit trail, which beats reconstructing which policy was active when something went wrong. You will leave able to tell whether your own agent starts from everything or from nothing. In practice, the primary operational challenge stems from this breakdown: As we know, there's some long-lived tokens, and that leads to a lot of issues. As you see, there's a significant increase on those vulnerabilities over time.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: You have a self-hosted development sandbox that started out as just, running local Docker containers on your laptop with coding agents CLIs, etc. Enterprises usually started transitioning to some managed development sandboxes. For example, you have specific timeouts that you your sandbox can only be alive for a handful of minutes.", "takeaways": "\u2022 **Operational Discipline:** In our case for we are recommending micro VMs for this because that's going to be a strong boundary as long as the VMM holds or hypervisor holds or whatever.\n\u2022 **Production Finding:** OAuth 1.0, I'm sure all of you remember Twitter back in the day where you would log in and then you could have other apps connect to Twitter."}, {"session_id": "1258292", "title": "Agent Governance Lives in the OS", "category": "Security & Governance", "topic": "Open Source Tools", "type": "Breakout", "video_id": "QcRXgSNsgb4", "recording_link": "https://www.youtube.com/watch?v=QcRXgSNsgb4", "company": "Microsoft", "speaker": "Alexander Sklar, Roberth Karman", "word_count": 3162, "has_transcript": true, "premise": "Governance is what we want from agent systems: to know, and prove, what an agent did, what it was allowed to do, and what it could not. Most of the conversation about how to get there happens at the wrong layer: protocol design, permission prompts, system prompts. Those help. They are not enforcement. What actually decides whether an agent reads your SSH keys is the OS. So, if governance is the goal, OS-level security is the mechanism, not a parallel track or a downstream concern, but the foundation. This talk takes that seriously. We built Microsoft Execution Containers (MXC) because agents needed it: an open-source cross-plat policy runtime that decides, per tool invocation, what files, network, and processes are in scope. It composes with what each OS provides (bubblewrap, seatbelt, AppContainer) rather than replacing them, and lets one policy say something coherent across all three. We will cover where the thesis holds up, where platform primitives do not compose cleanly, and what is not yet solved by any of this, including the agent loop itself. Production agent systems require this layer. The session is an invitation to shape what it should look like, together. In practice, the primary operational challenge stems from this breakdown: It's important to limit what such new type of users can do and how they do that work for their humans. The agent is setting its own its own guards as it's working through the problem it has at hand.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Then, as part of the agent doing its work, it's going to choose to run some tools, perhaps. So, the agent might in either inadvertently or on purpose, request to launch a tool with broad access to the whole file system, They can see that this sandbox creation was denied because, there's this policy that prevents that from happening.", "takeaways": "\u2022 **Operational Discipline:** Not the creator of rules, not the creator of policy, but the enforcer of them.\n\u2022 **Production Finding:** Upfront, define what you need in order for your tool to work so that AI vendors, agent vendors, AI gateways, and the OS can adapt and make sure that everything plays by the rules.\n\u2022 **Failure Mode Mitigation:** Workflows that you can trust to put into production in your in your environments and have your users be successful and performant,"}, {"session_id": "1333386", "title": "Agentic AI from Cloud to Edge: Building Intelligent Systems on Arm", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Sponsored Session", "video_id": "dECG1NNfK80", "recording_link": "https://www.youtube.com/watch?v=dECG1NNfK80", "company": "Arm", "speaker": "Sudheera Vanguri", "word_count": 3288, "has_transcript": true, "premise": "AI agents are moving beyond answering questions to executing workflows, interacting with tools, and taking action in the physical world. Supporting these applications requires an infrastructure and software stack that spans cloud computing, edge inference, and connected devices. In this session, Arm engineers explore how agentic AI is changing infrastructure requirements, including new approaches to benchmarking agentic workloads and the role of Arm-based CPUs in supporting these systems. We\u2019ll then look at how these applications extend beyond the cloud, using Arm Device Connect to enable agents to discover devices, understand their capabilities, and interact with the physical world. ******************************* _In order to facilitate networking and business relationships at the event, you may choose to visit a third party\u2019s booth or access sponsored content. You are never required to visit third party booths or to access sponsored content. When visiting a booth or participating in sponsored activities, the third party will receive some of your registration data. This data includes your first name, last name, title, company, address, email, standard demographics questions (i.e. job function, industry), and details about the sponsored content or resources you interacted with. If you choose to interact with a booth or access sponsored content, you are explicitly consenting to receipt and use of such data by the third-party recipients, which will be subject to their own privacy policies_", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: That these spread from the client and edge devices and then they also have certain cloud workloads. It's a hybrid deployment zone and again some of the dominant tools that these personal agents operate with are documents media and it's some local models that they run as well. Just to go into one if you to take a software engineering use case a model may turn out code but then a CPU then spins up a sandbox and runs that code and executes it in its own sandbox isolated environment and then may do repeated trials on top of that code.", "takeaways": "\u2022 **Operational Discipline:** We want to collaborate with other industry providers because this is a very important problem."}, {"session_id": "1253860", "title": "Authorization After OAuth: Controlling Tools on Hosted MCP Servers You Don\u2019t Own", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Breakout", "video_id": "oGuj56_aOWo", "recording_link": "https://www.youtube.com/watch?v=oGuj56_aOWo", "company": "Pomerium", "speaker": "Nick Taylor", "word_count": 4552, "has_transcript": true, "premise": "Hosted MCP servers usually give you two knobs: broad OAuth scopes upstream, and tool exposure at deploy time. Your engineers may be allowed to do almost anything GitHub permits. Their agents should not. You might want an agent to open a pull request, but leave merging to a human. If you do not operate the hosted server, you cannot add that distinction there. This talk shows how to close that gap with an identity-aware bridge. Pomerium sits in front of a hosted MCP server, handles OAuth for the user, evaluates per-tool and per-identity policy on each MCP call, and audits tool names and arguments. The interesting part is applying a proven proxy pattern to MCP so authorization happens at runtime, not deploy time. I will demo this live against GitHub's hosted MCP server, with the audit log visible. The agent opens a pull request. Then we flip one policy toggle and the same agent is blocked from merging, without changing the client, server, or GitHub permissions. GitHub is the marquee demo, but the pattern is broader: add policy and audit controls for hosted MCP servers you don't own. In practice, the primary operational challenge stems from this breakdown: But the problem with OAuth scopes is they're coarse-grained.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Is anybody using this with MCPs they have, whether it's your orgs or just ones you use? But that doesn't really scale long-term in terms of maintenance, especially if you're a even a medium-size company. Once you deploy your MCP or you register it in ChatGPT or VS Code or whatever you're using, that's it.", "takeaways": "\u2022 **Operational Discipline:** The everything I showed you and walked through today, I have a lesson here that you can use and go ahead and do.\n\u2022 **Production Finding:** That's just the one lesson and if people are interested, I have a full MCP course."}, {"session_id": "1258176", "title": "Data Agents over S3: Build the Missing Semantic Layer for Files", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "0o93aKBvuYQ", "recording_link": "https://www.youtube.com/watch?v=0o93aKBvuYQ", "company": "DataChain", "speaker": "Dmitry Petrov", "word_count": 4482, "has_transcript": true, "premise": "Point your coding agent, Claude Code, Codex, or open-source Pi, at a terabyte of files in a bucket and ask a question. It runs a model over everything: hours, real money. Every follow-up repeats the full cost, from zero. Today's data agents run on the warehouse, where the hard part is already done: schema, lineage, and a semantic layer that says which data to trust. Most of your data has no warehouse. It sits on S3 as files, just bytes and paths, with no schema, no lineage, and no semantic layer. So the agent builds that layer, and that is what makes it efficient. Its loop changes: before answering, it asks which layer is missing, builds it, then answers from it. Each pass leaves a typed, versioned, lineage-tracked dataset, so the layers compound. This is data modeling for unstructured data: what limits an agent is the structure you build, not the size of the model. Those layers serve every agent, not just the one that built them. Expose them over MCP, datasets as resources and queries as tools, and they become shared, deterministic state. I show it live: one agent builds the result, a different client answers from it in seconds, recompute-versus-recall gaps in the millions. In practice, the primary operational challenge stems from this breakdown: First of all, the building this knowledge base or context layer it's a not a simple problem in general, Problems this, but there's a lot a lot a lot more,", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: And of course, they built a trust machinery, what you should trust, what you shouldn't trust. If you don't have this information agents hallucinating badly and schema that's a usual data stuff right to understand what is inside how to work with this how to generate efficient code to work with that. I guess what I'm asking is let's say in an extreme scenario all of that were in your data structure and tooling is the query ability equally fast or can I also do complex joins and indexes and things in my object storage by what you're proposing?", "takeaways": "\u2022 **Operational Discipline:** If you work with data, how important data lineage, data dependency are, but for agents, it's not important.\n\u2022 **Production Finding:** You need compute to make this context and what is more nuance and important.\n\u2022 **Failure Mode Mitigation:** For example, I'm commonly finding myself having to move large amounts of data off of Postgress into object storage now.\n\u2022 **Deployment Rule:** I'd be curious number one, are there any particular repositories or skills you would recommend for augmenting data in general in data cleaning processes?"}, {"session_id": "1257835", "title": "How Contexts Fail (and How to Fix Them)", "category": "Developer Tools & Frameworks", "topic": "Open Source Tools", "type": "Breakout", "video_id": "btuLWMpzwtI", "recording_link": "https://www.youtube.com/watch?v=btuLWMpzwtI", "company": "cmpnd.ai", "speaker": "Drew Breunig", "word_count": 7774, "has_transcript": true, "premise": "Million-token context windows promised to make agent-building easy: connect every tool, dump in every document, and let the model sort it out. In practice, the opposite happens. As an agent's context grows, performance degrades in surprising ways. And the failures get worse precisely in the situations agents live in: multi-step tool calls, accumulated history, and information pulled from sources that don't agree with each other. This talk breaks down the ways long contexts fail using concrete, measured example. Then we get practical, walking through tactics for fixing your context or preventing failures in the first place, with real results behind each. Context is not free. Every token influences the response, for better or worse, and the job of the agent builder is deciding what earns its place. We'll close with where this is all heading, why the most robust answer to context rot isn't hand-tuning prompts but treating context as something you assemble and compile programmatically, and what that looks like in practice. In practice, the primary operational challenge stems from this breakdown: We're going to walk through context fails and fixes. But with more context, we had room for more problems.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: After 100,000 tokens, it almost always started to loop and fall apart. You can do tool loadout, which is basically choosing what tools come in, or what skills come in, so you don't overload it. I recently was talking to an enterprise team who said, \"All of a sudden our agents are doing terrible.\" And we investigated and we found out that their enterprise software was loading 600 skills for every single engineer when they started.", "takeaways": "\u2022 **Operational Discipline:** Even in OpenAI's prompting guide, they will say things, \" if you're calling this and you want the answer in Python, we recommend you put import something at the end of your prompt cuz that gives it a clue that this is Python time now.\n\u2022 **Production Finding:** I'm good friends with Jesse, so I'm always going to recommend superpowers and the new brainstorming skill he pushed in seven is wonderful.\n\u2022 **Failure Mode Mitigation:** Opus 5 is not doing well for everybody and their advice delete all your skills.\n\u2022 **Deployment Rule:** You're, well, what if I have important information that I want you to follow?"}, {"session_id": "1258098", "title": "Open Source Has Been Here Before: Sustainability Lessons for Agentic AI", "category": "Developer Tools & Frameworks", "topic": "Open Source Community & Ecosystem Health", "type": "Breakout", "video_id": "W-9xslRp2oo", "recording_link": "https://www.youtube.com/watch?v=W-9xslRp2oo", "company": "JetBrains", "speaker": "Katherine Druckman", "word_count": 4309, "has_transcript": true, "premise": "MCP crossed 110 million SDK downloads a month, with well over ten thousand servers. The agentic ecosystem is scaling faster than almost anything open source has seen, and a surprising amount of what agents depend on in production runs on single maintainers and on reference servers that shipped as demos and quietly became infrastructure. Open source has lived versions of this before: a single maintainer carrying a package with hundreds of thousands of weekly downloads, the cURL project pulling its bug bounty under a flood of AI-generated reports that overwhelmed a small volunteer team. Every dependency an agent relies on becomes a responsibility, and someone is carrying that load. Agentic AI concentrates the social contract open source has always run on, because these dependencies now sit underneath software that acts on its own, calling tools and moving data. What used to be a hidden flaw is now one an agent will act on, at machine speed. We'll talk about supporting maintainers, making contribution the default, narrowing the gap between who consumes and who gives back, and staying responsible humans while the standards are still being shaped. In practice, the primary operational challenge stems from this breakdown: When Heartbleed was disclosed around 17% of the internet's secure web servers were believed vulnerable. 12 years since Heartbleed, and the struggle is still ongoing.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: You know, of course, a tool can run every one of those checks. I spent the last part of that talk talking about things scorecard and CV bin tool, and I still, of course, recommend a lot of those types of tools. If you've not seen this one on the left, and I suspect you have, this is XKCD 2347, all of modern digital infrastructure stacked up, resting on one block held up by one person in Nebraska who's been maintaining it unthanked since 2003 or so.", "takeaways": "\u2022 **Operational Discipline:** Philip's talk, by the way, went into far more and I recommend looking it up because it's one story in a sea of many as we all figure this out together as a community."}, {"session_id": "1360383", "title": "The Agentic Web for Industry Verticals", "category": "Enterprise & Production", "topic": "Enterprise Adoption in Practice", "type": "Breakout", "video_id": "kOItZdwge2o", "recording_link": "https://www.youtube.com/watch?v=kOItZdwge2o", "company": "Microsoft", "speaker": "Andrew Nolan", "word_count": 3311, "has_transcript": true, "premise": "Tools for agents are important, but how will industries with unique scenarios, risks, and obligations serve their customers at scale? Drawing on his work as co-creator of WebMCP and chair of the Agentic AI Foundation's Applied Industries Committee, Andrew Nolan explores the challenges industries face in adopting the agentic web and how innovators and leaders are working to address them. Attendees will leave with a clearer picture of where the agentic web has unique needs, what slows adoption at industry scale, and how to bring their own use cases into the conversation. In practice, the primary operational challenge stems from this breakdown: Instead I want to talk about other challenges that are facing the agentic web. Again, it's pointing to something that's broken.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: These are some of those six patterns of things that I have heard from talking to industry leaders in various sectors. This is potentially the biggest topic right now, cross ownership concerns, especially when we're talking on the web. Our committee is bringing these industry leaders together and it serves as a horizontal place to understand needs, requirements, and gaps in specific industries.", "takeaways": "\u2022 **Operational Discipline:** It's a great percentage of the population of the employees of utilities."}, {"session_id": "1348542", "title": "The Model Proposes, the Server Decides: Shipping a Payment MCP Server to Hosts You Don\u2019t Control", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "nuSYKTrgQdc", "recording_link": "https://www.youtube.com/watch?v=nuSYKTrgQdc", "company": "Vstorm, VStorm", "speaker": "Antoni Kozelski, Bartosz Gonczarek", "word_count": 3199, "has_transcript": true, "premise": "We built a production-grade MCP server that lets an AI assistant configure, quote, and order printed products and send a payment link. Connected to Claude, ChatGPT, Claude Code, and Codex, it behaved four different ways: some hosts cut or ignored our instructions, some could not show the payment button, and one sometimes used its own tools instead of ours. This talk explores those differences, why rules for irreversible steps now live in the server rather than the model, and how the server handles a large product catalog without exposing it to the client. It also covers how these lessons led us to contribute to open-source frameworks and projects. In practice, the primary operational challenge stems from this breakdown: The issue is and this is how this works is that the host needs to decide based on limited exposure on what users doing with their AI assistant. There are four problems that we identified when working on the solution that I want to tell you about.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: The host connects using tool calls with our MCP server where we have business logic exposed in form of agent as tools that leverage the back end with the printing catalog from Renderil. We were thinking of how to even call this scenario because it is from the business perspective agent to agent scenario, but we don't we cannot call this. This is more of agent that is using MCP to communicate with other agents as tools scenario just to be very specific what that really is.", "takeaways": "\u2022 **Operational Discipline:** We decided to drill it down to five rules for an MCP server when you build similar solution that would allow you to control what happens on the on the host and without risking irreversible decisions.\n\u2022 **Production Finding:** First one is to keep load bearing rules out of the server instructions because we know those are not read by all of the hosts.\n\u2022 **Failure Mode Mitigation:** I think that's the best way to contribute is to take what we've learned in each and every project and put it into open source so you don't have to replicate the mistakes or learnings that we had as V-Storm."}, {"session_id": "1292371", "title": "Workshop: Secure Agentic Framework (SAF) for Agentic AI", "category": "Developer Tools & Frameworks", "topic": "Workshops", "type": "Workshop", "video_id": "ZRFzc3gqwn0", "recording_link": "https://www.youtube.com/watch?v=ZRFzc3gqwn0", "company": "Dell Technologies, Microsoft, TestifySec, The Linux Foundation", "speaker": "Sarah Evans, Jautau \u201cJay\u201d White, Frederick Kautz, Laura Guazzelli", "word_count": 14193, "has_transcript": true, "premise": "The Secure Agentic Framework (SAF) is an open-source, community-driven architecture for defending agentic AI. This hands-on workshop puts an AI skill in participants' hands: it scans a vulnerable reference environment, surfaces what is exploitable and why, and maps each finding to a concrete mitigation that attendees apply and re-scan to confirm it clears. We cover SAF's two core implementations: SAF for MCP, securing the Model Context Protocol for AI tool integration, and SAF for k8s, hardening agentic runtimes in Kubernetes. Built on two years of adversarial research, the SAF for MCP matrix maps 65 attack techniques across 14 tactics, flagging threats like Tool Poisoning, Command Injection, and the MC
