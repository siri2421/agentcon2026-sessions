P Rug Pull. Unlike high-level frameworks such as MITRE ATLAS, it offers the protocol-level specificity dynamic, tool-integrated agents require. Attendees leave able to identify vulnerabilities in their own deployments, apply SAF controls, and contribute to this open-source framework. **Space Limited - First Come, First Served. Please bring a fully charged laptop to the workshop** In practice, the primary operational challenge stems from this breakdown: And we ran into this scenario where we were worried about peak, Kubernetes what happens after that as the maintainers start to drift away from companies no longer paying over time. Fast forward a couple years later, we still had this problem of alignment.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: We have this behind the, the journey and you can see that there's various tool calls that are that are made that you're able to see what, calls what ended up, what ended up happening be behind the behind the scenes. There's also some additional tool calls and we'll work on the UI a little bit more. But you can also see here this was the tool call again showing you what the what the system saw what it sent forward and back and the goal was to get this one out as well.", "takeaways": "\u2022 **Operational Discipline:** And then it tell and then down at the bottom it tells you what it can't see, which is important as well.\n\u2022 **Production Finding:** Anyway, the analyzer rates the architecture high risk with one finding toolto tool Xfill,\n\u2022 **Failure Mode Mitigation:** That's the most important thing to understand here.\n\u2022 **Deployment Rule:** 43 rules cover 41 of 78, 33 techniques can only be seen while a system runs."}, {"session_id": "1254076", "title": "Agentic Workflows Are Distributed Systems: The Multi-Cloud Production Patterns You Cannot Avoid", "category": "Multi-Agent & Orchestration", "topic": "Multi-Agent & Distributed Systems", "type": "Breakout", "video_id": "0m7SvSIeZYs", "recording_link": "https://www.youtube.com/watch?v=0m7SvSIeZYs", "company": "CoreWeave", "speaker": "Praneeth Kamalaksha Patil", "word_count": 3535, "has_transcript": true, "premise": "Production agents now span multiple clouds by default. Flexera's 2026 State of the Cloud Report puts multi-cloud adoption at 89% of enterprises, and IDC projects a 1000x increase in agent token and API call loads for large enterprises by 2027. In practice this means a single agent workflow routes across managed inference from the hyperscalers (AWS, Azure, GCP, IBM, Oracle) and a dozen specialty GPU providers (CoreWeave, Lambda, Crusoe, Together, Fireworks), driven by GPU capacity limits and cost. Once a workflow crosses provider boundaries, it inherits every hard problem in distributed systems. This talk treats multi-step agentic workflows as the distributed systems they are, and walks through four cross-cloud production patterns: durable execution for long-running workflows, idempotency for tool invocation under partial failure, cold-start absorption across providers and regions, and compensating transactions for workflow recovery. A seven-component decomposition of end-to-end latency, which maps directly to per-task cost, shows why fabric properties dominate model choice across cloud boundaries. Patterns are vendor-neutral and reproducible from public benchmarks. In practice, the primary operational challenge stems from this breakdown: These are all architecture problems and there is solution for each one of them. A latency budget to tell where your cost and time is spent most of the time.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: I have my currently researching on time to first token. It comes through acquisition, it comes through team autonomy, it could be inherited architecture. In 2027 we are expected to have agent workflows adoption to go up 10% in enterprises.", "takeaways": "\u2022 **Operational Discipline:** That brings me to what I would recommend all of us to on Monday although no one wants to work on a weekend.\n\u2022 **Production Finding:** Start figuring out your latency budget based on is caching more important or co-location or keeping your worker nodes warm and so and so forth.\n\u2022 **Failure Mode Mitigation:** No, so the call so if your were call is making a purchase is highly important one."}, {"session_id": "1234128", "title": "Breaking the Agentic Loop - Multi-Turn Exploits Against Tool-Using AI Agents", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "OUhHjBS-XAA", "recording_link": "https://www.youtube.com/watch?v=OUhHjBS-XAA", "company": "Capsule Security", "speaker": "Bar Kaduri", "word_count": 3673, "has_transcript": true, "premise": "Single prompts are yesterday's problem. Real agents live inside an agentic loop: plan \u2192 act \u2192 observe \u2192 update state \u2192 repeat. That loop is exactly where attacks hide, spread across turns, disguised as \"reasonable\" steps, and amplified by tools, skills, and memory. Most current red teaming approaches ignore this structure. They treat agents like chatbots and probe them with individual prompts. In practice, the most damaging failures rarely appear in a single step. They emerge gradually as the attacker steers the loop across several turns. In this talk we red team agents white box. Instead of blindly probing prompts, we model the internal structure of the agent and generate adversarial interaction trees that manipulate it across multiple turns. The resulting exploits do not rely on a single malicious instruction. Individually reasonable actions accumulate into a compromise as the attacker bends the planning process, poisons memory, manipulates tool outputs, and chains safe operations into unsafe outcomes. We'll demo several multi-turn exploit patterns, including memory poisoning, tool and skill output injection, planner steering & privilege escalation through chained tool calls. In practice, the primary operational challenge stems from this breakdown: However, if we put them together, we create a very really cool credential leakage exfiltration path, We are as attackers can exploit that to make the agent do things it shouldn't do.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: They have now tools, they have now memory, they have capabilities, and they are able to act and do things that could spread into multiple steps. It is using tools, it's updating memory, and doing everything it needs to do. So for attackers, this loop could be exploited in many ways, but there are two main patterns that I can tell you about here.", "takeaways": "\u2022 **Operational Discipline:** So on and so forth, but the most important thing here is the persistence because every time we stopped, well, I used the NAA agent to attack everything and it has a very specific task, which is to hack the attacked agent.\n\u2022 **Production Finding:** What is very important about those hooks is that they are deterministic.\n\u2022 **Failure Mode Mitigation:** For us defenders, it's very hard to create one policy to rule all our AI agents.\n\u2022 **Deployment Rule:** This is an advertisement to our own product because in production environment of our clients we're running with a Jev- SLM."}, {"session_id": "1253224", "title": "Prove What Your Agent Did: Tamper-Evident Audit Trails for Tool Calls", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "QggeA4MBfr0", "recording_link": "https://www.youtube.com/watch?v=QggeA4MBfr0", "company": "Komatsu America Corp", "speaker": "Vikas Luthra", "word_count": 3838, "has_transcript": true, "premise": "Agents call tools. Logs tell you what happened, but they can't prove a record wasn't changed afterward. Once you run agents in production, that gap turns real during incident reviews, compliance checks, and disputes. I built a tamper-evident approach and shipped it as an open-source TypeScript library (MIT, on npm). Every agent action becomes a record hashed with SHA-256 and chained to the one before it. Edit any field and the chain breaks. Sealing a session produces a Merkle root, so you can verify a single action in O(log n) without replaying the whole run. I've run it against real production agent workflows and will demo verification catching a tampered record live. Here's the open question I want to bring to this community: MCP standardizes how agents discover and call tools, but nothing in the protocol proves what an agent did. I'll show how this provenance pattern maps onto MCP tool calls, where a standard hook could live, and then hand it to the people building MCP to pressure-test. In practice, the primary operational challenge stems from this breakdown: If you're trying to find a problem, you can run the code multiple times with the set of data you provide provided to that code and then, you'll get the same output mostly.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Provenance is the independently verifiable independently checkable record of what exactly an agent did, what decisions it took, what third-party tool calls it made, and what exactly it recommended, finally. I've shown here, two runs of the same task given that the agent the same model, same data, same MCB tool calls and all of them are executed in the same order. What I suggest here is, the MCP client is the place, where all the calls are being made through.", "takeaways": "\u2022 **Operational Discipline:** That person knows that this VP approved even after that agent recommended to decline it.\n\u2022 **Production Finding:** This is just a quick summary of what was happened."}, {"session_id": "1254100", "title": "Stop Writing Agents, Declare Them: Declarative Agent Architecture in Production", "category": "Enterprise & Production", "topic": "Building Reliable Agent Systems", "type": "Breakout", "video_id": "nNPi4-QtIF4", "recording_link": "https://www.youtube.com/watch?v=nNPi4-QtIF4", "company": "A Place For Mom", "speaker": "Chris Knuteson", "word_count": 4159, "has_transcript": true, "premise": "Most teams build an AI agent the way they'd regret building a service: one prompt doing seven jobs. Every requirement is another paragraph, every change risks regressing the rest, and the only unit of isolation is the whole agent. You can't prompt your way out of that shape. The alternative, which we run in production for Grace, a senior-living advisor: stop writing agents - declare them. An AgentSpec is a small, versioned contract - one spec, one agent, one job. What it leaves out is the point. Provider, model, budget, and killswitch live on a per-agent gateway key, not in the spec; prompts live in a registry; tools are refs. That narrow waist buys three things by construction: governance (authority declared, enforced, and audited per agent), resilience (kill one key and exactly one agent stops; safety stays synchronous), and future-proofing (swap model or runtime with zero spec change). One spec is served over web, agent-to-agent, and as an MCP server - the platform itself becomes a tool any MCP client can call. You'll leave with the contract, the gateway-as-policy-plane pattern, and an honest account of what's shipped versus still ahead. In practice, the primary operational challenge stems from this breakdown: We have a whole bunch of agent runs, bunch of model calls, bunch of prompt packs, and a whole bunch of interesting problems that came out of that. But, what happens when LangFuse drifts over time?", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Once you have that, once you have this, the agents that we have today, we're running an agent core on top of the gateway, so we get all sorts of fun traceability out of them, too. Especially if you're going to trust it to do rev ops or financially sensitive information, handle financially sensitive information. Our agentic review agent really covers our backsides very well from a iteration perspective.", "takeaways": "\u2022 **Operational Discipline:** For anybody else that would be looking to solve this follow these rules, name the release, submit separate, give it give yourself a mechanism to activate and rollback, get coverage from your control plane.\n\u2022 **Production Finding:** The proposal then is the promoting a reviewer to prod in actual production environment."}, {"session_id": "1257542", "title": "Beyond Scraping: Building Agent-Ready Documentation Layers for MCP and AI Agents", "category": "Protocols & Standards", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "efMAwbrUbZc", "recording_link": "https://www.youtube.com/watch?v=efMAwbrUbZc", "company": "Adyen", "speaker": "Ayodeji Ogundare", "word_count": 2683, "has_transcript": true, "premise": "Most developer documentation portals are still built for humans first. That worked when developers read the docs directly. It creates friction when they use AI agents and code assistants to solve implementation problems while coding. Server log analysis of over 10 million requests on docs.adyen.com showed that 11.6% of traffic came from AI bots. 78% of generative AI traffic came from user-directed assistants pulling context for active coding tasks. Developers are no longer only reading documentation. They are asking AI tools to interpret it, reason over it, and turn it into working code. The problem is that standard web documentation isn't designed for this workflow. HTML pages and site hierarchies waste model context as bots crawl, guess, and reconstruct structure. We addressed this by turning static docs into agent-ready markdown infrastructure. We added /llms.txt for structured LLM discovery, exposed raw content through .md URLs, and packaged a full documentation mirror as a ZIP file. This session shares how to move from human-centric HTML to machine-consumable markdown, reducing traversal overhead, avoiding unnecessary rate limits, and improving AI-generated integration code. In practice, the primary operational challenge stems from this breakdown: This part of this problem discovery is looking at the quality. We release sev- we release SDKs a lot as a payments company, and at a point in time, there was already a big drift.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Our documentation at as of then was designed for humans. You have several, designs, the buttons, accordions, there's several layers, it's beautiful JavaScript UIs, but those were designed for human experience. We automated this flow to we built an evaluation engine to find, replace, wrap, run, and evaluate all the code snippets in our the entire docs page.", "takeaways": "\u2022 **Operational Discipline:** Would also explore with being in this conference for past for 2 days and we've learned about Web MCP.\n\u2022 **Production Finding:** Before agents, maybe not as, crucial, it's it's still important to have updated pages, but now is even more important to have updated pages.\n\u2022 **Failure Mode Mitigation:** In the last part, if your documentation is closed source ours, I recommend also supporting different environments."}, {"session_id": "1254037", "title": "From MCP Tool-call to Motor Command: Giving Agents Fleet-scale Control of Real Hardware", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "7-1R77IkbmQ", "recording_link": "https://www.youtube.com/watch?v=7-1R77IkbmQ", "company": "Arm", "speaker": "Alexander Tsyplikhin", "word_count": 3213, "has_transcript": true, "premise": "Agents can call APIs. They can't find and drive a physical device \u2013 yet. The agentic stack stops at software. MCP and A2A let an agent invoke a tool; neither lets it discover and control a fleet of real hardware. Device Connect closes that last mile: an open, agent-native protocol for device discovery and network RPC over pluggable transports, plus a zero-infrastructure device-to-device mode that needs no broker and no cloud. This is a working-code talk, not a roadmap. We'll walk the protocol: how a device advertises its capabilities, how an agent discovers it, and how an RPC call becomes an action on real hardware at millisecond scale - the right tier for fleet discovery and control. Then we go live: an agent takes a plain-English command, finds devices on the fleet, and moves them. You'll leave knowing how to give your agents a body \u2013 discover, invoke, and orchestrate physical devices using the MCP-shaped mental model you already have, with open-source code you can run the same afternoon. In practice, the primary operational challenge stems from this breakdown: The problem is that connecting to physical things currently is not straightforward. Well the complexity would grow exponentially currently and the agent according agent could tackle an integration problem for maybe a couple maybe a few devices.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: The procedures or functions are also self-described, similar to what MCP offers. It's model agnostic, so it we are not specifying which model to use for orchestration or on devices. Again, we are not opinionated in terms of what model or orchestrator scripts you're using.", "takeaways": "\u2022 **Operational Discipline:** The devices are discovered, the functions that are available across the devices capture images on the cameras, and some IDs of the devices that are not showing for example, which camera is real and which one is simulated.\n\u2022 **Production Finding:** I Well, I cannot stress more how important security and safety for us."}, {"session_id": "1288853", "title": "Registration & Badge Pick-Up", "category": "Developer Tools & Frameworks", "topic": "Registration", "type": "Breakout", "video_id": "", "recording_link": "", "company": "N/A", "speaker": "N/A", "word_count": 0, "has_transcript": false, "premise": "Official conference schedule event: Registration & Badge Pick-Up.", "technical_depth": "Designated time for attendee networking, badge pick-up, sponsor booth visits, and informal technical collaboration across the Registration track.", "takeaways": "\u2022 **Logistics:** Scheduled event taking place on site at AGNTCon + MCPCon North America 2026.\n\u2022 **Community Engagement:** Connect with peer practitioners, open-source maintainers, and speakers."}, {"session_id": "1345378", "title": "Zen Zone", "category": "Developer Tools & Frameworks", "topic": "Zen Zone", "type": "Breakout", "video_id": "", "recording_link": "", "company": "N/A", "speaker": "N/A", "word_count": 0, "has_transcript": false, "premise": "Need a quick break from the noise? Need a quick break from the noise?", "technical_depth": "The technical architecture presented by N/A (N/A) establishes concrete mechanisms to resolve these failure modes: Step into the Zen Zone - a tech-free sanctuary designed to help you recharge, reset, and quiet your mind. We ask that all cell phones remain silenced and stowed away upon entry. Take a breath, step away from the conference hustle, and enjoy a few quiet moments to yourself.", "takeaways": "\u2022 **Production Strategy:** Take a breath, step away from the conference hustle, and enjoy a few quiet moments to yourself.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Zen Zone workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1288858", "title": "Welcome Back & Awards", "category": "Developer Tools & Frameworks", "topic": "Keynote Sessions", "type": "Keynote", "video_id": "5adt0DFJjUU", "recording_link": "https://www.youtube.com/watch?v=5adt0DFJjUU", "company": "Agentic AI Foundation", "speaker": "Mazin Gilbert", "word_count": 1912, "has_transcript": true, "premise": "Session on Keynote Sessions presented by Mazin Gilbert (Agentic AI Foundation).", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Nate is co-author of the URL elicitation proposal now part of the MCP specification which lets users sign in to outside services securely without their credential passing through the AI client. From Pydantic, Marcelo is a core maintainer of the MCP Python SDK. He built much of the SDK support for the latest MCP specification including stronger authorization.", "takeaways": "\u2022 **Operational Discipline:** Mesmo built a system called Ayora, an open source agent harness that uses MCP to run agents safely against production infrastructure.\n\u2022 **Production Finding:** But just to recognize Opaque Systems, Opaque introduced confidential MCP, really a really important feature here, which runs MCP inside secure hardware so that policies are enforced and verifiable before any agent code runs."}, {"session_id": "1288863", "title": "Keynote: From Bigger Models to Better Systems: Accelerating Open Intelligence", "category": "Developer Tools & Frameworks", "topic": "Keynote Sessions", "type": "Keynote", "video_id": "Bu5VGq-kWAk", "recording_link": "https://www.youtube.com/watch?v=Bu5VGq-kWAk", "company": "The Linux Foundation", "speaker": "Jonathan Bryce", "word_count": 1380, "has_transcript": true, "premise": "For years, progress in AI was closely tied to scale: bigger models, more data and more compute. But that equation is changing. Smaller and specialized models are becoming dramatically more capable, and new approaches to continual learning are enabling AI systems to improve from real-world experience after deployment. In this keynote, Jonathan Bryce explores what this shift means for the next generation of intelligent and agentic systems. Using examples of models that learn from production feedback to become faster, cheaper and more capable, he\u2019ll show why the future of AI will depend not on any single model, but on an open set of technologies for building, optimizing, serving and continuously improving intelligence. He\u2019ll also look at the growing role of the PyTorch Foundation in bringing those technologies together, creating an open foundation that gives developers the freedom to build with any model, on any chip and across any cloud.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: The other thing that's interesting is we're seeing where we can optimize small models for specific kinds of workloads and outperform those larger ones. We've started to see diminishing returns in making bigger and bigger models, and we're seeing where if we focus on tasks and specific outcomes, we can use smaller models for better results. What they have found at Shopify is a way where they build a learning loop for specific tasks.", "takeaways": "\u2022 **Operational Discipline:** Both Sarah's keynote and Cody's keynote are going to be online if you want to go dive into their sessions and get the full details instead of my summary of it.\n\u2022 **Production Finding:** This is a great technique that they have developed and implemented into production."}, {"session_id": "1291496", "title": "Keynote: Sutando: My AI Stand", "category": "Developer Tools & Frameworks", "topic": "Keynote Sessions", "type": "Keynote", "video_id": "j5fVujCZtu8", "recording_link": "https://www.youtube.com/watch?v=j5fVujCZtu8", "company": "Google Deepmind", "speaker": "Chi Wang", "word_count": 2344, "has_transcript": true, "premise": "Sutando is an open-source personal AI agent that runs on hardware its owner controls. It hears and speaks, sees the screen, handles mail and calendar, writes and reviews its own code, and keeps upgrading itself \u2014 one system doing all of it, for one person, continuously. It recently caught its own alerting pipeline dropping jobs silently and shipped the detector within the hour. Others now run their own, and the agents review each other's code \u2014 nobody asked them to. I'll bring the live system and show where it has got to. In practice, the primary operational challenge stems from this breakdown: That has been one of the one of the problems I've been solving in the past few months.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: In computer networks, the computer follows protocols. The And this protocol is not is not predetermined and because we don't know who will pick it up, who will be able to solve it and who else will take it.", "takeaways": "\u2022 **Operational Discipline:** One fun fact about Muse, it keeps a personal operating manual when it write down every lesson to learn so the future can pick stuff smarter."}, {"session_id": "1302713", "title": "Keynote: From My Dog\u2019s Cancer to a Personalised mRNA Vaccine: Building Across Disciplines with AI", "category": "Developer Tools & Frameworks", "topic": "Keynote Sessions", "type": "Keynote", "video_id": "-rn2FkdXJaI", "recording_link": "https://www.youtube.com/watch?v=-rn2FkdXJaI", "company": "Gamgee Technologies", "speaker": "Paul Conyngham", "word_count": 1724, "has_transcript": true, "premise": "When my dog Rosie developed cancer and chemotherapy, immunotherapy and surgery were not enough, I used my background in machine learning to help develop a personalised mRNA cancer vaccine for her. The work crossed genomics, bioinformatics, immunology, software engineering and manufacturing- became the starting point for Gamgee. In this talk, I will share that journey and explore what it reveals about building in the age of AI agents. Agents give individuals and small teams a growing ability to work across disciplines, connect specialised tools and reason about how the parts of a complex solution fit together. Using Rosie\u2019s vaccine as a concrete example, I will discuss where AI helped, where scientific and clinical collaborators were essential and what it takes to turn an ambitious idea into something that can be manufactured and tested. The wider opportunity is designing across an entire system: moving between the desired outcome, the underlying science and the practical constraints. Attendees will leave with a perspective on how agents can expand what a small team can attempt-and why some of the most consequential applications may emerge at the boundaries between fields. In practice, the primary operational challenge stems from this breakdown: Sequencing is allows us to take organic tissues such as blood or cells and extract the DNA and convert it into data.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: You need to push it through a data science pipeline to be able to identify these targets, these mutations. Again, that data is not enough to just do anything, so we pushed it through a computational pipeline of about four different algorithms to down select those targets that we mentioned earlier. I built many software orchestration systems to pull this together.", "takeaways": "\u2022 **Operational Discipline:** I have the steps and recommendations that I have for you is first choose a problem that intersects many different fields.\n\u2022 **Production Finding:** I think that's really important that you use your own voice, but, that's one of the steps that I did.\n\u2022 **Failure Mode Mitigation:** Most importantly is to test everything that you're doing."}, {"session_id": "1288867", "title": "Keynote: Building the Git Forge of the Future", "category": "Developer Tools & Frameworks", "topic": "Keynote Sessions", "type": "Keynote", "video_id": "7XXHDXxkvLg", "recording_link": "https://www.youtube.com/watch?v=7XXHDXxkvLg", "company": "Entire", "speaker": "Thomas Dohmke", "word_count": 1916, "has_transcript": true, "premise": "Coding agents write high-quality code faster than ever and pick up work with growing autonomy, yet the human developer still sits at the center of every pull request while context fragments across chats, prompts, sessions, and branches, leaving agents stateless and developers blind to intent and decisions. Meanwhile bottlenecks build, and the trust gap between collaborators grows wider than ever. It's time for a new git forge built for agent-to-human and agent-to-agent collaboration, one that collapses planning, design, implementation, review and deployment into a continuous loop without sacrificing quality, security or trust. Join Thomas Dohmke, CEO of Entire and previously CEO of GitHub, for a keynote on where developers and agents are headed together in this next generation.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: You ask for a feature, especially as a startup founder or CEO, the agent says it all works. You're excited that you did that instead of your engineering team. The process that we built over the last 10, 20 years, DevOps, Agile, pragmatic engineering, was all centered around a human.", "takeaways": "\u2022 **Operational Discipline:** That's why I think, the agent session logs, they're as important as valuable to us as teams as developers as the code."}, {"session_id": "1288864", "title": "Keynote: Predictable Correctness for Unpredictable Code", "category": "Developer Tools & Frameworks", "topic": "Keynote Sessions", "type": "Keynote", "video_id": "fbse-wWIjGQ", "recording_link": "https://www.youtube.com/watch?v=fbse-wWIjGQ", "company": "AWS", "speaker": "Shadaj Laddad", "word_count": 960, "has_transcript": true, "premise": "As coding agents become increasingly autonomous, the bottleneck has shifted to verification: how do we know if the code is correct? Code review cannot scale to the throughput of modern agents. And unit tests often miss issues that materialize across distributed services. Two techniques offer a path forward: deterministic simulation and universal properties. Distributed simulation makes it possible to test end-to-end systems with production conditions like network failures. Universal properties, like null-pointer freeness and durability, enable tests that are independent of application specifics and naturally scale with your codebase. At AWS, we are putting these ideas together into Hydro: a distributed systems framework designed for agentic coding. Hydro offers a built in deterministic simulator that explores network interleaving, failures, and other sources of distributed bugs. And it uses the Rust type system to enforce universal properties of memory safety and determinism. In this talk, we'll explore the core principles behind Hydro, how it empowers agents to autonomously build correct systems, and take a peek at protocols for agent state we are building with Hydro!", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: So, what we'd love is a way to focus the agent's efforts on the specific tasks and unique properties we need to worry about there, rather than spending time worrying about things that are cross-cutting across several applications. Universal properties are specifications that apply to any application, no matter its logic. What's special about universal properties is they're defined once and can be reused across all for agentic tasks.", "takeaways": "\u2022 **Operational Discipline:** There are a lot of frameworks that enforce universal properties out of the box, but we think it's important to bring universal properties into your own application design process.\n\u2022 **Production Finding:** This is the most important part because it helps you disentangle the property from application-specific details.\n\u2022 **Failure Mode Mitigation:** So, in conclusion, we think universal properties are going to be an increasingly important way to bring correctness guarantees to agent-run software and increasing the trust between us and agents throughout the agentic development process."}, {"session_id": "1324171", "title": "Keynote: Shipping Autonomous Agents Safely with Open Standards, Observability, and Control", "category": "Observability & Evaluations", "topic": "Keynote Sessions", "type": "Keynote", "video_id": "7vnPC2dtgNc", "recording_link": "https://www.youtube.com/watch?v=7vnPC2dtgNc", "company": "Google", "speaker": "Rao Surapaneni", "word_count": 1019, "has_transcript": true, "premise": "Everyone wants more agents in production with higher autonomy, from a solo developer wiring up MCP tools on a laptop to an enterprise CIO governing thousands of workflows. Moving too fast without guardrails creates runaway risk, while heavyweight proprietary gates trap teams in pilot purgatory. In this 5-minute keynote, Google Cloud VP Rao Surapaneni shares how open standards under the Linux Foundation and Agentic AI Foundation (AAIF) turn observability and governance into an enabling platform rather than a speed bump. By combining open protocols like MCP, A2A, and OpenTelemetry with a unified control tower for security and policy enforcement, builders can safely grant agents real production autonomy while feeding live telemetry directly back into continuous product, eval harness, and model improvements.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: I'm pleased to announce we just released our agent compute engine. This is where the infrastructure and the architecture becomes the capability. To solve those needs, we delivered agent compute engine.", "takeaways": "\u2022 **Operational Discipline:** That is a true test of an organization that is ready for what's happening with agents and what is happening as we move forward with more and more autonomy in production.\n\u2022 **Production Finding:** I'll leave you with some of these best practices."}, {"session_id": "1291892", "title": "Keynote: How Anthropic is Building with MCP", "category": "Protocols & Standards", "topic": "Keynote Sessions", "type": "Keynote", "video_id": "a_m0mOJAy_4", "recording_link": "https://www.youtube.com/watch?v=a_m0mOJAy_4", "company": "Anthropic", "speaker": "Kelly Fang", "word_count": 769, "has_transcript": true, "premise": "In this keynote, Kelly Fang shares how Anthropic is adopting and building with MCP across all of its products, what the team has learned from running it at scale, and what Anthropic is building next.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: You might ask, \"Where is all this usage coming from?\" Well, MCP works across all of our Clod products. The main takeaway here is if you build an MCP server, and you bring it to our Clod products, you will reach users across all of these. We are excited to share that as of recently, we have over 6,000 plus listings inside of our directory of both MCP connectors and plugins.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Kelly Fang.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1291488", "title": "Keynote: The Missing Mechanisms of the AI Economy", "category": "Developer Tools & Frameworks", "topic": "Keynote Sessions", "type": "Keynote", "video_id": "43WOAT2rwCs", "recording_link": "https://www.youtube.com/watch?v=43WOAT2rwCs", "company": "O\u2019Reilly Media", "speaker": "Tim O'Reilly", "word_count": 2173, "has_transcript": true, "premise": "Every major technological invention is accompanied by the invention of new economic mechanisms to take advantage of it. Think of how PageRank, pay per click advertising, and seamless online payments became the economic engines of the web, GPS-based location matching marketplaces became the basis for Uber, Lyft and the rest of the smartphone based on-demand economy, and YouTube ContentID for the creator economy. We don't yet have breakthrough market mechanisms for the AI economy. What are some of the missing mechanisms of the AI economy? How does an understanding that they haven't been invented yet change the discussion about AI and jobs for humans?", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: We just fell into this fabulous mechanism and that mechanism became what I came to call an architecture of participation. It's Linux and Linux got through many revisions and I remember Lionus saying to me, I could not have built a new kernel for Windows even if I had the source code. It was it was a protocol ccentric operating system.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Tim O'Reilly.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1292243", "title": "Solutions Showcase", "category": "Developer Tools & Frameworks", "topic": "Solutions Showcase", "type": "Breakout", "video_id": "", "
