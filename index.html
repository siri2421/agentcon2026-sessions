ll be subject to their own privacy policies_ In practice, the primary operational challenge stems from this breakdown: Second thing we're going to talk about is the two main types of workloads to for AI geni workloads and agentic workloads and what some of the governance challenges related to those are. But but in the case of AI today, I think the main issue I think in our experience has been that there there's not a known governed path from pilot to production.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: I'm glad that at least some of what The Matrix movie is. The Matrix is one of my favorite movies, in general about software development and now AI. First one is that the matrix had perfect observability into what was going on everywhere in the matrix.", "takeaways": "\u2022 **Operational Discipline:** That's I think one of the key issues that that you need to solve.\n\u2022 **Production Finding:** So coming back to the example that we started with which was the a the the cursor agent deleting the production database.\n\u2022 **Failure Mode Mitigation:** First one, is an agent running in a pre-production environment allowed to scan all of my code in order to find an API key?"}, {"session_id": "1342376", "title": "Demo Theater: Unlocking Agents in Production: Enterprise Governance & Cost Control for MCPs & LLMs", "category": "Protocols & Standards", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Nutanix", "speaker": "Ashwini Vasanth, Laura Jordana", "word_count": 0, "has_transcript": false, "premise": "Many agentic AI projects risk cancellation due to spiraling inference costs and unmanaged execution. Learn how to eliminate credential sprawl, enforce function-level tool filtering using MCP Connectors, and apply token rate limiting to prevent bill shock while balancing public and private models.", "technical_depth": "The technical architecture presented by Ashwini Vasanth, Laura Jordana (Nutanix) establishes concrete mechanisms to resolve these failure modes: Connecting AI agents to tools via MCP enables powerful workflows, but ungoverned access leads to tool bloat, context rot, and runaway token consumption. In this session, we'll discuss how Nutanix Agent Gateway - built by maintainers of the AgentRouter open source project - establishes unified runtime control across MCP tool servers and LLM endpoints for enterprises.", "takeaways": "\u2022 **Protocol Specification:** Learn how to eliminate credential sprawl, enforce function-level tool filtering using MCP Connectors, and apply token rate limiting to prevent bill shock while balancing public and private models.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1353158", "title": "Demo Theater: Token by Token: Your AI Agent Has a Metering Problem", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Stigg.io", "speaker": "Shai Betito", "word_count": 0, "has_transcript": false, "premise": "Metering used to mean counting a massive stream of a single event type, but agents turn it into a horizontal problem spanning models, tokenizers, entities, entitlements, organizational hierarchies, and constantly changing pricing models.", "technical_depth": "The technical architecture presented by Shai Betito (Stigg.io) establishes concrete mechanisms to resolve these failure modes: I encountered this firsthand while building a decentralized metering system with pluggable measurement components, contract and organization hierarchies, entitlement-aware usage, and built-in data reconciliation. This talk distills that architecture into a generic model for agentic metering, separating observation, measurement, attribution, and pricing so each can evolve independently.", "takeaways": "\u2022 **Production Strategy:** This talk distills that architecture into a generic model for agentic metering, separating observation, measurement, attribution, and pricing so each can evolve independently.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1297942", "title": "5 Ways to Build a Durable Browser Agent in 2026", "category": "Enterprise & Production", "topic": "Building Reliable Agent Systems", "type": "Sponsored Session", "video_id": "UnVtvB6OMcM", "recording_link": "https://www.youtube.com/watch?v=UnVtvB6OMcM", "company": "Temporal", "speaker": "Andrew Baker", "word_count": 5148, "has_transcript": true, "premise": "Not every tool is available as a clean REST API or MCP server. While bolting headless Playwright onto an LLM agent enables browser automation, it catastrophically fails in production due to network hiccups, dynamic DOM changes, session timeouts, and lack of state persistence.", "technical_depth": "Andrew Baker presents an architectural pattern for durable browser agents powered by Temporal's event-sourced workflow engine:\n1. Decoupled Workflow & Activity Layers: Browser sessions run in isolated cloud containers (Kernel / cloud browsers), while the agent's multi-step decision loop runs as a deterministic Temporal workflow.\n2. API Bypass Pattern: The agent uses the browser strictly to authenticate and establish session cookies, then executes subsequent high-volume data operations via direct curl/HTTP requests inside that authenticated context rather than clicking DOM elements.\n3. Durable Replay & Checkpointing: If a browser crash occurs mid-flight, Temporal resumes the workflow from the exact execution step without repeating expensive earlier browser interactions.", "takeaways": "\u2022 **Avoid Full-DOM Clicking:** Interacting with every UI element via multi-click browser automation increases latency by 10x and multiplies failure rates; extract session state and switch to direct network calls immediately.\n\u2022 **Deterministic Workflow State:** Browser automation must be backed by an event-sourced durable state engine to survive network disconnects and cloud instance reboots.\n\u2022 **Ephemeral Cloud Browsers:** Spin up lightweight cloud browser instances per task and destroy them upon completion to prevent memory leaks and zombie sessions."}, {"session_id": "1247706", "title": "Cut The Noise: Building a Code Reviewer You Can Trust", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "f6OVURAlYXI", "recording_link": "https://www.youtube.com/watch?v=f6OVURAlYXI", "company": "Block, Inc", "speaker": "Joah Gerstenberg", "word_count": 4231, "has_transcript": true, "premise": "In the era of agentic engineering, agents are generating code faster than humans are capable of reviewing thoroughly. In order to keep up while catching critical issues, it's crucial to make agents a part of our code review strategy and build systems that allow them to verify changes against our expected outcomes. In this talk, I'll argue that the best AI Code Reviewer for your organization is the one that is equipped with the context and the tools to verify its claims thoroughly before surfacing them to the agents (and their humans) who are authoring the changes. After all, a reviewer is only as trustworthy as the consistency of its findings; when the signal gets drowned out by the noise, it takes immense effort to rebuild trust and convince authors to listen to the feedback. I'll show how to use goose to build your own local-first code reviewer equipped with the context from your organization to use a network of subagents to find issues, verify them against your knowledgebase, and leverage best-in-class models to debate findings before they get surfaced on a changeset. In practice, the primary operational challenge stems from this breakdown: It was viewed internally as an experiment and it was pressured to reduce run costs and use cheap models. The bottleneck was gone for writing a trode code that could be trusted.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: This prompted us to shut down our reviewer for an entire week while we rebuilt it from scratch so that we were taking this into account and building it the way that it should be built. A couple weeks after we found this, a couple engineers at DoorDash published a paper where they had found the same exact thing. They had also rebuilt their reviewer to minimize false positives, to maximize precision before maximizing recall, which I'll explain in a second, and build a reviewer that protected their humans' attention by only posting things that it was sure were correct.", "takeaways": "\u2022 **Operational Discipline:** That coordinator agent has tool call access to be able to reference from context from the entire company in order to try to disprove any of the findings that the reviewers find it.\n\u2022 **Production Finding:** If you ship this to production, it's going to break for all of our users.\" Our coordinator agent should be able to go, \"Well, the feature flag is off, so this isn't going to break for anyone.\n\u2022 **Failure Mode Mitigation:** Once it has gone through and disproven all of the findings that it can, as well as consolidated any findings that our reviewers find, it hands off all of the dropped findings off to a judge agent.\n\u2022 **Deployment Rule:** Then after that, only findings that make it through the full chain are ever shown to humans."}, {"session_id": "1316901", "title": "How Open Standards Become Real: Lessons from Agent Plugins", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Breakout", "video_id": "wz9xCv_UHts", "recording_link": "https://www.youtube.com/watch?v=wz9xCv_UHts", "company": "Vercel", "speaker": "Jonathan Hefner", "word_count": 3887, "has_transcript": true, "premise": "It is tempting to treat open standards like wish lists: add a feature to a specification, and the ecosystem will follow. In reality, adoption depends on solving concrete interoperability problems, defining the smallest useful shared contract, and securing the support of implementers. This talk explores the principles behind effective open standards, using Agent Plugins to show how ideas become interoperable implementations across an ecosystem. In practice, the primary operational challenge stems from this breakdown: It addresses the problem by defining a common package structure and rules for how clients interpret the components that they support. You encountered a problem and found a solution you think would be useful to others.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: A hook handler can use the profile to decide whether to allow an edit to a particular file without interpreting each client's replacement or patch format. Standardizing those contents would mean finding a common representation for the different ways that tools express changes. The operation kind and path already support useful decisions across clients without requiring that additional translation.", "takeaways": "\u2022 **Operational Discipline:** I think that would be my best advice for that."}, {"session_id": "1258024", "title": "Let's Play the Agentic AI Supply Chain Game!", "category": "Enterprise & Production", "topic": "Enterprise Adoption in Practice", "type": "Breakout", "video_id": "rzqtARYkM_w", "recording_link": "https://www.youtube.com/watch?v=rzqtARYkM_w", "company": "Dell Technologies, OpenSSF", "speaker": "Sarah Evans, Christopher Robinson", "word_count": 4657, "has_transcript": true, "premise": "Picture the WHOLE software supply chain, beginning to end; it's a little like that olde tyme classic boardgame, \"Candyland\". Designed NOT with preschoolers in mind, agentic AI Supply Chain Candy-Land style game is for everyone interested in learning about the software supply chain for agentic AI/ML. Travel through exotic locations like The Peppermint Forest of swirly-twirly dependencies, The Fudgy Swamp of Compliance, and much more! Agentic AI is a fast-moving space within technology. However, everything we've learned in software engineering of the last few decades ALSO applies to this \"new\" world of agentic AI. We'll apply traditional software supply chain security techniques and, wherever able, tools to help developers and consumers win leveraging the agentic AI Supply Chain. Through an analogy to an enjoyable and colorful game, with useful examples taken from standards and frameworks, the audience will have a better appreciation and ability to apply supply chain security concepts and tools to the development and support of agentic AI/ML-based solutions. In practice, the primary operational challenge stems from this breakdown: It's very important to understand the threat model and the attack surfaces of these protocols.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Over time we believe that the agentic infrastructure will continue to have additional protocols as they grow. It's very important to understand the threat model and the attack surfaces of these protocols. We have a couple traditional projects that apply to normal, non-AI development, things our SALSA, spec, which is essentially a supply chain provenance and pedigree, methodology.", "takeaways": "\u2022 **Operational Discipline:** We have a ton of tools, best practices, guidance, and education to help teach people to write secure software, open or closed source, and then also how to consume software securely.\n\u2022 **Production Finding:** That it's important to have your software engineering team understand these core engineering principles and understand what to look for to avoid problems down the road.\n\u2022 **Failure Mode Mitigation:** We're going to quali- do some quality assurance on our code before we're getting ready to push it to production, but QA must come first.\n\u2022 **Deployment Rule:** This is something that's also becoming more important in an increasingly regulated environment, making sure that the security posture and the secure code earlier in the pipeline is evaluated and assured."}, {"session_id": "1254027", "title": "Part Man. Part Machine. All Open Source", "category": "Developer Tools & Frameworks", "topic": "Open Source Community & Ecosystem Health", "type": "Breakout", "video_id": "ZobgRrhgmCM", "recording_link": "https://www.youtube.com/watch?v=ZobgRrhgmCM", "company": "Snowflake", "speaker": "Russell Spitzer", "word_count": 4986, "has_transcript": true, "premise": "I was a huge AI skeptic, and honestly, I still am, but I've been dragged kicking and screaming into this new world of agents. After working through the usual stages of grief, I had a revelation. It was never about who was better, me or the agent. It was what we could do together. A human assisted by AI can be far more effective than either an autonomous agent or a human working alone. In my work as a PMC member on the Apache Iceberg and Polaris projects, I've found that AI-augmented workflows dramatically improve my ability to communicate, review, and build with the community. In this talk, I'll show how I review incoming PRs, triage security issues, and build in OSS hand-in-hand with agents. I'll demo my custom orchestration framework and show how that enables my own code review. I'll walk through the skills I've designed for the unglamorous maintenance work of license compliance and build validation. Beyond my own workflow, I'll introduce Apache Magpie, an ASF-wide project aimed at bringing this kind of automation to every open source community at the foundation. Together as a community, and together with agents, we can do far more than we ever could apart. In practice, the primary operational challenge stems from this breakdown: You can, of course, race with people who can solve these problems in 5 minutes while it takes me considerably more time. At the beginning, you start with easy problems.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: I think I've found that place, and that's really what this talk is about is where do we fit in this new world, especially in open source projects where we're trying to collaborate with other people on something to build something that everyone can use. We've seen things where they will go to the specification itself and say, \" the specification is insecure because it says that you're allowed to put files anywhere you want.\" And where my response to that is usually, \"Well, that can't be security issue. The other thing I've noticed specifically as a big problem is the removal of Chesterton's fences.", "takeaways": "\u2022 **Operational Discipline:** Then again the key thing that I think is important here is that the outcome of this entire process is it goes to me.\n\u2022 **Production Finding:** I think we're probably going to end up in a future where the provenance of the PR is more important than the actual code generated.\n\u2022 **Failure Mode Mitigation:** My best my best advice for people who now want to become involved in open source using LLMs is to make sure, you follow a few simple reviews.\n\u2022 **Deployment Rule:** A very important one is make sure you are doing real work."}, {"session_id": "1248309", "title": "Shipping an MCP Server Nobody Told You How To: PyPI, the Registry, and the Rough Edges", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "AWFL0irpOQM", "recording_link": "https://www.youtube.com/watch?v=AWFL0irpOQM", "company": "mc modern containers GmbH", "speaker": "Mesut Oezdil", "word_count": 3080, "has_transcript": true, "premise": "Most MCP guides stop at \"here is a server.\" Then you try to ship it, and the real questions begin. I took mcp-gpu-server from a local script to a published package on PyPI, then registered it in the official MCP Registry. This talk walks that path end to end. What the spec expects. What the Registry actually validates, and what it quietly does not. How a client is meant to discover your server, and where that still breaks. I also sent patches to the Registry itself, so you get both views: the person publishing a server, and the person fixing the code that lists it. No framework hype. A real package, a real Registry entry, real pull requests, and the parts that tripped me up. You leave able to publish your own MCP server and avoid the holes I fell into. In practice, the primary operational challenge stems from this breakdown: The the problem is the model never sees the codes.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: On the left side you see the name of the my server MCP GPU server and the and then you see this MCP tool. It is the start point of your of your tool of your function in this case GPU utilization. It is doc dock string and this part is really crucial for your server.", "takeaways": "\u2022 **Operational Discipline:** The other rules I have mentioned before but you can check it again for your server.\n\u2022 **Production Finding:** These rules are the generally the edge rough for the for the shipping of the MCP server."}, {"session_id": "1257103", "title": "Stop Running Agents as Service Accounts: User-Scoped Access for Enterprise Tool Calls", "category": "Enterprise & Production", "topic": "Enterprise Adoption in Practice", "type": "Breakout", "video_id": "8Ybqjk0ydjU", "recording_link": "https://www.youtube.com/watch?v=8Ybqjk0ydjU", "company": "Hitachi, Ltd.", "speaker": "Masato Kozuka", "word_count": 2752, "has_transcript": true, "premise": "Most enterprise agent deployments run autonomous agents under shared, over-privileged Service Accounts. When an agent experiences prompt injection or hallucinates a tool call, it inherits the full blast radius of the service account, violating enterprise compliance and enabling lateral movement.", "technical_depth": "Hitachi presents a user-scoped authorization architecture for enterprise agent tool execution:\n1. Dynamic Token Exchange: The agent runtime intercepts tool calls and dynamically exchanges the user's OAuth/OIDC identity for short-lived, user-scoped API tokens.\n2. Fine-Grained Least Privilege: The agent executes tools strictly within the calling user's individual RBAC/ABAC permissions\u2014if the user cannot delete a database table, the agent cannot delete it either.\n3. Cryptographic Audit Trailing: Every agent tool invocation logs both the agent's execution intent and the underlying human user's cryptographic identity.", "takeaways": "\u2022 **Kill Shared Service Accounts:** Autonomous agents must never run as root or shared service accounts; all tool invocations must inherit the calling user's identity.\n\u2022 **Prevent Lateral Movement:** User-scoped tokens prevent prompt injection attacks from exfiltrating enterprise data outside the user's legitimate clearance level.\n\u2022 **Audit Trail Non-Repudiation:** Compliance frameworks require logging both the AI's reasoning chain and the end-user identity for forensic accountability."}, {"session_id": "1257434", "title": "The Other Half of MCP Apps: Building a Secure, Self-Hostable Host for Interactive Agent UIs", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "XErnMwNF4oI", "recording_link": "https://www.youtube.com/watch?v=XErnMwNF4oI", "company": "NimbleBrain", "speaker": "Mathew Goldsborough", "word_count": 4675, "has_transcript": true, "premise": "MCP Apps - interactive UIs shipped as MCP resources - are becoming how agents deliver rich, stateful experiences instead of plain text. Most talks cover the app and client side. The harder, less-discussed half is the host: the runtime that renders untrusted third-party UI, bridges its postMessage calls to MCP tools, binds them to the right identity and session, sandboxes them, and does it with no central app store. This session walks through building an open-source, self-hostable host for MCP Apps end to end: the ext-apps postMessage bridge and where the spec leaves gaps; identity-bound (not workspace-bound) sessions with per-call tool routing; sandboxing and trust boundaries for code you didn't write; and how supply-chain verification - signing, SBOMs, an MCP-native threat model - lets a self-hosted host install apps safely. You'll leave knowing what it takes to run MCP Apps in production on infrastructure you control, and where the protocol still needs work. In practice, the primary operational challenge stems from this breakdown: But it's all in chat, and that to us is a problem. Then either way, the spec itself, quite frankly, is limited.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: These are things that are common to all MCP servers that want to run in this type of platform that the MCP server should not have to should not have to build themselves. We've got files, conversations, tool routing, identity, that stuff. Then we of course can connect to tens of thousands of different MCP servers that are out there, popular gateways as well.", "takeaways": "\u2022 **Operational Discipline:** Quick lessons learned on how to keep these things consistent across the board.\n\u2022 **Production Finding:** Very basic, but really important for it to feel not hodgepodge together, and really important for you to feel this is one cohesive application, even though it's a composition of maybe 10 or 12 different things."}, {"session_id": "1255085", "title": "Workshop: Keep Infrastructure Out of Your AI Agents and MCP Servers", "category": "Protocols & Standards", "topic": "Workshops", "type": "Workshop", "video_id": "US_aAT7-mUE", "recording_link": "https://www.youtube.com/watch?v=US_aAT7-mUE", "company": "Solo.io", "speaker": "Lin Sun, Christian Posta", "word_count": 12921, "has_transcript": true, "premise": "As AI agents move to production, engineering teams face a growing set of challenges. How do you secure and govern MCP servers without modifying them? Route and fail over across multiple LLM providers? Enforce rate limits, access controls, and governance policies? Observe agent traffic, manage context growth, and scale operations across environments? Rather than embedding these capabilities into every agent, MCP server, and application, organizations can adopt a single architectural pattern: the agent gateway. An agent gateway acts as a unified control plane for AI systems. It can function as an MCP gateway, LLM gateway, inference gateway, and traditional API gateway, centralizing security, observability, routing, resilience, and policy enforcement across agents, tools, models, and services. In this hands-on workshop, you'll learn how to secure and federate MCP servers without code changes, route and fail over LLM traffic across providers, enforce authentication and usage policies, and gain end-to-end visibility into agent interactions. Through live demos, you'll see how a single gateway layer simplifies operations while enabling secure, scalable, and governable AI systems. **Space Limited - First Come, First Served. Please bring a fully charged laptop to the workshop** Prerequisites Python 3.11 or above jq \u2014 https://jqlang.org/ Docker Ollama \u2014 pull the Qwen 3 8B model: ollama pull qwen3:8b Jaeger Docker image: jaegertracing/all-in-one:latest In practice, the primary operational challenge stems from this breakdown: Envoy itself, we needed that because we were solving API, governance problems in dynamic cloud environments Kubernetes and, just ephemeral infrastructure where, compute can come and it'll go. Bring that to the table and build a gateway from the ground up to solve these AI protocol type challenges.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: The next thing we're going to do is have a preview of the MCP servers we're going to work together with. Then, we have three MCP server to be able to figure out what's the trend, which is the trend server. The workspace server is we'll find out what are the things that was writing to interact with the workspace.", "takeaways": "\u2022 **Operational Discipline:** But I definitely want to talk through about this workshop because prompt injection, prompt guard is a important feature of any gateway agent gateway.\n\u2022 **Production Finding:** But now, if remember that environment variable we had, let me see that.\n\u2022 **Failure Mode Mitigation:** If you remember that MCP authorization we have, the workspace one requires a valid jot."}, {"session_id": "1304135", "title": "Demo Theater: Governing Agents When You Can't Trust the Model", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Arcade.dev", "speaker": "Shub Argha", "word_count": 0, "has_transcript": false, "premise": "Guardrails live inside the model, and a model can be talked out of them. Guardrails live inside the model, and a model can be talked out of them.", "technical_depth": "The technical architecture presented by Shub Argha (Arcade.dev) establishes concrete mechanisms to resolve these failure modes: Guardrails live inside the model, and a model can be talked out of them. This demo puts enforcement in the runtime instead, a single control plane that every agent tool call passes through. Your identity system and your own policies decide what each user's agent can see and do, and the runtime applies those rules and logs every call it allows or blocks. Watch it hold a wire transfer for human approval, strip customer PII from a response before the model reads it, and shut down a user who borrowed a colleague's connection to reach tools they were never granted.", "takeaways": "\u2022 **Human-in-the-Loop Gating:** Watch it hold a wire transfer for human approval, strip customer PII from a response before the model reads it, and shut down a user who borrowed a colleague's connection to reach tools they were never granted.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1310979", "title": "Agent Autonomy vs. Capability vs. Security: How to Pick All 3", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Sponsored Session", "video_id": "NI-6iiojItg", "recording_link": "https://www.youtube.com/watch?v=NI-6iiojItg", "company": "Keycard", "speaker": "Kim Maida", "word_count": 3833, "has_transcript": true, "premise": "Agents with full access are useful but dangerous. Agents with restricted access are safe but less capable. Agents with HITL lack autonomy and rely on consent-fatigued babysitters. It's tempting to try to retrofit OAuth, stitch in a vendor gateway, or sandbox everything. However, a great open standard for agent access has quietly existed for years. Now learn how to use Token Exchange and just-in-time policy to govern agents and give them autonomy, capability, AND security\u2026 without half measures, compromises, or --dangerously-skip-permissions. ******************************* _In order to facilitate networking and business relationships at the event, you may choose to visit a third party\u2019s booth or access sponsored content. You are never required to visit third party booths or to access sponsored content. When visiting a booth or participating in sponsored activities, the third party will receive some of your registration data. This data includes your first name, last name, title, company, address, email, standard demographics questions (i.e. job function, industry), and details about the sponsored content or resources you interacted with. If you choose to interact with a booth or access sponsored content, you are explicitly consenting to receipt and use of such data by the third-party recipients, which will be subject to their own privacy policies_ In practice, the primary operational challenge stems from this breakdown: It then determines that it understands what's going on, but it doesn't have access to any tools that can issue refunds or anything that. The next one is billing database is broken and payments are failing.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: A gateway binds enforcement to a route with a policy decision point at the MCP layer. Even if we combine all three of these solutions, we're still not really getting the thing that we really need, which is an agent that has single-use access that is down-scoped to only one task at a time. This is a trilemma that we can address by using a standard called token exchange.", "takeaways": "\u2022 **Operational Discipline:** This time it's going to ask me if I'm with restarting the main server, which takes production briefly offline.\n\u2022 **Production Finding:** When it called that restart primary tool, the token was denied token issuance was denied under the scope, and it was denied because it requires this SRE admin role for to do something restart the production server,"}, {"session_id": "1256216", "title": "Beyond Static DAGs: Orchestrating AI-Generated Multi-Agent Workflows", "category": "Multi-Agent & Orchestration", "topic": "Multi-Agent & Distributed Systems", "type": "Breakout", "video_id": "z34nlPEJ_5c", "recording_link": "https://www.youtube.com/watch?v=z34nlPEJ_5c", "company": "Agentry Inc", "speaker": "Cong Wang", "word_count": 3796, "has_transcript": true, "premise": "Your AI planner just wrote a workflow: \"research in parallel across 3 agents, then synthesize, but only if confidence > 0.8.\" Now what runs it? Kubernetes orchestrates containers, not agent workflows. Kubeflow runs static DAGs, not plans generated at runtime. LangGraph and CrewAI lock you into one ecosystem and make you wire context by hand. A2A defines how agents talk, not how their work executes. The orchestration layer for dynamic multi-agent workflows is missing. Agentry is an open-source gateway implementing the Agent Message Transfer Protocol (AMTP). Hand it a runtime plan and it parses the structure (parallel/sequential/conditional), coordinates each agent's dependencies, automatically shares context between steps (the synthesis agent sees the research with no manual wiring), and manages state, timeouts, and retries. Federated agent@domain addressing with DNS discovery lets one workflow span agents across frameworks and organizations, while a Context Graph records what was decided and why, so future runs query precedent, not a blank slate. You'll leave knowing when you need an orchestration engine rather than another framework, and how Agentry fits your MCP/A2A stack. In practice, the primary operational challenge stems from this breakdown: However, even for this such a simple scenario, if we are if we start using AI agent in this simple scenario simple business scenario, we still have a lot of problem unsolved. This the these are real questions and even if we have AI agent deployed in this scenario we still have problem today.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: It acts as a gateway for your organization as the email gateway you use today for to email your supplier your customers. For example, even if even we support the workflow or the workflow itself is also built into the message. That's why we also have to build a protocol so that different parties could speak in the same language and they could also communicate in the same protocol.", "takeaways": "\u2022 **Operational Discipline:** The key takeaways is we treat the workflow and we build in the workflow as the data in the message and it is built into the protocol and we borrow the a lot of things from the email the email address."}, {"session_id": "1199979", "title": "Generation-Verification Asymmetry: The Production Failure Pattern Nobody Has Named Yet", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "XFCG5nXfvBQ", "recording_link": "https://www.youtube.com/watch?v=XFCG5nXfvBQ", "company": "Endor Labs", "speaker": "Birajendu Sahu", "word_count": 3588, "has_transcript": true, "premise": "Production agentic pipelines are failing in a pattern nobody has named yet. An agent introduces a dependency, another builds on it, a third deploys it and by the time a human reviews, a vulnerable package is three layers deep in a system that shipped last Tuesday. This is generation-verification asymmetry: the mismatch between an LLM's near-zero cost of generation and the non-trivial cost of authoritative verification. Every unverified agent turn is a compounding liability. As pipelines grow from single tool calls to multi-turn autonomous workflows, the blast radius of one unverified decision in step two is embedded in everything that follows. This talk opens with the failure: a live agent loop shipping a real vulnerable dependency undetected. Then the same loop with verification-first MCP tooling catching it before merge no human in the loop. The delta between those two runs is the entire argument. From there: the compound risk model, verification-first MCP server design patterns, a full pipeline demo composing dependency scanning, SBOM generation, and policy gating as MCP tool calls, and an anti-pattern taxonomy separating genuine verification from simulated verification. In practice, the primary operational challenge stems from this breakdown: But when we look little bit closely, it seems say RC class of advisory vulnerability. There is a really a reachable path in the code which basically tells us that this vulnerability is really been used.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Mostly when we think of verification, we think, \" we have agentic pipeline. Basically the evidence is nothing but we can we can connect to any of the application security MCP or you create a plugin where you basically scrap all the OSB open source vulnerability database and all those things. Basically this gate is MCP integration in your CI pipeline agentic CI pipeline or any other integration where you basically get all the advisories and call graph data properly.", "takeaways": "\u2022 **Operational Discipline:** It will basically be the summary talks about what it changed why it changed and what it allowed.\n\u2022 **Production Finding:** In, one out of five finding is those are basically hallucinated packages."}, {"session_id": "1257951", "title": "How AT&T Is Building an Agentic Front Door for Enterprise HR", "category": "Enterprise & Production", "topic": "Enterprise Adoption in Practice", "type": "Panel", "video_id": "9vF4j63OHmo", "recording_link": "https://www.youtube.com/watch?v=9vF4j63OHmo", "company": "AT&T, AT&T Services, Inc.", "speaker": "Natalie Gilbert, Sherman Bell, Emily Williams, Hector Tejada, Prateek Baranwal", "word_count": 5151, "has_transcript": true, "premise": "AT&T, an enterprise with 130,000 employees, has a sprawling HR ecosystem that spans many environments, policies, teams and business processes. As a result, even basic HR tasks can be difficult to navigate efficiently. So, AT&T is building an agentic front door for HR, Ask AT&T for HR, to map employee needs to practical process workflows. Unlike many AI solutions, this is not a Q&A chatbot that simply redirects users to other systems. It's a complex, multi-agent system with secure, live integrations into backend HR systems. The platform uses an orchestrator to coordinate 100+ agents, each mapped to a distinct business process. The architecture combines publicly available and bespoke MCPs to connect agents to various enterprise systems, allowing agents to perform HR-related tasks within a single user interface. This session will focus on the cutting-edge architecture behind Ask AT&T for HR, which relies on reusable workflow patterns, MCP tools that connect to backend systems, deep agents that communicate via an orchestrator, and a SOX-compliant task engine that sends tasks to designated employees while allowing paused workflows to resume where they left off once the task is complete. In practice, the primary operational challenge stems from this breakdown: At the end of the day, we have to all come together and build a shared vision of what how to solve this problem. I do think that's been one of the biggest challenges of that we've seen and it's not necessarily anyone's fault.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: You said, most of our workflows center around utilizing deep agents, They work with users and select skills and and tools and can utilize MCP servers. There's traditional land graph workflows that we also use and those are some agents that are more rigid,", "takeaways": "\u2022 **Operational Discipline:** I think that what we've discovered with the genetic development is we're throwing things at the wall.\n\u2022 **Production Finding:** If something doesn't work, drop it and go to the next thing and that's been a pretty important principle for us across the board.\n\u2022 **Failure Mode Mitigation:** Sarthak, going back to you, we've talked a lot about how important HR processes are, how high-stakes this is.\n\u2022 **Deployment Rule:** But, I think that the biggest takeaway is that we the users shouldn't expect them to know how to use or how agents work."}, {"session_id": "1230048", "title": "The Frontend Strikes Back: WebMCP and The Agent-Ready Browser", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Breakout", "video_id": "8qhbtkc-Gpc", "recording_link": "https://www.youtube.com/watch?v=8qhbtkc-Gpc", "company": "Nearform", "speaker": "Ryan Roemer", "word_count": 4663, "has_transcript": true, "premise": "AI agents already use your web app. They're just doing it poorly: screen-scraping, driving Playwright MCP through human-shaped UIs, and working around frontends never built for them. WebMCP changes the contract. A new rising W3C standard, it brings MCP into the frontend: apps register structured, discoverable tools that agents call, reusing your existing auth, personalization, and business logic. Going agent-ready this way can be much faster than traditional MCP servers. This talk starts with the basics: registering tools, defining schemas, and making frontend functions agent-callable. We\u2019ll use Claude Desktop to drive a frontend-only document-retrieval app via WebMCP. Then, we\u2019ll push the frontend even further with a research assistant running fully in-browser, featuring multi-agent coordination, semantic search, multiple WebMCP tools, and on-device models. Navigating some stumbling blocks and hacks, we\u2019ll tour the impressive world of web-based AI and agents You'll walk away with an introduction to the frontend-for-agents landscape and concrete next steps to prototype against WebMCP and start building today for the AI agents arriving tomorrow. In practice, the primary operational challenge stems from this breakdown: I've asked the question, \"Go find me a men's size 10.5 running shoe.\" And it's limited to only Web MCP tool calls.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Wouldn't it be nice if they had an agent-friendly interface that looked the MCP they know and love? Second of all, and this one's a powerful one, is that in a browser environment, when we expose a tool, you get the session. You get advantages sandboxing, isolation, permissions that come naturally from a browser from decades of battle-tested experience almost for free.", "takeaways": "\u2022 **Operational Discipline:** This is more important because when I find I'm working with web AI, I fix one thing and I break another, and evals are how you keep sense of the world and make sure it all makes sense."}, {"session_id": "1245138", "title": "Universal Commerce Protocol: Shopping, Lodging, Food", "category": "Protocols & Standards", "topic": "Agentic Commerce", "type": "Panel", "video_id": "IRVqm3N6SKc", "recording_link": "https://www.youtube.com/watch?v=IRVqm3N6SKc", "company": "Shopify, Google", "speaker": "Ilya Grigorik, Amit Handa, Greg Smith", "word_count": 4758, "has_transcript": true, "premise": "A panel discussion with Technical Council members and stewards of UCP. Learn about the protocol's current state and new initiatives expanding it to Lodging, Food, and more.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Part of the reason is why we started this protocol before I get to the tactical answer is it's not just defining a schema. Commerce is a workflow and it's a complex workflow, All your payment methods changed.\" Just negotiating through that whole workflow is a very complex piece.", "takeaways": "\u2022 **Operational Discipline:** I think if you remember earlier when we were designing the protocol, we always envisioned that commerce is going to go beyond grow beyond shopping."}, {"session_id": "1268639", "title": "Who, May, Did: Composing Agent Identity with Verifiable Proof of What Agents Actually Do", "category": "Multi-Agent & Orchestration", "topic": "Multi-Agent & Distributed Systems", "type": "Breakout", "video_id": "Fo0Qi6NqAeE", "recording_link": "https://www.youtube.com/watch?v=Fo0Qi6NqAeE", "company": "Action State Group, Inc.", "speaker": "Steven Mih", "word_count": 5366, "has_transcript": true, "premise": "Agents now move money, change records, and act across organizational boundaries. We have fast-growing answers for who an agent is (identity, discovery) and what it may do (authorization) \u2014 but not an independently verifiable record of what it actually did, checkable by a party that trusts neither the operator nor the agent. This talk makes the case for that missing \"did\" layer and shows it composing with the identity layer \u2014 not replacing it. We'll cover the may/did distinction (approved \u2260 executed \u2260 confirmed); how a tamper-evident, content-private action record references identity, delegation, and consent artifacts by digest (MCP tool calls, Agent Cards, DID/VC, and MIT NANDA's AgentFacts) instead of absorbing them; and how it anchors on open transparency-log standards (SCITT/COSE). Live joint demo with MIT NANDA: an agent discovered and identified through NANDA takes a real action in NandaTown, seals an action record that points back to its NANDA identity, and an open verifier proves it \u2014 then we tamper with it and watch verification fail. You'll leave with an open, framework- agnostic pattern for making agent actions provable, and a running verifier to try. In practice, the primary operational challenge stems from this breakdown: Because it's internal, the risk of its wrongs is more of a bad record. Therefore, we looked at this problem and we said who can show what happened when it goes wrong?", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: So, that's why we believe it's a layer that helps provide the semantics of what happened down to the very specifics of every single action that happened in a way that's tamper evident. We first started with tool calls as we started seeing many of tool calls happening. The capsules are have the meaning in the evidence book and the terms specs are versioned rows of what you are judging your evidence book and your capsules on.", "takeaways": "\u2022 **Operational Discipline:** They have a bunch of rules about how they should operate.\n\u2022 **Production Finding:** A lot of developers say, \"I don't know I had to do I don't even know what they're going to ask for, \" The most important thing is just put it in and it put it into an evidence book and later you can ask the questions with the terms pack."}, {"session_id": "1357490", "title": "Demo Theater: 5 Developers. 45 AI Agents. One workspace.", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "SandboxAQ", "speaker": "Phil Conway", "word_count": 0, "has_transcript": false, "premise": "The challenge is getting them to work together without constantly managing context and handoffs.", "technical_depth": "The technical architecture presented by Phil Conway (SandboxAQ) establishes concrete mechanisms to resolve these failure modes: Different agents, different models, one shared context that doesn't belong to any AI provider. Join us for a 10-minute live demo of Switch AI. We'll show you how our team works, the use cases we've built, and how to get your own agents working together without being locked into one tool or model. Switch AI is free and source available, bringing any agent, from any framework, into the tools your team already uses.", "takeaways": "\u2022 **Production Strategy:** https://github.com/sandbox-quantum/switch\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1354267", "title": "Demo Theater: Scale Agents with AX and Substrate", "category": "Enterprise & Production", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Google", "speaker": "Ivan Nardini", "word_count": 0, "has_transcript": false, "premise": "This session will show you how to use Agent substrate and AX to scale your agents. This session will show you how to use Agent substrate and AX to scale your agents.", "technical_depth": "The technical architecture presented by Ivan Nardini (Google) establishes concrete mechanisms to resolve these failure modes: This session will show you how to use Agent substrate and AX to scale your agents.", "takeaways": "\u2022 **Operational Scale:** This session will show you how to use Agent substrate and AX to scale your agents.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1354264", "title": "Demo Theater: Ready or Not, Here Come the Agents: Is the Web Ready for Its New Users?", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Ora", "speaker": "Ido Finder", "word_count": 0, "has_transcript": false, "premise": "What actually happens when an AI agent tries to get something done on your website? What actually happens when an AI agent tries to get something done on your website?", "technical_depth": "The technical architecture presented by Ido Finder (Ora) establishes concrete mechanisms to resolve these failure modes: In this 10-minute demo, we'll spawn real AI agents live, running on different harnesses and models, and give them the same task on an agent-ready website and on one that isn't. Along the way, we'll show how ora scans websites for agent readiness and walk through the quality metrics we use to score every agent journey.", "takeaways": "\u2022 **Cost & Metric Governance:** Along the way, we'll show how ora scans websites for agent readiness and walk through the quality metrics we use to score every agent journey.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1257527", "title": "AGENTS.md is the New CONTRIBUTING.md: A Field Report from One Year of Agent-Friendly Monorepos", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Breakout", "video_id": "jKbuqKv-M1E", "recording_link": "https://www.youtube.com/watch?v=jKbuqKv-M1E", "company": "Nutanix", "speaker": "Unnati Mishra", "word_count": 2991, "has_transcript": true, "premise": "AGENTS.md, the third AAIF founding project alongside MCP and goose has been quietly adopted by thousands of repos with almost no community discussion of what makes a good one. We will share a field experience of maintaining AGENTS.md across three open-source monorepos: where it lives (root vs per-package), what it contains that actually moves the needle (build commands, test commands, the forbidden directories), how it pairs with copilot-instructions.md and CLAUDE.md, and three concrete metrics by which the team measured whether the file was working (PR-from-agent merge rate, test-pass-rate on first try, human-edit count). In practice, the primary operational challenge stems from this breakdown: One file helped in one research and another file in another research it created a problem. In other in the every line is an order section, we'll cover why out of those two researches the agents file helped in one study and it was a problem in another one.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Agents.md was created around mid of last year and Linux Foundation created agent AI Foundation around December along with the three founding projects, that is MCP, Goose and agents.md. The fun part is in every conference that I go, I see that the MCP takes over the keynotes. If you have mentioned the project overviews, the directory tools, or some big essays, so they treat it a order, they read it dutifully, they get more context, burn more tokens, and that is known as inflation.", "takeaways": "\u2022 **Operational Discipline:** I have myself thought a lot of times and I've heard questions from many people that if we have cloud.md, if we have co-pilot instructions, or if we have cursor rules, does adding a agents file will help us or not?"}, {"session_id": "1246201", "title": "Anatomy of a Claude Code Plugin, and Lessons Learned on Creating One", "category": "Developer Tools & Frameworks", "topic": "Open Source Tools", "type": "Breakout", "video_id": "EXGVtB2E_5s", "recording_link": "https://www.youtube.com/watch?v=EXGVtB2E_5s", "company": "N/A", "speaker": "Charlie Lin", "word_count": 3640, "has_transcript": true, "premise": "As someone with no prior experience in experimenting with Claude Code, much less develop a plugin to augment experiences of certain developers, co-developing a plugin specifically for mixed Rust-Python project maintainers with proved rather enlightening. This plugin, which extends code review on such projects with LLM-driven insights, reveals a meandering journey of me designing and refining it: from leveraging Rust\u2019s ecosystem to integrating AI into developer workflows. This talk will share lessons on modular design for extensibility, balancing automation with human judgment, and ensuring adoption through clear documentation. Testing it on real Python projects wrapping around native extensions written in Rust revealed trade-offs between innovation and usability, offering practical guidance for aspiring Claude Code plugin developers.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Optionally, it can run a different a different script for fetching information from external tools. Finally, it can it can optional it can optionally grab information from Miri which is which is the de facto standard tool for finding memory leaks and undefined behavior. To elaborate what to elaborate what agents are, they are they are they are they are dispatched in a background to perform a specialized task and they're and they're defined in the in the agent subdirectory.", "takeaways": "\u2022 **Operational Discipline:** It also incorporates the aforementioned agents findings to connect change frequency with code quality.\n\u2022 **Production Finding:** Includes this rather important disclaimer due to due to the due to the due to the wide due to the usage of a wide variety of wide variety agents to examine almost every single aspect of of a project.\n\u2022 **Failure Mode Mitigation:** The health The health command basic basically scores each each finding from each agent and you can think of it as the TLDR version of the pre of the pre of the previous command.\n\u2022 **Deployment Rule:** Furthermore, it also demonstrates that trustworthy findings derived from the generated reports depend as much as precision as is on detection coverage."}, {"session_id": "1255663", "title": "Gating High-Risk Agentic Actions at the Relying Party with Exogenous (Out-of-Band) Inputs", "category": "Developer Tools & Frameworks", "topic": "Human-Agent Collaboration", "type": "Breakout", "video_id": "3BUTOTGlxxI", "recording_link": "https://www.youtube.com/watch?v=3BUTOTGlxxI", "company": "iProov", "speaker": "Dominic Forrest", "word_count": 4455, "has_transcript": true, "premise": "A Confused Deputy arises when a trusted system with legitimate authority is induced to use that authority for a high-risk or irreversible action that the Agent's principal did not intend, creating a relying-party (RP) risk of repudiation. The Agent may arrive with valid Tokens, passkeys, inherited session, or tool credentials, even if instructions have been shaped by prompt injection or model miscomprehension. Whilst the request is authenticated, human consent to the means taken is not. This session develops how RPs can deploy a gatekeeper to distinguish authorised access from authorised actions and produce a legally auditable record. When proving the principal is present and consenting, it assumes that any signal produced by the agent or its device remains endogenous to the compromised context. This requires an exogenous proof that the agent cannot generate, evaluated by the RP before execution. The talk presents a decentralised, open-source, relying-party pattern that does not require the agent or its operator to have onboarded to or used the scheme. It composes with OAuth, MCP, and passkeys, adding the missing intent boundary for agent-mediated workflows. In practice, the primary operational challenge stems from this breakdown: It was built to allow our staff to carry out high risk actions using a genetic AI, using AI in areas I couldn't have otherwise authorized. We realized that this is a problem many people have got.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: That specific itinerary, that specific plane ticket, that specific seat number, and that specific cost. It can go into the same it can be audited and go into the same systems for security as everything else done from a login perspective. We've got a room full of gateway providers next door.", "takeaways": "\u2022 **Operational Discipline:** Who in the room does not use open source software in their production platforms?\n\u2022 **Production Finding:** I'm not going to say you can be in production in an hour.\n\u2022 **Failure Mode Mitigation:** Do you have any best practices for or a session if, if you sign into a secure session, should you be asking the the customer to approve every single right action or could you do it up front once and then that carries on?"}, {"session_id": "1254678", "title": "GraphRAG: Building a Galactic Knowledge Layer for Enterprise AI", "category": "Enterprise & Production", "topic": "Building Reliable Agent Systems", "type": "Breakout", "video_id": "ZZBe8DI3Pbw", "recording_link": "https://www.youtube.com/watch?v=ZZBe8DI3Pbw", "company": "Neo4j", "speaker": "Stephen Chin", "word_count": 3660, "has_transcript": true, "premise": "Even a galactic empire can fail when its AI retrieves the right documents but misses the connections between them. Following one ambitious stormtrooper through a series of increasingly consequential knowledge failures, this talk explores how GraphRAG, graph-based retrieval, and graph memory have become a cornerstone of modern enterprise knowledge systems. Based on the O\u2019Reilly book GraphRAG: The Definitive Guide by Stephen Chin, Michael Hunger, and Jes\u00fas Barrasa, the session provides a practical map of the patterns behind these systems. We begin with the limits of vector-only RAG when questions are connected, multi-hop, dynamic, or require an explainable evidence chain. From there, we cover knowledge graph construction from structured and unstructured data, ontology-guided extraction, entity resolution, and the roles of lexical, domain, and meta graphs. We examine hybrid retrieval using vector search, BM25, graph filtering, guided traversal, Cypher templates, Text2Cypher, graph embeddings, community detection, and query-focused summarization. We then connect retrieval to graph memory and context graphs that preserve conversations, reasoning traces, tool activity, reusable procedures, and changing operational state. Along the way, we address evaluation, provenance, access control, freshness, governance, and the trade-offs involved in moving these systems into production. Attendees will leave with a decision framework for designing enterprise knowledge systems that are accurate, explainable, adaptive, and capable of supporting agents in large-scale enterprise scenarios. In practice, the primary operational challenge stems from this breakdown: I won't always stop the talk cuz we have a time limit, but does anybody see anything wrong with this cargo shipment? If he had this information when he was reviewing the shipments, he would have made a different assessment on the risk.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: We'll show a bunch of these patterns and models for how you can use graph and use retrieval to pull back more information. We have a schematic, so we know how the space station's laid out, and we can figure out the path of where it might be going. Lexical graphs are typically built off documents as you do intake of documents into a graph database.", "takeaways": "\u2022 **Operational Discipline:** So, this is importance because the graph remembers everything.\n\u2022 **Production Finding:** It even remembers the failed capes when our hero TK previously tried to get a cape.\n\u2022 **Failure Mode Mitigation:** It also remembers incidents across the space fleet for different potential issues.\n\u2022 **Deployment Rule:** We can get a fleet summary of all the different space stations in the fleet which had similar failures or issues recently."}, {"session_id": "1249880", "title": "Hand the Agent the Clicker", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "D2Z0CtN1vZo", "recording_link": "https://www.youtube.com/watch?v=D2Z0CtN1vZo", "company": "Amazon", "speaker": "Giovanni Laquidara", "word_count": 3571, "has_transcript": true, "premise": "Most developer tools are built for one kind of user: a human at a terminal, or, more recently, an AI coding agent calling an API. Building well for both at the same time is a different design problem from either one alone. This talk is about how to do it. The case study is Porthole, a CLI and MCP server that streams Android and Android TV emulators to a browser for a human and exposes the same controls to an AI Agent over MCP. The interesting move was treating the browser UI, the CLI, and the MCP server as three thin surfaces over a single set of primitives, with observability built into those primitives so an agent can verify each step it takes. I\u2019ll show the code, walk through the parts that surprised me, and pull out a handful of patterns that travel. Where to draw the line between primitives and workflows. Why observability tools end up being the most-called part of the API. You should leave able to look at a tool you maintain today and see what it would take to make it usable for both humans and agents. In practice, the primary operational challenge stems from this breakdown: During So, to face this issue, I started to think about how to create a tool to have this.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: These surfaces are the touch point of the user, that can be human or a agent, with the tool. It was the simplest solution as possible to expose a UI, a view to our an AI agent. The agent So as a human, I don't use the MCP server, but the agent can use independently these two take some action, get some data from the simulator.", "takeaways": "\u2022 **Operational Discipline:** It's important that every time you did an action the tool do does an action, it's checking that it's correct.\n\u2022 **Production Finding:** Because of the read were more, it's so important if you're developing a tool that is inter- helping you and the agent to do something, give more information to that.\n\u2022 **Failure Mode Mitigation:** This is the most important part because we need to understand what's happening, but also the agent need to understand what's happening.\n\u2022 **Deployment Rule:** Another rule is when you share the tool among the human agents, you need to be able to also sometimes to pause the agents or the human as well."}, {"session_id": "1257048", "title": "Harness Engineering: From MAST's Failure Taxonomy to MCP-Native Multi-Agent Production", "category": "Protocols & Standards", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "6D_xl5Tlr6w", "recording_link": "https://www.youtube.com/watch?v=6D_xl5Tlr6w", "company": "Cygnet Infotech LLC", "speaker": "Jay Mehta", "word_count": 4380, "has_transcript": true, "premise": "Research confirms what engineers discover in production: multi-agent AI systems fail at 41\u201386% across seven frameworks. MAST \u2013 the Multi-Agent Systems Failure Taxonomy (UC Berkeley, NeurIPS 2025) \u2013 identifies three root categories across 1,600+ execution traces: system design issues, inter-agent misalignment, and task verification failures. This talk bridges MAST's diagnostic framework to Harness Engineering \u2013 a 4-layer production methodology that maps each failure category to a concrete response, built entirely on open source tooling. I will go over two incidents that I faced and overcame. A customer service agent I built on LangGraph, and Zendesk corrupted hundreds of support tickets through one unvalidated tool call \u2013 silently, no errors, until we audited the data. A Kubernetes-hosted presales assistant I architected looped indefinitely on an out-of-distribution input and consumed real compute before the team caught it. Attendees leave with a complete harness architecture \u2013 MCP-native tool contracts, LangGraph orchestration harnesses, Pydantic schema contracts, and Opik telemetry \u2013 mapped to MAST's failure taxonomy and ready to apply to any production agentic system today. In practice, the primary operational challenge stems from this breakdown: Unfortunately, we found it in the audit not on when it was making this problems. You might able to realize that what situation you can be where you burn lot of compute, tokens, and eventually the cost.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Many of the time we have heard about the harness engineering. Harness engineering is a nothing but it's a idea around you have a model act as a an engine, and rest of other things, the harness, is all around the model. That's why we are call it for the safe call tool calls.", "takeaways": "\u2022 **Operational Discipline:** Basically, these are the nothing but the you are creating your guard and rules.\n\u2022 **Production Finding:** Basically, most of the time the domain and constraints the and the business rules comes into the play.\n\u2022 **Failure Mode Mitigation:** Key takeaways for us and for everybody the main thing is the structure.\n\u2022 **Deployment Rule:** Rest of other things are very important as a handoffs, tools, tool calls, stopping rules a hooks that you may you are using."}, {"session_id": "1254994", "title": "One MCP Server, Many Agents: The Identity Gap OAuth Doesn't Close", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "OE93ZpILb3k", "recording_link": "https://www.youtube.com/watch?v=OE93ZpILb3k", "company": "Nutanix", "speaker": "Mohit Gurnani", "word_count": 3927, "has_transcript": true, "premise": "Enterprise teams often route many agents through a shared MCP deployment with one service account \u2014 no per-user RBAC. Agents can end up accessing Jira or Slack data beyond what each triggering user is actually permitted to see. OAuth 2.1 is right for interactive agents. Client Credentials works headless but gives the agent its own identity \u2014 not the user's downstream permissions. RFC 8693 fits cross-domain services like Atlassian Cloud or GitHub.com. It's the wrong tool when the downstream service already validates your corporate identity provider's token natively \u2014 you'd be exchanging a token it already accepts. I contributed header forwarding to Envoy AI Gateway (PR #2047, v0.6): the gateway forwards the user's existing corporate identity per-backend, per-call. Jira enforces that user's RBAC, Slack scopes to their channels \u2014 no OAuth infrastructure, no IT setup, one MCPRoute config change across many backends and tools. The identity already existed. It just wasn't flowing through. This talk maps the decision framework across all four auth patterns, covers production security invariants, and closes with a verified Vault + ESO pattern \u2014 MCP credentials rotating live without pod restart. In practice, the primary operational challenge stems from this breakdown: There is a problem that seems boring until you hit this into production. Today I'll be explaining you the problem statement.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: You won't know which person accessed what tool at what time. The last one is header or path forwarding, also called as token pass-through. In this case, what really happens is you will use an existing credential that downstream tool understands.", "takeaways": "\u2022 **Operational Discipline:** Also, second recommendation is you should use external secret operator ESO, which will help you sync these tokens from your vault to Kubernetes.\n\u2022 **Production Finding:** In fact, the documentation of GitHub says that whenever you want to do some right, the personal access token will take preference over the OAuth because the right attribution is very important.\n\u2022 **Failure Mode Mitigation:** Now let's talk about how do you run these things in production,\n\u2022 **Deployment Rule:** Here again, it's a recommendation, but of course you're free to use whatever Gateway you want."}, {"session_id": "1242729", "title": "What Production Knows: Closing the Loop Between AI Agents and the Systems They Build", "category": "Enterprise & Production", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "", "recording_link": "", "company": "Hud", "speaker": "May Walter", "word_count": 0, "has_transcript": false, "premise": "But for high-velocity teams, the more interesting flow runs the other way, production telling the agents what is actually happening, so they can fix, refactor, and keep shipping without drifting away from reality. It looks at what changes when the systems we operate start moving faster than the people who own them, the failure modes that quietly become normal when agents work without ground truth, and the durable plumbing that keeps them honest: traces, error budgets, customer signal, SLO breaches, incident timelines, all fed back as first-class inputs to the tools doing the writing.", "technical_depth": "The technical architecture presented by May Walter (Hud) establishes concrete mechanisms to resolve these failure modes: This talk is about that reverse loop.", "takeaways": "\u2022 **Production Strategy:** If the broader AI shift is changing what it means to author code, this is the operational half of that story: the feedback infrastructure that makes the new way of working actually safe to run.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Agentic Engineering workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1288851", "title": "Attendee Reception", "category": "Protocols & Standards", "topic": "Breaks / Meals / Special Events", "type": "Breakout", "video_id": "", "recording_link": "", "company": "N/A", "speaker": "N/A", "word_count": 0, "has_transcript": false, "premise": "Good food, cold drinks, even better conversations. Good food, cold drinks, even better conversations.", "technical_depth": "The technical architecture presented by N/A (N/A) establishes concrete mechanisms to resolve these failure modes: Unwind and enjoy the night after AGNTCon + MCPCon North America Day 1!", "takeaways": "\u2022 **Production Strategy:** What's On the Menu: Slider Bar: Crispy Chicken with Red Cabbage, Chili Aioli on a Brioche Bun Angus Beef with Cheddar, Pickles, Garlic Aioli on a Brioche Bun Baked Potatoes: Red Potato, Creamed Mushroom + Spinach, Sharp White Cheddar (Vegetarian, GF) Yukon Gold Potato, Sour Cream, Green Onion, Bacon Bites, Cheddar Cheese (GF) Fall Vegetable Flatbread (Vegetarian) Brussel Sprout Salad Cup (Vegan, GF) Black Bean Cake with Corn Salsa, Chili Oil, Micro Cilantro (Vegan, GF) Fried Spring Roll (Vegan) Turmeric Yogurt Chicken Skewers (GF) Mini Desserts: Assorted Tarts, Cheesecakes, Chouschous, Eclairs Vegan + GF Cookies: Ginger Molasses, Sea Salt Chocolate Chip, Lemon Bar, and Chocolate Chip Brownie (Vegan, GF)\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Breaks / Meals / Special Events workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1250790", "title": "Poster: A Zero-Trust Identity Model for Production Agents", "category": "Enterprise & Production", "topic": "Poster Presentations", "type": "Breakout", "video_id": "", "recording_link": "", "company": "DataRobot", "speaker": "Jayanth Rajashekariah", "word_count": 0, "has_transcript": false, "premise": "The security review queue becomes the bottleneck on every release. We cover: (1) why IAM systems designed for users and services break down when the principal is an autonomous agent; (2) the OAuth Subject vs.", "technical_depth": "The technical architecture presented by Jayanth Rajashekariah (DataRobot) establishes concrete mechanisms to resolve these failure modes: This session presents a zero-trust identity pattern that gives agents a first-class, governable place in your identity stack. Actor claim distinction that captures the human-to-agent-to-tool chain at every hop; (3) Intersection Authorization, where effective permissions are computed dynamically; (4) immutable audit lineage; (5) how this composes across different frameworks (CrewAI, LangGraph, LlamaIndex) and protocols (MCP, AGENTS.md, custom). Attendees leave with a deployable identity pattern, the math their security team needs to verify it, and lessons from rollouts in regulated industries.", "takeaways": "\u2022 **Production Strategy:** Most production agents are running on what amounts to a god-mode API key: broadly scoped, long-lived, and shared across teams.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Poster Presentations workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1254055", "title": "Poster: Agentic Chartering: a Zero Trust Architecture for Autonomous Execution", "category": "Developer Tools & Frameworks", "topic": "Poster Presentations", "type": "Breakout", "video_id": "", "recording_link": "", "company": "BlueFolders", "speaker": "Adam Terlson", "word_count": 0, "has_transcript": false, "premise": "This works for simple tasks, but breaks down as workflows get longer, more data is passed around, and new tools are added. This leads to agents that are expensive, unreliable, and hard to operate. The challenge with current approaches (like MCP CodeMode) is that agents write and run arbitrary code in production. That creates security and operations problems that relegates this class of agents to the sandbox, or a developer's machine.", "technical_depth": "The technical architecture presented by Adam Terlson (BlueFolders) establishes concrete mechanisms to resolve these failure modes: Most agentic systems today rely on the model to orchestrate execution by chaining tool calls together. The answer is clear: use code to do the tool call orchestration instead. In this talk, Adam Terlson introduces and demonstrates a different approach: have the agent produce a static, declarative Finite State Machine (called a Charter), then interpret that Charter as code instead. The agent is up to 99% more context efficient, is able to effectively use 1000s of tools, and has many other benefits. See for yourself how this architecture can make agents far more capable, reliable, observable, and secure at global scale\u2014no sandbox required!", "takeaways": "\u2022 **Operational Scale:** See for yourself how this architecture can make agents far more capable, reliable, observable, and secure at global scale\u2014no sandbox required!\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Poster Presentations workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1257516", "title": "Poster: Beyond the Diff: Giving Agents the Why Behind a Commit", "category": "Developer Tools & Frameworks", "topic": "Poster Presentations", "type": "Breakout", "video_id": "", "recording_link": "", "company": "AgentOne", "speaker": "Elijah Pettit", "word_count": 0, "has_transcript": false, "premise": "Git tells you what changed. Git tells you what changed.", "technical_depth": "The technical architecture presented by Elijah Pettit (AgentOne) establishes concrete mechanisms to resolve these failure modes: I'll walk through a concrete example and show how that context can help you understand a change, revisit an earlier attempt, and hand work off to another agent without explaining everything again.", "takeaways": "\u2022 **Production Strategy:** Come by to see how it works and talk about what's worth keeping from an agent session \u2014 and what isn't.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Poster Presentations workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1348554", "title": "Poster: From Data to Meaning: How Microsoft Fabric IQ Grounds Enterprise AI", "category": "Enterprise & Production", "topic": "Poster Presentations", "type": "Breakout", "video_id": "", "recording_link": "", "company": "Microsoft Corporation", "speaker": "Girish Dasarathy", "word_count": 0, "has_transcript": false, "premise": "Modern AI agents can generate answers, but enterprise users need answers grounded in trusted business definitions and governed data.", "technical_depth": "The technical architecture presented by Girish Dasarathy (Microsoft Corporation) establishes concrete mechanisms to resolve these failure modes: Microsoft Fabric, a unified analytics platform built on OneLake, addresses this with Fabric IQ, a shared context layer built in tiers. Semantic models add trusted metrics, relationships, and business vocabulary. On top of these layers, Fabric Data Agents act as virtual analysts. This poster traces that path from question to answer. It also shows how the same context serves Microsoft 365 Copilot, Copilot Studio, Foundry, and custom applications while keeping metric
