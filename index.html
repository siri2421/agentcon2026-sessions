** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1361447", "title": "Sponsored Activity - Build and Explore Agentic Infrastructure Hands-On", "category": "Developer Tools & Frameworks", "topic": "Sponsored Activity", "type": "Breakout", "video_id": "", "recording_link": "", "company": "N/A", "speaker": "N/A", "word_count": 0, "has_transcript": false, "premise": "Get hands-on with agentic infrastructure through interactive labs covering agentgateway, kagent, Agent Substrate, agentregistry, and more.", "technical_depth": "The technical architecture presented by N/A (N/A) establishes concrete mechanisms to resolve these failure modes: Get hands-on with agentic infrastructure through interactive labs covering agentgateway, kagent, Agent Substrate, agentregistry, and more. Sponsor: Solo.io Location: Booth D3 in Solutions Showcase (Concourse Level) In order to facilitate networking and business relationships at the event, you may choose to visit a third party's booth or access sponsored content. This data includes your first name, last name, title, company, address, email, standard demographics questions (i.e.", "takeaways": "\u2022 **Production Strategy:** Explore how these open source projects help you build, run, and connect AI agents, then leave with practical experience you can apply to your own agentic workloads.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Sponsored Activity workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1361806", "title": "Sponsored Activity - Heads, Tails & Guardrails", "category": "Security & Governance", "topic": "Sponsored Activity", "type": "Breakout", "video_id": "", "recording_link": "", "company": "N/A", "speaker": "N/A", "word_count": 0, "has_transcript": false, "premise": "Come play Heads, Tails & Guardrails at the Celigo booth #27, a fast trivia game for the whole crowd.", "technical_depth": "The technical architecture presented by N/A (N/A) establishes concrete mechanisms to resolve these failure modes: Sponsor: Celigo Location: Booth 27 in Solutions Showcase (Concourse Level) In order to facilitate networking and business relationships at the event, you may choose to visit a third party's booth or access sponsored content. This data includes your first name, last name, title, company, address, email, standard demographics questions (i.e.", "takeaways": "\u2022 **Production Strategy:** job function, industry), consenting to receipt and use of such data by the third-party recipients, which will be subject to their own privacy policies.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Sponsored Activity workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1237500", "title": "1,149 Hackers Tried to Break Our AI Agent Guardrails. 0 Succeeded. Here's Why.", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Breakout", "video_id": "Tw2gjRyoBMY", "recording_link": "https://www.youtube.com/watch?v=Tw2gjRyoBMY", "company": "APort", "speaker": "Uchi Uchibeke", "word_count": 2786, "has_transcript": true, "premise": "Every agent framework gives your AI tools. None of them ask: \"should this agent be allowed to use this tool right now?\" We built an open-source pre-action authorization layer that intercepts tool calls before execution - not in the prompt, but in the framework hook. Then we let 1,149 people try to break it in a public CTF. Attack success rate dropped from 74.6% to 0%. Outline: 1) The architectural gap: Why post-hoc guardrails (NeMo, Guardrails AI) can't prevent actions they only detect - and why pre-action authorization is a different layer entirely 2) The OAP spec: How the Open Agent Passport works - agent identity, capability-scoped policies, and Ed25519-signed decisions at ~65ms p50 3) Live CTF data: What 1,149 attackers actually tried, which attack patterns worked against unprotected agents, and why deterministic policy enforcement stopped all of them 4)The convergence: Why three independent groups (APort, Microsoft AGT, Airia) shipped the same architectural pattern within weeks of each other - and what that means for the stack 5)Live demo: I'll configure a passport, attach it to Claude Code, and show an allow and a deny in real-time with the audit trail In practice, the primary operational challenge stems from this breakdown: In today's talk, we're going to see how an agent autonomously handles a customer support request and issues a refund to that customer. We ran a capture the flag challenge and used it to run an a benchmark of 14 AI models across eight labs across over a quarter million evaluations.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: I'm, as, that can be very tricky, especially for compliance if you're working with the regulated industry. The open agent's passport is an open spec on it's on GitHub. What it does is that it links this passport to my Cloud Code pretty tool use hook.", "takeaways": "\u2022 **Operational Discipline:** Then what we also wanted to find is does this rule apply across other models or was it just for the first model we tried?\n\u2022 **Production Finding:** One very interesting attack pattern that we discovered was people writing messages that look a result from a tool call.\n\u2022 **Failure Mode Mitigation:** Switching back to the last part of this, in conclusion, think about what we talked about with Jordan,"}, {"session_id": "1258060", "title": "Architecting Agentic Commerce: The Universal Commerce Protocol and Agent Payments Protocol", "category": "Protocols & Standards", "topic": "Agentic Commerce", "type": "Breakout", "video_id": "WRnh_fAWhyY", "recording_link": "https://www.youtube.com/watch?v=WRnh_fAWhyY", "company": "Google", "speaker": "Amit Handa, Shonan Shah", "word_count": 4350, "has_transcript": true, "premise": "Addresses the combinatorial N x M integration explosion when disparate AI agents attempt to transact directly with independent merchants. Autonomous commerce breaks down over four foundational trust questions: verifying the agent's identity, negotiating compatible operational capabilities, proving genuine human intent without requiring real-time human presence during execution, and establishing cryptographic non-repudiation.", "technical_depth": "Google architected a two-protocol stack to establish an open commerce foundation:\n1. Universal Commerce Protocol (UCP): Handles discovery and capability negotiation via standard HTTPS headers and well-known endpoints under the dev.ucp namespace. Both agents and merchants publish declarative profiles; supported capabilities (catalog search, cart estimation, checkout) are calculated via set intersection. The checkout workflow is modeled as a formal deterministic state machine with strict prompt-injection hygiene.\n2. Agent Payments Protocol (AP2): Solves 'Human Not Present' transactions using Selective Disclosure JWTs (SD-JWT). The merchant's signed checkout hash is bound directly into a Checkout Mandate, which in turn acts as the transaction ID inside the Payment Mandate, forming an unbroken cryptographic chain.", "takeaways": "\u2022 **Deterministic Execution Surface:** Language models must NEVER serve as the cryptographic signing authority for financial payments; models can hallucinate or display one interface while signing another. Mandates require an isolated, deterministic code runtime (wallet app).\n\u2022 **Public Key Binding:** The agent's public key is directly baked into the mandate confirmation (CNF field), preventing man-in-the-middle mandate hijacking.\n\u2022 **Handoff Durability:** UCP embeds a continue_url at every state transition, enabling seamless handoff back to a human-in-the-loop merchant surface whenever risk thresholds or legal constraints are exceeded."}, {"session_id": "1339080", "title": "How Open Standards Solve the Missing Identity Layer for AI Agents", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Sponsored Session", "video_id": "IfAxktGni_I", "recording_link": "https://www.youtube.com/watch?v=IfAxktGni_I", "company": "Okta", "speaker": "Aaron Parecki, Danny Zollner", "word_count": 3943, "has_transcript": true, "premise": "As AI agents transition from concept to autonomous enterprise tools, traditional access models are breaking down. Relying on legacy OAuth flows, static API keys, and service accounts that bypass Zero Trust controls creates shadow AI footprints, consent fatigue, and unmanageable identity sprawl. The industry needs open, vendor-neutral standards so applications and agents can securely establish trust across enterprise environments. In this session, identity standards experts Aaron Parecki and Danny Zollner will explore the emerging protocols that make secure, seamless AI interoperability possible. They will break down the rapid adoption of the Cross App Access (XAA) protocol, dive into the IETF\u2019s Workload Authorization Grant (WAG) for agents operating on their own behalf, and examine why SCIM must evolve to enable provisioning and lifecycle management of agent identities. Join us to learn why cross-industry collaboration is essential, and how practitioners and vendors alike can help move the industry forward, rather than waiting for someone else to decide how agent identity works. ******************************* _In order to facilitate networking and business relationships at the event, you may choose to visit a third party\u2019s booth or access sponsored content. You are never required to visit third party booths or to access sponsored content. When visiting a booth or participating in sponsored activities, the third party will receive some of your registration data. This data includes your first name, last name, title, company, address, email, standard demographics questions (i.e. job function, industry), and details about the sponsored content or resources you interacted with. If you choose to interact with a booth or access sponsored content, you are explicitly consenting to receipt and use of such data by the third-party recipients, which will be subject to their own privacy policies_ In practice, the primary operational challenge stems from this breakdown: We're here today to talk about shockingly identity standards [ ] and how they solve a bunch of problems related to identity with AI agents. So none of those problems are solved by anyone company's product roadmap.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: That app Claude is going to try to be It's going to try to access data from some MCP server that is part of another enterprise app, let's call it Atlassian. When we are going to have Claude try to go and reach out to the Atlassian API, we can go and take the fact that the user has signed in to Claude through the IDP, it can go and do a back channel exchange to get a token for Atlassian. But essentially, there's this idea of the platform that the agents are running in issues these tokens or vouchers for each agent that's on that platform and says, \" here's an agent on the platform.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Aaron Parecki, Danny Zollner.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1238862", "title": "Is Your Agent Any Good? Lessons From a Wide and a Deep Deployment", "category": "Enterprise & Production", "topic": "Enterprise Adoption in Practice", "type": "Breakout", "video_id": "y9dJET0EOvI", "recording_link": "https://www.youtube.com/watch?v=y9dJET0EOvI", "company": "Adaptive Security", "speaker": "Ethan Lo, Jason Jiang", "word_count": 4429, "has_transcript": true, "premise": "One of our agents knows its false positive rate to the decimal. For the other few hundred, \ud83e\udd37\u200d\u2642\ufe0f That's the gap between two teams at Adaptive Security, an AI cybersecurity startup. AI Enablement (Ethan) rolled out agents to 200+ people in every department. One of the most popular was built by our head of CS over a weekend, and it ran on a Mac mini until it kept falling over. Email Security (Jason) built a detection pipeline that answers one question: is this email malicious? Both teams ended up doing the same four things: find the judge (the person who can tell a good answer from a bad one), build the agent, design the eval loop, and improve iteratively. We just did them in a different order. Jason built the evaluation tooling before anything shipped. Ethan shipped first and figured out the eval loop later (it ended up being Slack emoji reactions). We'll cover what each order got us, how we decide when a change is safe to make, and what broke when nobody was looking. In practice, the primary operational challenge stems from this breakdown: The outputs can be very, very messy, which is a really interesting problem. It's a very different shape of problem than Ethan tackled.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: This is great.\" And in addition to that, I think what's really interesting is that they also designed their own eval. As part of their own initiative, they went and designed an evaluation system, which was very simple but effective. We just gave them the tools, we gave them the SaaS apps, and they came up with it themselves.", "takeaways": "\u2022 **Operational Discipline:** If there's a single thing that I could leave with you, it's really just to stress how important it is to save and to look at agent traces.\n\u2022 **Production Finding:** I think, this is really just a takeaway contrasting the wide deployment that Ethan talked about, right, enabling a team or a workforce to use AI, and the deep deployment that we have in our email security product.\n\u2022 **Failure Mode Mitigation:** I think, finding your judge and making sure it is a person close to the domain and capable of making the decisions."}, {"session_id": "1362592", "title": "Superpowering ChatGPT with mcp Extensions", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "Biw8telskYM", "recording_link": "https://www.youtube.com/watch?v=Biw8telskYM", "company": "OpenAI", "speaker": "Victor Lin", "word_count": 4082, "has_transcript": true, "premise": "In this talk, we\u2019ll explore how OpenAI is enabling developer plugins that feel like first-class features of ChatGPT through plugin extensions, announced at DevDay. We\u2019ll trace the journey from introducing the Apps SDK and helping shape MCP Apps last year to launching plugin extensions this year. We\u2019ll showcase key use cases, discuss where these extensions could fit into the MCP and MCP Apps standards, and share what we\u2019ve learned from iterating on the spec with internal teams and external developers. In practice, the primary operational challenge stems from this breakdown: But the issue is that it's a pretty limited spec.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: I think it's worth asking why do we lean so heavily on MCP? There is the standard argument of oh, MCP provides all this tooling, all this plumbing, apps allow you to provide secure UI, it's cross-platform by default, you know, your same app renders inside of mobile, inside of desktop, inside of the browser. So I think the best way to keep things approachable is to lean in even more heavily on MCP.", "takeaways": "\u2022 **Operational Discipline:** This was incredibly important for us in terms of, making sure that your apps feel native to ChatGPT."}, {"session_id": "1317649", "title": "The Agent Has Left the Chat", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Breakout", "video_id": "TZMu0LhTG6k", "recording_link": "https://www.youtube.com/watch?v=TZMu0LhTG6k", "company": "Microsoft", "speaker": "Harald Kirschner", "word_count": 0, "has_transcript": false, "premise": "Client-owned chats break down when agents run for hours, continue remotely, work in parallel, or need attention after the original window closes.", "technical_depth": "The technical architecture presented by Harald Kirschner (Microsoft) establishes concrete mechanisms to resolve these failure modes: MCP connects tools and live data. Agent Plugins bundle those capabilities for compatible clients. The next missing layer is the work itself. This talk explores that missing layer through VS Code\u2019s Agent Host and the open Agent Host Protocol (AHP). A dedicated host owns the live session while editors, browsers, the VS Code Agents window, and custom applications become clients for monitoring, reviewing, and steering it. Through a multi-client demonstration, we\u2019ll show why portable sessions require authoritative shared state\u2014not another stream of chat events\u2014and how AHP lets agent work outlive any one interface.", "takeaways": "\u2022 **Production Strategy:** Through a multi-client demonstration, we\u2019ll show why portable sessions require authoritative shared state\u2014not another stream of chat events\u2014and how AHP lets agent work outlive any one interface.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Interoperability & Standards workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1256368", "title": "The MCP Cold-Start Problem: When Your Agent Has 100 Tools and Has to Pick One", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "R5xD9csdGyQ", "recording_link": "https://www.youtube.com/watch?v=R5xD9csdGyQ", "company": "Ibm", "speaker": "Karthik Karunanithi", "word_count": 3149, "has_transcript": true, "premise": "Every MCP demo shows three tools. Every enterprise deployment I've worked on ends up with sixty. Nobody talks about what happens in between. When an agent has 100 tools available over MCP, the model has to pick the right one on every call. Tool descriptions start competing for attention. The context window fills up with tool metadata before the real prompt even lands. Selection accuracy that looked like 95% in the demo drops hard once the tool count grows. Latency climbs with it. This talk is about that gap. What actually breaks as your MCP deployment grows from 5 tools to 50, and the patterns I've seen hold up in production. I'll cover three things that worked: hierarchical tool routing, splitting one agent into specialized agents with curated tool subsets, and on-demand tool discovery with caching. I'll also be honest about what the 2026 MCP spec changes help with and what they leave unsolved. This is grounded in real enterprise deployments, not benchmarks. If you're past the demo phase and your tool count is growing, this is the talk for you. No slides full of buzzwords. Just what I've seen break and what fixed it. In practice, the primary operational challenge stems from this breakdown: I thought, the metrics around accuracy is the biggest problem. It's something that coming from my experiences, but it really made me take a step back and really understand this problem.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: I built I built rebuilt all of those experiments based on my experiences in a controlled lab environment. Under tools, 20 day 22 everyday requests, refund an order or, reset the password, things that. I kept adding tools hoping it's going to break or do something weird, but it never did.", "takeaways": "\u2022 **Operational Discipline:** Every time, a agent request comes in, all the rules all the rules and guardrails that you have set in the control plane is going to it's going to enrich your workflow,\n\u2022 **Production Finding:** If you look on the right-hand side, it shows,, it's it has a bunch of items, which version, which rule.\n\u2022 **Failure Mode Mitigation:** It just denies it, and that's the rule engine acting.\n\u2022 **Deployment Rule:** My experience is do a small proof of concept before you take it into production, cuz my systems could be different than yours."}, {"session_id": "1256906", "title": "Workshop: Break the Lethal Trifecta: Designing Access Boundaries Agents Can't Talk Their Way Past", "category": "Developer Tools & Frameworks", "topic": "Workshops", "type": "Workshop", "video_id": "vsP9-DCOokU", "recording_link": "https://www.youtube.com/watch?v=vsP9-DCOokU", "company": "Workato", "speaker": "Zayne Turner, Chris Miller", "word_count": 9035, "has_transcript": true, "premise": "An AI agent with access to private data, exposure to untrusted content, and a path to send data out is structurally exploitable: no amount of system prompt hardening can close this. The model following your access-control instruction is the same model following an attacker's injected one. Simon Willison, in an essay identifying the threat, named it the \"lethal trifecta.\" Many teams still rely on system prompts, and injection studies show that's illusion, not control. This hands-on workshop builds the architectural alternative: making the capabilities an agent can reach as small as its role requires, so a compromised agent's blast radius is bounded by design. You'll take a multi-persona agent system and design its capability surfaces so no single caller's namespace holds all three legs of the trifecta. We'll walk an enforcement spectrum: hardcoded tool lists, gateway filtering, structural separation. We'll look at how to evaluate your system against a clear litmus test: can your system prompt leak and your tool list be published without compromising access control? You'll leave with working diagnostic techniques, practice spotting anti-patterns and applying mitigation strategies. **Space Limited - First Come, First Served. Please bring a fully charged laptop to the workshop** In practice, the primary operational challenge stems from this breakdown: It's going to be based on an open source sample app that is intentionally broken. You are going to be playing with an intentionally broken app throughout the day.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: The MCP servers that support it after you run all your scripts, they also live here and they're named to match the hacks so you can see exactly which tool is where and you can follow along and understand those descriptions. As you move through, you're going to be able to see the description that's going to be shown to the agent and all the tool descriptions as well, just to show you what's on the back side. That is then controlling which MCP server you're hitting so that for sure you're doing the right exercise and that the model is behaving the way that you expect it to.", "takeaways": "\u2022 **Operational Discipline:** It's a very long response and I will go to VS Code and let's just get it on here and let's just anyone remember how to make this format as JSON?"}, {"session_id": "1256232", "title": "Workshop: Stack It Yourself: Open Infrastructure for AI Agents, from Compose to Cluster", "category": "Developer Tools & Frameworks", "topic": "Workshops", "type": "Workshop", "video_id": "3b2FC5FdL3M", "recording_link": "https://www.youtube.com/watch?v=3b2FC5FdL3M", "company": "Microsoft", "speaker": "Brian Benz, Pamela Fox", "word_count": 16664, "has_transcript": true, "premise": "When you start building AI agents, the infrastructure choices you make on day one shape how portable, observable, and production-ready your system will be on day 100. Most tutorials hand you a proprietary API key and wish you luck. But real agent systems need inference flexibility, structured observability, and a path from laptop to cluster that doesn't require a rewrite. In this workshop, participants will build a working AI agent using the open-source agent-framework on open infrastructure. We'll wire up local LLM inference through OpenAI-compatible servers like Ollama and vLLM, instrument everything with OpenTelemetry, and stand up a full LGTM observability stack (Loki, Grafana, Tempo, Prometheus) to trace agent behavior and performance and Redis for durable chat history. Every component runs in Docker Compose locally and can port directly to Kubernetes with no code changes. Participants will leave with a running agent stack they can extend, an understanding of how open inference servers decouple you from proprietary APIs, and hands-on experience wiring observability into agentic workloads. **Participants should bring a machine capable of running Docker and a local LLM server. Before you arrive, please download these mandatory prerequisites to avoid issues with conference Wi-Fi and provider throttling: https://aka.ms/agntcon-mcpcon-prerequisites** **Space Limited - First Come, First Served. Please bring a fully charged laptop to the workshop** In practice, the primary operational challenge stems from this breakdown: It's an old, [ ], this is one of the limitations with working with a model.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: History and process memory, telemetry off, no tools. When we go in here now in the stack itself workshop app you can see over here open AAI responses Quinn 317B open AI responses model is the class we're using responses history still in memory no tools telling Richie's off and we got a new ID for this. Still doing the same thing, but now you can see out here it's listing 55 tokens.", "takeaways": "\u2022 **Operational Discipline:** Always best practice when we're doing any network operations is to be using the async op option for it for better concurrency.\n\u2022 **Production Finding:** I don't particularly recommend that because then you lose the earliest messages in your conversation.\n\u2022 **Failure Mode Mitigation:** A lot of times the earliest messages in a conversation are the most important ones.\n\u2022 **Deployment Rule:** I think there's a lot of really interesting things to think about when you start to productionize this."}, {"session_id": "1362632", "title": "Demo Theater: Beyond Token Pricing: Building Efficient Agents with Step 5 Preview", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Stepfun", "speaker": "Frank Li", "word_count": 0, "has_transcript": false, "premise": "We'll discuss how to balance task quality and cost across coding and professional workflows, with an emphasis on efficiency at the task level.", "technical_depth": "The technical architecture presented by Frank Li (Stepfun) establishes concrete mechanisms to resolve these failure modes: Building efficient agents requires understanding how model capabilities, agent frameworks, and tools work together. This session introduces Step 5 Preview and explores practical considerations for model selection and agent design.", "takeaways": "\u2022 **Cost & Metric Governance:** We'll discuss how to balance task quality and cost across coding and professional workflows, with an emphasis on efficiency at the task level.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1364888", "title": "Demo Theater: Building the Agent Tool Layer: From APIs to Governed MCPs", "category": "Protocols & Standards", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Gravitee", "speaker": "Cruse Sweeney", "word_count": 0, "has_transcript": false, "premise": "AI agents need tools to act, and enterprises have spent years on tailoring APIs to gain access to enterprise data. The challenge isn\u2019t simply exposing them through MCP.", "technical_depth": "The technical architecture presented by Cruse Sweeney (Gravitee) establishes concrete mechanisms to resolve these failure modes: AI agents need tools to act, and enterprises have spent years on tailoring APIs to gain access to enterprise data. We\u2019ll transform existing REST APIs into reusable MCP Tools, compose them into a purpose-built MCP Server, and make those tools available to an AI agent. Then we\u2019ll add the controls needed for the real world: agent identity, MCP server access registration, delegated human access, and runtime authorization over the data behind each tool. You\u2019ll see how API management, MCP, identity, and authorization come together to create a governed Agent Tool Layer, turning the APIs you already have into secure, composable capabilities built for agents.", "takeaways": "\u2022 **Protocol Specification:** You\u2019ll see how API management, MCP, identity, and authorization come together to create a governed Agent Tool Layer, turning the APIs you already have into secure, composable capabilities built for agents.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1369867", "title": "Demo Theater: Non-Deterministic Minds, Determinitic Tools", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Orkes", "speaker": "Adrian Warman", "word_count": 0, "has_transcript": false, "premise": "Agents think in probabilities and are great at reasoning, but that doesn't always translate to reliability in production.", "technical_depth": "The technical architecture presented by Adrian Warman (Orkes) establishes concrete mechanisms to resolve these failure modes: Orkes Conductor treats agents as just another step in an orchestrated workflow, giving you control over how they interact with data and other systems, so you can keep one hand on the agentic wheel.", "takeaways": "\u2022 **Production Strategy:** Orkes Conductor treats agents as just another step in an orchestrated workflow, giving you control over how they interact with data and other systems, so you can keep one hand on the agentic wheel.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1335348", "title": "Agents, Infrastructure, and the Future of AI-native Applications", "category": "Enterprise & Production", "topic": "Enterprise Adoption in Practice", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Vultr", "speaker": "Mohamed Maktal", "word_count": 0, "has_transcript": false, "premise": "Every application ever built needs to be rebuilt - with agentic AI at the core. Every application ever built needs to be rebuilt - with agentic AI at the core.", "technical_depth": "The technical architecture presented by Mohamed Maktal (Vultr) establishes concrete mechanisms to resolve these failure modes: Moving from cloud-native to ai-native means a new architecture for unlocking enterprise data to safely and securely deliver personalized experiences and services at scale.", "takeaways": "\u2022 **Production Strategy:** In this session, we\u2019ll explore a new infrastructure approach to unlock enterprise AI - and how agents can help.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Enterprise Adoption in Practice workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1257260", "title": "Beyond LLMs in a Loop: Building Trusted Agents in Regulated Industries", "category": "Enterprise & Production", "topic": "Enterprise Adoption in Practice", "type": "Breakout", "video_id": "-n7Lq3bwudg", "recording_link": "https://www.youtube.com/watch?v=-n7Lq3bwudg", "company": "Aerospike", "speaker": "Lucas Beeler", "word_count": 3397, "has_transcript": true, "premise": "Most agentic systems in regulated industries face the same challenge: compliance, legal, and audit teams often reject deployment once they understand how LLMs make decisions. The popular \u201cLLM calls tools in a loop\u201d architecture is poorly suited for HIPAA, SOX, PCI-DSS, and similar requirements. Guardrails can reduce known risks, but they cannot guarantee compliance, safe behavior, or auditable outcomes. This session presents an alternative architecture for trusted agents. Rather than placing the LLM at the center of decision-making, the model is limited to tasks such as translating human intent into specifications. Core reasoning is performed by deterministic systems using classical AI techniques, including knowledge representation, formal verification, and constraint-satisfaction solvers. Using a production HIPAA-compliant healthcare staffing agent as a case study, the talk shows how natural-language requests become verified specifications, how staffing plans are generated, and how audit-ready evidence is maintained. Attendees will leave with a practical framework for building compliant, trustworthy agents in regulated environments. In practice, the primary operational challenge stems from this breakdown: Who asked who challenged the class to reverse engineer basically something that looked vaguely or worked vaguely Google News, In finance, if you exceed your exposure limits, you're looking at a nasty SEC investigation.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: We would basically do some, LangGraph plus MCP tooling, It was knowledge representation and knowledge automation, which is what this would be called or knowledge engineering. I define an agent as trustworthy, having built systems in these industries, Now, I'm going to discuss two systems that they are very enterprisey, they're pretty heavily protected by NDAs.", "takeaways": "\u2022 **Operational Discipline:** But, the key is that you make an assertion and then there's this verification,\n\u2022 **Production Finding:** In capital markets it's SEC rules, it's what your bank is doing, what your bank's existing exposure limits are.\n\u2022 **Failure Mode Mitigation:** Your knowledge representation here is incredibly important."}, {"session_id": "1293102", "title": "Decentralized Discovery: MCP, Skills, and Beyond with AI Catalog", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Breakout", "video_id": "Ro2EpOIYRQA", "recording_link": "https://www.youtube.com/watch?v=Ro2EpOIYRQA", "company": "Warp.dev", "speaker": "Tadas Antanavicius", "word_count": 3836, "has_transcript": true, "premise": "Agents, when equipped with the right Skills and MCP servers, can accomplish nearly any task a human can do with a computer. Today, that typically involves one notable pre-requisite: human-initiated pre-installation of those Skills and MCP servers. The new AI Catalog standard developed in collaboration between individuals from Anthropic, Google, Microsoft, Cisco, and others paves a path to eliminating that pre-requisite. By rallying around a standardized .well-known/ai-catalog.json URI, agents like Claude.ai, Claude Code, Goose, and others can accomplish mid-session discovery of artifacts like Skills and MCP servers. For example, if you didn't know a GitHub MCP server existed (or how to connect to it) when you asked your coding agent to perform a PR review, your coding agent can now automatically discover that MCP server and offer to install and connect to it before it even starts the review. This dynamic unlocks a new service discovery economy embedded into agentic workflow UX we're already using. Instead of requiring users to have advance knowledge of what MCP servers they might want their coding agent to have access to, now their agents can recommend highly relevant services with a one-click installation experience. Attend this session to learn the specifics of how this mechanism works, its limitations, and what's next. In practice, the primary operational challenge stems from this breakdown: You're going to do a whole lot of copy pasting or they're of limited usefulness. The problem that I'm posing is that it's a very manual unstandardized process.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: It's also true in enterprises where the main difference is just instead of a Google search you're doing some internal search you're searching on Slack, you're searching on Notion, how do I get this server to work in our in our internal systems. The people building the MCP servers now have to, figure out how to get in front of you to engage in that very friction-full process. A lot of enterprise IT teams right now are vetting each server, server by server, even version by version depending on on on your enterprise.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Tadas Antanavicius.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1266465", "title": "Patterns for Shifting from MCP as a Basic API to MCP as Agent Integration Interface", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "3ZagKglGbkk", "recording_link": "https://www.youtube.com/watch?v=3ZagKglGbkk", "company": "AWS, ExoQuery", "speaker": "James Ward, Alexander Ioffe", "word_count": 3969, "has_transcript": true, "premise": "The naive approach to MCP servers is to provide basic APIs to Agents. This approach \u201cworks\u201d but we can go much further with MCP as an Agent Integration Interface that enables richer and more fluid experiences. For example, a common approach to understanding how users interact with web applications is to model the concept of a user session so that observability platforms can correlate all user interactions in a given session. MCP doesn\u2019t have a built-in way to correlate interactions across a given multi-turn prompt or longer running session. But we can enhance MCP servers with correlation IDs to provide exactly these kinds of insights. This session will dive into a number of patterns that enhance MCP to provide insights and more robust Agent Integration Interfaces. We will cover how to add correlation ids to MCP tool calls, automatic tool folding to reduce sequential tool calls, coercing an agent to support long-running task polling (for clients that don\u2019t yet support MCP Tasks), and managed live server updates that don\u2019t break connected users. These patterns will help attendees address real production challenges that impact users and operational capabilities. In practice, the primary operational challenge stems from this breakdown: By the way, even if you had unlimited token windows, there are all sorts of nasty little limitations about, oh if your descriptions are more than 95k bytes, they will become truncated.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Your user could start entering schema information that's wrong and then based on that they get something wrong and based on that they make a wrong assumption and the whole thing cascades and this applies to any MCP tool in any business domain. But the important part is to separate out once things start getting large, separate out the when the tool should be called from the how to use the tool. We can do this by being able to provide a tool that is the manual, the user manual for the tools, for the other tools.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by James Ward, Alexander Ioffe.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1364849", "title": "Post-Training Is Back", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "ff5o3F_SKO0", "recording_link": "https://www.youtube.com/watch?v=ff5o3F_SKO0", "company": "Nvidia", "speaker": "Ariel Shulman", "word_count": 3808, "has_transcript": true, "premise": "For the last two years the default answer to \"my agent gets this wrong\" has been a better prompt, a bigger model or an LLM judge in the loop. Fine-tuning felt like something only labs did. We think that's changing, and the reason is ground truth. Here is how in under $500 using a single 8xH100 Node and open weights model *REDACTED* running LoRA-SFT we were able to run at 30x less the cost of using a frontier model with similar results. In practice, the primary operational challenge stems from this breakdown: I've been in the data space for a quite a few years and I've seen many different attempts to try and solve this one problem. Here we are trying to understand what is Northwind's credit rating and we're going on HubSpot and it returns us null and then the agent just deduces null to be an answer and it says that it's unrated low risk.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: In order for an agent to answer the question, \"How's Dana's pipeline doing? Here in the evaluation, the we asked the model what was Northwind's monthly recurring revenue and it correctly said 12K but with zero tool calls. Era is a company simulator that's designed for benchmarking, training, and testing agents.", "takeaways": "\u2022 **Operational Discipline:** It's free for builders and it basically what it Era basically does is that it generates realistic high-volume data across cloud and SaaS systems served exactly the way that it is in production.\n\u2022 **Production Finding:** It exposes vendor compatible APIs and MCP servers that represent exactly how you would query them in production.\n\u2022 **Failure Mode Mitigation:** Agents query Era exactly the same way that they would query production with real requests and real quantities and pagination and errors.\n\u2022 **Deployment Rule:** Not only that it tells this one story, what the way you remember Dana, the account executive?"}, {"session_id": "1256895", "title": "Why Your Agent Is Failing: Failure Modes from 6,000+ Agent Trajectories", "category": "Observability & Evaluations", "topic": "Evals & Testing", "type": "Breakout", "video_id": "", "recording_link": "", "company": "Amazon", "speaker": "Han Xu", "word_count": 0, "has_transcript": false, "premise": "AI agents have advanced fast, yet they still fail on real-world, long-horizon tasks. The hard question is why: the model, its tool use, the harness, or the task itself? To find out, we audited 6,000+ failed trajectories using both human labels and LLM judges, across 45 benchmarks spanning software engineering, reasoning, science, agentic tasks, data analytics, and multimodality. First, harnesses shape failure modes. Third, many tasks agents struggle with are not hard but broken, with environment bugs or grading where even correct solutions fail. This session gives developers, researchers, and engineers a practical framework for diagnosing agent failures and improving agent evaluation pipelines.", "technical_depth": "The technical architecture presented by Han Xu (Amazon) establishes concrete mechanisms to resolve these failure modes: The top five categories account for 89% of errors, and the largest (endless loops and timeouts) accounts for 32%. Harness design can help agents verify and recover, or push them into loops and early stopping. Model capability has the largest effect, but harness choice still matters: a simple general-purpose harness can outperform a model-specific one, showing the need for agent-harness co-design.", "takeaways": "\u2022 **Continuous Evaluation:** This session gives developers, researchers, and engineers a practical framework for diagnosing agent failures and improving agent evaluation pipelines.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Evals & Testing workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1368122", "title": "x401: HTTP Proof Requirement Protocol", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Breakout", "video_id": "fo-QeBhyLDA", "recording_link": "https://www.youtube.com/watch?v=fo-QeBhyLDA", "company": "Proof", "speaker": "Ian Macallister", "word_count": 5109, "has_transcript": true, "premise": "Ian Macallister is EVP of Strategy and Business Development at Proof, the company behind x401, the open HTTP protocol that lets any website ask an AI agent to prove who it\u2019s acting for before it acts. x401 shipped to production this month with contributors from OpenAI, Visa, Okta, Circle, Lightspark, and MATTR. Proof, the company that creates legal identities to secure high assurance transactions on the internet, recently launched the ability to enable x401 natively through Cloudflare and their partnership with Circle. He\u2019s here to show you how the handshake works and how to put it in front of your own endpoints. In practice, the primary operational challenge stems from this breakdown: Every bank is realizing that this is, vulnerability, so they're just trying The ones that they can identify, they're shutting down. We not only issue identities for people, we issue identities for businesses.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: But effectively what it's doing is it's respond the website when they implement it so Superfluid now or other clients of Circle, they're responding with who is the person behind it? Google I said was a co-author of this of this protocol. It's I said it's in Cloudflare so you can turn on if you're a Cloudflare user or any of your clients are using Cloudflare.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Ian Macallister.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1357492", "title": "Demo Theater: Where Did All Your Tokens Go?", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "PointFive", "speaker": "Kevin Rhine", "word_count": 0, "has_transcript": false, "premise": "The days of tokenmaxxing are over. The days of tokenmaxxing are over.", "technical_depth": "The technical architecture presented by Kevin Rhine (PointFive) establishes concrete mechanisms to resolve these failure modes: Join Kevin from PointFive to see how TokenShift helps organizations attribute how developers are truly spending their tokens, apply controls to govern usage, and even optimize activity to improve AI efficiency.", "takeaways": "\u2022 **Production Strategy:** Join Kevin from PointFive to see how TokenShift helps organizations attribute how developers are truly spending their tokens, apply controls to govern usage, and even optimize activity to improve AI efficiency.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1360591", "title": "Demo Theater: Building Plugins for Claude", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Anthropic", "speaker": "Tobin South", "word_count": 0, "has_transcript": false, "premise": "A live walkthrough of how to build, submit and improve plugins for Claude users. A live walkthrough of how to build, submit and improve plugins for Claude users.", "technical_depth": "The technical architecture presented by Tobin South (Anthropic) establishes concrete mechanisms to resolve these failure modes: A live walkthrough of how to build, submit and improve plugins for Claude users. See how to package skills, connectors and commands into a plugin, get it listed in the Claude directory, and best practices for keeping it up to date.", "takeaways": "\u2022 **Production Strategy:** See how to package skills, connectors and commands into a plugin, get it listed in the Claude directory, and best practices for keeping it up to date.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1353069", "title": "Breaking the Governance Bottleneck: Why Scaling Control Gets Agents to Production Faster", "category": "Security & Governance", "topic": "Building Reliable Agent Systems", "type": "Sponsored Session", "video_id": "CrucZZk25n8", "recording_link": "https://www.youtube.com/watch?v=CrucZZk25n8", "company": "WSO2", "speaker": "Rania Khalaf", "word_count": 4379, "has_transcript": true, "premise": "Teams move fast to ship an agent pilot, then crash into company policy the moment it needs real access. It works in a sandbox. It stalls the moment it needs an MCP server, a real credential, or a scope wider than a demo account. Governance hasn't kept pace, and shipping on top of that gap isn't speed, it's debt that comes due in production. This talk makes the case for an agent control plane: guardrails, agent identity, MCP authorization, and access, built to catch up. Control only holds up if it works across any model, framework, or deployment - both for the agent estate you have today and the one you'll have in a year. We'll cover what agent control needs the moment something breaks: live identity, real-time enforcement, an audit trail that survives the incident, and the ability to isolate one agent without disrupting others. Takeaways: \u2022 How controls accelerate agent production, not block it \u2022 Why real control has to travel with the agent, not bolted to the stack when it was built \u2022 How framework-agnostic governance at the org level eliminates silos and future-proofs your agents ********************* _In order to facilitate networking and business relationships at the event, you may choose to visit a third party\u2019s booth or access sponsored content. You are never required to visit third party booths or to access sponsored content. When visiting a booth or participating in sponsored activities, the third party will receive some of your registration data. This data includes your first name, last name, title, company, address, email, standard demographics questions (i.e. job function, industry), and details about the sponsored content or resources you interacted with. If you choose to interact with a booth or access sponsored content, you are explicitly consenting to receipt and use of such data by the third-party recipients, which will be subject to their own privacy policies._ In practice, the primary operational challenge stems from this breakdown: One of the main challenges, we know how to do deterministic software. But, the challenge with the AI agents is exactly what makes them powerful is what makes them hard to govern.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: They're going to pick the tool, what goes in it, and what to call. When MCP launched, there was all these discussions about authentication and MCP auth and permissions. Now your governance becomes a runtime property of the architecture, not so much something that you're going to test in advance before you deploy and put something out.", "takeaways": "\u2022 **Operational Discipline:** They can be LLM as a judge or rule-based and they can be at the trace level or at the agent of the whole agent level.\n\u2022 **Production Finding:** The one interesting thing we learned is we had this monitor that was about the path, tells you if your agent is trashing, and it kept triggering for this robot even the robot wasn't doing anything wrong."}, {"session_id": "1258038", "title": "From AI Assistants to Trusted SDLC Agents: FINRA\u2019s Agentic Engineering Journey", "category": "Enterprise & Production", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "xaFnnKq3xxE", "recording_link": "https://www.youtube.com/watch?v=xaFnnKq3xxE", "company": "FINRA", "speaker": "Geetha Ramachandran", "word_count": 4010, "has_transcript": true, "premise": "At FINRA, the move from AI assistants to agentic engineering required more than better prompts. It required custom agents with bounded responsibilities, MCP-based integration into enterprise SDLC tooling, and design patterns that keep humans in control while agents reduce repetitive engineering work. This session shares how FINRA is building practical agentic workflows: guarded tool access, explicit context, observability, reusable skills, and MCP integration across repositories, CI/CD, and workflow systems. It will also discuss how an Agent Skills campaign, skills catalog, and enablement model helped turn experimentation into shared capability rather than one-off solutions. Using SDLC use cases such as technology upgrades as examples, this talk will show what it takes to move from IDE-centric assistance to trusted, context-aware agents that are composable, observable, reusable, and fit for enterprise software delivery.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Then we built a core foundational infrastructure layer to support for agent development so that we can give agents access to our approved the in our environment and an actual infrastructure with the right set of controls to run these agents. Then we also built purpose-driven SDLC agents that are specific to the work we are doing in our environment. Then came along the chat interface, a chat GPT-style interface within your editor.", "takeaways": "\u2022 **Operational Discipline:** Then at the end, it produces a pull request and a summary of changes for a human user to verify.\n\u2022 **Production Finding:** This is very important for our context because some of you might still think, \" do we still need code reviews?\" but this is very important for our context because of the regulatory nature of our technology systems.\n\u2022 **Failure Mode Mitigation:** People had 24 hours to get the tools set up, to understand what the tools did, but most importantly, they had a goal of using the tool to solve a specific business problem within that 24-hour period, to produce a working prototype.\n\u2022 **Deployment Rule:** The winning prototype had a ticket to get built for production."}, {"session_id": "1268911", "title": "MCP Apps + WebMCP - The Next Era of Interface", "category": "Protocols & Standards", "topic": "Human-Agent Collaboration", "type": "Panel", "video_id": "eruWepO0gD0", "recording_link": "https://www.youtube.com/watch?v=eruWepO0gD0", "company": "MCP Apps, Google, Anthropic", "speaker": "Liad Yosef, Dominic Farolino, Sarah Drasner, Olivier Chafik", "word_count": 5454, "has_transcript": true, "premise": "WebMCP is a way for an agent to interact with your website / UI. MCP Apps are a way for a server to return UI to be displayed in the agent - for visualization, branding and the \u201clast mile of interaction\u201d. These two technologies sit on both sides of the agentic-UI spectrum, and combining them completes the full cycle of human-agentic interactions. By combining WebMCP with MCP Apps, you can expose your capabilities directly to an agent that rides alongside the user. This also allows the agent to use WebMCP to control an MCP Apps UI. Walk away from this session with the ability to use WebMCP to let an agent drive your existing website, learn how to expose specific site functions (like \"Compare Pricing\") that the agent can render as an interactive, on-the-fly widget inside a chat sidecar with MCP Apps and build flows where the user handles the visual interaction, and the agent handles the heavy lifting. Understand the use cases and best practices for WebMCP and MCP Apps, and see how combining them usher in the new era of interfaces. In practice, the primary operational challenge stems from this breakdown: So, we had this problem, and Olivier generated generously donated his time to create the first solution to this in the MCP apps world.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: WebMCP is basically a way for you to provide MCP- tools, but for the user interface of your web app. It's all starts at the top here with this register tool concept, and that allows you to provide all the information about a tool. You can provide a name and a description and an input schema, and then finally an execution function.", "takeaways": "\u2022 **Operational Discipline:** There's lots of actionable feedback in the dev tools panel in Chrome as well about, what we know to be best practices for tools and, strongly nudging developers in a different direction if we can see them veering from that.\n\u2022 **Production Finding:** Are there any resources on what should be the future best practices for those because I think we should probably rethink the way we're doing that now."}, {"session_id": "1252925", "title": "Self-Hosting Agents: What Changes When Models Become Infrastructure", "category": "Developer Tools & Frameworks", "topic": "Open Source Tools", "type": "Breakout", "video_id": "3Hl3Sper-jA", "recording_link": "https://www.youtube.com/watch?v=3Hl3Sper-jA", "company": "SchoolAI", "speaker": "Miriah Peterson", "word_count": 4163, "has_transcript": true, "premise": "Running open models locally changes how engineers think about agent systems. Once models move from hosted APIs into self-managed infrastructure, problems that were previously hidden behind providers become operational realities: latency, orchestration, throughput, observability, GPU memory, tool-call reliability, evaluation variance, and cost control. This talk shares lessons learned building and operating self-hosted agent systems with llama.cpp, vLLM, quantized models, local coding agents, and production-like homelab infrastructure. Using examples from Pedro CLI, multi-model serving, evaluation workflows, and distributed inference experiments, we will look at what changes when the model is no longer an API call but part of the platform. Rather than focusing on benchmarks or hype, this session focuses on the operational work required to make open models useful in agent workflows: routing, retries, context management, observability, quantization tradeoffs, and failure recovery. Attendees will leave with a practical model for deciding when self-hosting makes sense, what infrastructure problems to expect, and how to design open agent systems that are reliable enough to operate. In practice, the primary operational challenge stems from this breakdown: Something you should know is great way to start keeping your cost down would be using open weight models. Nobody has tested the limits of what small dense models can do.\" And I can tell you they are just as good, if not better, at tool calls than large dense models.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Another thing you need to be aware of, specially when you're doing tests, are the kinds of models you can do. Nobody has tested the limits of what small dense models can do.\" And I can tell you they are just as good, if not better, at tool calls than large dense models. This is a huge part of the infrastructure that we tend to overlook cuz we are so used to pre-built harnesses, our Claude codes, our Claude desktops, open claws.", "takeaways": "\u2022 **Operational Discipline:** It sorts them and says, \"Maria, based on your goals of getting people to know that you have a startup and they want to buy your product, recommend me conferences to apply to.\" And it posts it on Discord."}, {"session_id": "1252063", "title": "Stop Agents From Leaking Your Secrets - AI Hooks To The Rescue", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "HIVVDNNb_24", "recording_link": "https://www.youtube.com/watch?v=HIVVDNNb_24", "company": "GitGuardian", "speaker": "Dwayne McDaniel", "word_count": 4594, "has_transcript": true, "premise": "Git gives us a way to automate just about anything. With Git hooks and off-the-shelf security tools, developers have been able to weave all sorts of checks into their Git rituals, 'shifting left' in order to eliminate security rework later. But Git was made for humans, and only the commit was meant to be shared. Today, coding assistants like Cursor, Claude Code, and Copilot can read files, propose changes, run commands, and interact with project context, often across a messy workspace. In an agentic workflow, secrets leak through context, output, and history. Fortunately, these tools have started supporting AI hooks, which allow you to move your testing closer to when the code and development artifacts are produced. Come to this session if you want to learn: - How hooks provide a practical pattern for catching mistakes before they leave a developer\u2019s machine. - Why AI coding tools like Cursor, Claude, and Copilot need guardrails beyond prompts and trust. - How to use AI hooks, rules, and automated checks before agents edit files, run commands, or touch sensitive systems. - How teams can reduce risk, improve consistency, and make safer contribution paths the default.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: When we look at architecture, that's where we can start putting things guardrails in place. I think there are two paths on the deterministic route, hooks and sandboxes. I would love to talk about behavioral patterns, but anything where you're putting a this if-then rule in place is either going to be based on ingress and egress and that's what sandboxing gives us.", "takeaways": "\u2022 **Operational Discipline:** I don't think that's that important of a thing to learn here.\n\u2022 **Production Finding:** AI is driving what we're building and making it so we're leaking keys faster for systems that we've never touched before because there's no pre-written rules about don't do this for this system."}, {"session_id": "1231023", "title": "When Agents Spawn Agents: Securing Recursive Delegation in Multi-Agent Systems", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Breakout", "video_id": "mqz8iS4NrNw", "recording_link": "https://www.youtube.com/watch?v=mqz8iS4NrNw", "company": "EmpowerID", "speaker": "Anishma Mavuram", "word_count": 3745, "has_transcript": true, "premise": "Enterprise agentic systems are moving from single assistants to agent chains: Agent A spawns B, B delegates to C, and C invokes an MCP tool that writes to a system of record. The unit of risk is no longer just the tool call \u2014 it is the delegation edge. The key question: is each descendant operating within a valid, revocable, least-privilege authority chain tracing back to a consenting human or root principal? Without that zero-trust chain, teams face confused-deputy attacks, delegation laundering, privilege creep, forged lineage, and audit trails that cannot prove who authorized what. This session presents RDCP \u2014 the Recursive Delegation Capability Profile \u2014 a standards-first pattern for securing recursive delegation. RDCP composes identity, authorization, policy, revocation, and evidence standards into a practical control-plane architecture. We will show cryptographic identity, signed spawn intent, grant-before-token issuance, OAuth Token Exchange/RAR, DPoP or mTLS child tokens, monotonic least-privilege attenuation, AuthZEN PDP decisions, MCP Gateway enforcement, subtree revocation, and tamper-evident receipts linking spawn \u2192 delegation \u2192 token issuance \u2192 tool call \u2192 outcome. In practice, the primary operational challenge stems from this breakdown: If zero trust is not maintained, what problems do we get? Today's talk is about what are the failures if you do not maintain the zero trust, and then what are the different solution patterns, and what are still the open problems in the space.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: That's why if you see it is you have to link the spawn to a grant to token and then to the tool call and to the final outcome. I will talk more about what this grant is and how does it align or correlate with the token. And the tool server just simply checks the access token, and it the access token has the scope, so the tool would get executed,", "takeaways": "\u2022 **Operational Discipline:** More importantly, there is no LLM in the security path."}, {"session_id": "1256671", "title": "Why the Heck Aren't Any Agents Supporting MCP Tasks?", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "4v-tltNKHPA", "recording_link": "https://www.youtube.com/watch?v=4v-tltNKHPA", "company": "Temporal", "speaker": "Cornelia Davis", "word_count": 4370, "has_transcript": true, "premise": "The November 2025 MCP spec release introduced tasks, a way to make tool calls async. But more than 7 months later (an eternity in AI-time) there are still NO clients that support it - not Claude, not Codex, not even goose! I believe there are two reasons: Designing the client experience when there are potentially 1000s of background tasks running on their own schedule and engaging humans at unpredictable times is a challenge. But even moreso, tasks place new infrastructure requirements on the client side (not just the server side). Spoiler: the first version of the MCP tasks protocol put a durability requirement on the server. The July 2026 release puts a durability requirement on the client. This talk digs into all of those concerns through real implementations. We will derive the architectural elements that are needed on the client side (and a reminder of what is needed server side) and provide a reference implementation. You\u2019ll come away with concrete practices for building robust, async MCP clients and servers, and a clearer mental model of the distributed systems issues the spec encodes.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: That invoice payment is the thing that I'm implementing as an MCP server. In fact, this is what I've implemented for my MCP server on that's happening asynchronously. The whole point with MCP tasks is that you can do this asynchronously.", "takeaways": "\u2022 **Operational Discipline:** It was so bizarre because the whole that whole protocol of let me get the results when I'm done, that was tunneled over a I think a get call if I remember correctly.\n\u2022 **Production Finding:** But here's the important thing, is that notice that in V1, we had a tasks list.\n\u2022 **Failure Mode Mitigation:** What you can see is and remember the task tracker is the MCP task invocation.\n\u2022 **Deployment Rule:** The thing that I want to point out here is that remember that picture that I showed you that the sequence diagram and I put a couple of red things?"}, {"session_id": "1362395", "title": "TC x WG x Maintainer Lunch", "category": "Protocols & Standards", "topic": "Breaks / Meals / Special Events", "type": "Breakout", "video_id": "", "recording_link": "", "company": "N/A", "speaker": "N/A", "word_count": 0, "has_transcript": false, "premise": "Join us for an informal lunch gathering, open to AAIF technical committee members, working group participants, and maintainers of all member projects, new and established.", "technical_depth": "The technical architecture presented by N/A (N/A) establishes concrete mechanisms to resolve these failure modes: There are no talks or slides, just a chance to meet in person after months of working together online. Technical Committee Members, Working Group Members, and Maintainers", "takeaways": "\u2022 **Production Strategy:** Technical Committee Members, Working Group Members, and Maintainers\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Breaks / Meals / Special Events workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1304136", "title": "Demo Theater: Govern the Full AI Data Path with Kong AI Gateway", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Kong", "speaker": "Deirdre Anderson", "word_count": 0, "has_transcript": false, "premise": "See how Kong's unified API and AI platform takes agents from experiment to production: governing a real multi-agent system with A2A communication, MCP tool calls, and multi-provider LLM routing, all with end-to-end observability across the full data path.", "technical_depth": "The technical architecture presented by Deirdre Anderson (Kong) establishes concrete mechanisms to resolve these failure modes: See how Kong's unified API and AI platform takes agents from experiment to production: governing a real multi-agent system with A2A communication, MCP tool calls, and multi-provider LLM routing, all with end-to-end observability across the full data path.", "takeaways": "\u2022 **Protocol Specification:** See how Kong's unified API and AI platform takes agents from experiment to production: governing a real multi-agent system with A2A communication, MCP tool calls, and multi-provider LLM routing, all with end-to-end observability across the full data path.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1304137", "title": "Demo Theater: Chaos Engineered: How to Build Invincible Agents and MCP Systems", "category": "Protocols & Standards", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Temporal", "speaker": "W. Ian Douglas, Melissa Herrera", "word_count": 0, "has_transcript": false, "premise": "You'll still get your result, just slower, and at a higher cost. You'll join in the fun to become the chaos that breaks our demo. You'll walk away knowing how durable execution works in both agent code and MCP server code, how retries and replays prevent unnecessary rework and token spend when services fail and recover.", "technical_depth": "The technical architecture presented by W. Ian Douglas, Melissa Herrera (Temporal) establishes concrete mechanisms to resolve these failure modes: What happens when your AI agent or MCP server goes down mid-task? Re-running tool calls, re-spending tokens, even for work that already finished. In this live demo, we'll show what changes with Durable Execution. We'll watch the full execution path (Agent, MCP server, APIs and storage) while Temporal keeps resuming from where things left off, not starting over. Come see how \"what if this other system goes down?\" stops being a question you need to build custom handling for within your code.", "takeaways": "\u2022 **Production Strategy:** Come see how \"what if this other system goes down?\" stops being a question you need to build custom handling for within your code.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1342390", "title": "Prompt \u00e0 la Carte", "category": "Protocols & Standards", "topic": "Breaks / Meals / Special Events", "type": "Breakout", "video_id": "", "recording_link": "", "company": "N/A", "speaker": "N/A", "word_count": 0, "has_transcript": false, "premise": "Grab your lunch in the Sponsor Showcase, then join us for impromptu topic discussions during lunch!", "technical_depth": "The technical architecture presented by N/A (N/A) establishes concrete mechanisms to resolve these failure modes: Grab your lunch in the Sponsor Showcase, then join us for impromptu topic discussions during lunch! Whether you are looking to share your insights, hear diverse perspecti
