API Keys, OAuth tokens, or secret credentials?\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1252966", "title": "Bridging Agentic Reasoning and Deterministic Execution", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "UZsgAXhuc6Y", "recording_link": "https://www.youtube.com/watch?v=UZsgAXhuc6Y", "company": "ComparaCAR", "speaker": "Marcio Klepacz", "word_count": 3610, "has_transcript": true, "premise": "Agentic systems are great at reasoning through ambiguity, choosing tools, using skills, and adapting to context. But production workflows need deterministic execution, retries, auditability, observability, and operational control. This talk explores how MCP and agent skills can connect to DAG-based orchestrators. Instead of letting agents repeatedly decide and execute the same fixed sequence of tool calls, we can use them to author deterministic workflows that are reusable, inspectable, parameterized, and replayable. The session will cover practical patterns for MCP-connected workflows, including agent-authored DAGs, reusable task templates, runtime parameters, conditional execution, and human-in-the-loop control. The goal is to show how agents can reason where flexibility is needed, while deterministic workflows execute what needs to be reliable. In practice, the primary operational challenge stems from this breakdown: I'm sure that if Lint or Py or Pytest fails, is going to stop there and it's not going to go further and build.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: The orchestrator is going to give you the graph of the steps and you can just come here and press trigger and you see it's going to run. Both of lint and tasks were trigger at the same time and then once done, all good, you can come here, inspect, make sure everything went and cool. It will inspect logs, results in case of failures, and also to validate if this is what we're expecting.", "takeaways": "\u2022 **Operational Discipline:** We also have runtime secrets, which is very important.\n\u2022 **Production Finding:** It's this also very important and very useful.\n\u2022 **Failure Mode Mitigation:** I think it's important for you to think about how going to use LLMs to write the deterministic things."}, {"session_id": "1363941", "title": "Building Buzz inside Buzz: How Engineering, Design, and Agents Ship Together", "category": "Developer Tools & Frameworks", "topic": "Human-Agent Collaboration", "type": "Sponsored Session", "video_id": "ZnNeO4_dt28", "recording_link": "https://www.youtube.com/watch?v=ZnNeO4_dt28", "company": "Block", "speaker": "Will Pfleger, Taylor Ho", "word_count": 4670, "has_transcript": true, "premise": "Buzz is an open source workspace, built on an open protocol, where people and AI agents work in the same channels. Will (engineering) and Taylor (design) will show how they built Buzz inside Buzz, using a real feature as an example. They'll walk through what the software development lifecycle looks like when architecture debates, design decisions, reviews, and agent work all happen in one shared place, and how that shared context lets engineering and design hand work back and forth without losing the reasoning behind it. *************** _In order to facilitate networking and business relationships at the event, you may choose to visit a third party\u2019s booth or access sponsored content. You are never required to visit third party booths or to access sponsored content. When visiting a booth or participating in sponsored activities, the third party will receive some of your registration data. This data includes your first name, last name, title, company, address, email, standard demographics questions (i.e. job function, industry), and details about the sponsored content or resources you interacted with. If you choose to interact with a booth or access sponsored content, you are explicitly consenting to receipt and use of such data by the third-party recipients, which will be subject to their own privacy policies._", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: You can always see a record of what decision was made, who made the decision, why it was made, why something was built a certain way. We want to let anybody bring their harness and then, once we get this built out, we'll we'll hand off to the to the design team. So, a day or two later, we had a first working engineering pass at this feature.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Will Pfleger, Taylor Ho.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1258016", "title": "Don't Merge That: An Agentic Approach to Catching Outages at 10,000 PRs a Week", "category": "Developer Tools & Frameworks", "topic": "Building Reliable Agent Systems", "type": "Breakout", "video_id": "qgA9xm4GuS4", "recording_link": "https://www.youtube.com/watch?v=qgA9xm4GuS4", "company": "Datadog", "speaker": "Joris Bonnefoy", "word_count": 4672, "has_transcript": true, "premise": "At Datadog, engineers ship over 10,000 pull requests per week. At that scale, human code review cannot catch every latent failure\u2014such as missing network timeouts that trigger cascading outages, cold-cache thundering herds, or silent behavioral API drift that breaks downstream callers simultaneously.", "technical_depth": "Datadog built an automated, agentic reliability reviewer integrated directly into their PR pipeline:\n1. Multi-Stage Risk Scoring: Computes an initial risk score based on blast radius, past incident hot-spots, and dependency graphs to trigger agent reviews only on high-risk diffs.\n2. Tool-Augmented LLM Agents: Agents run fine-tuned models equipped with AST analysis, git blame archaeology, and dependency mapping tools to inspect call graphs.\n3. Multi-Turn Reflection Loops: The agent generates an initial reliability critique, reflects on whether the finding is a false positive or style nit, and discards low-signal comments before posting.", "takeaways": "\u2022 **Reflection Loops Eliminate False Positives:** Unchecked LLM reviewers inundate engineers with pedantic style nits; adding multi-turn reflection loops measurably boosts high-severity outage-catching accuracy.\n\u2022 **Codify Outage Patterns into Packs:** Every post-mortem outage at Datadog is codified into a structured rule pack that the reviewer agent checks across all subsequent PRs.\n\u2022 **Audit External Agents:** Teams must continuously monitor third-party and pre-commit coding agents to ensure their generated code adheres to organizational reliability standards."}, {"session_id": "1228291", "title": "Evolution, not Revolution: How MCP is Reshaping OAuth", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "eSPm7I2bm1M", "recording_link": "https://www.youtube.com/watch?v=eSPm7I2bm1M", "company": "Okta", "speaker": "Aaron Parecki", "word_count": 4344, "has_transcript": true, "premise": "The impulse to rewrite the auth stack for AI agents is strong, but we cannot design away the fundamental relationships standards protect. This session explores how MCP is reshaping OAuth\u2014not abandoning it\u2014to meet the ecosystem's unique challenges: The \"Unregistered Client\" Problem: Traditional OAuth requires pre-registration. MCP breaks this. We\u2019ll see how Client ID Metadata Documents (CIMD) allow agents to bring their own identities to arbitrary servers, how it improves on Dynamic Client Registration, and how to mitigate the risks of unregistered clients. Separation of Concerns: Why your MCP server shouldn't be your Authorization Server. We\u2019ll cover how Protected Resource Metadata (RFC 9728) enables dynamic auth server discovery, keeping agents lightweight and security boundaries clean. Enterprise-Managed Authorization: To stop \"click-through fatigue,\" we\u2019ll introduce the Identity Assertion Authorization Grant. This moves consent to the enterprise policy layer, enabling secure, scalable adoption. Join me to secure the agent ecosystem\u2014from discovery to governance\u2014not by reinventing the wheel, but by making incremental improvements to the way it turns.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: The good news is we already have a solution for this. We need some technical solution to allow users to share the data they want to share with these tools while preventing access to things that those tools don't need. But the good news is we have a pattern to follow here.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Aaron Parecki.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1294029", "title": "From Agent to Infrastructure: The Goose Development Kit", "category": "Developer Tools & Frameworks", "topic": "Open Source Tools", "type": "Breakout", "video_id": "ISFzl170ocs", "recording_link": "https://www.youtube.com/watch?v=ISFzl170ocs", "company": "Block", "speaker": "Steve Lee", "word_count": 4716, "has_transcript": true, "premise": "Goose began as an open-source, local-first AI agent built to perform real work\u2014not merely answer questions. As teams inside and outside Block adapted Goose for increasingly diverse products and workflows, a more foundational opportunity emerged: separate the reusable agent runtime from any single interface or application. The result is the Goose Development Kit, an open-source Rust SDK for building model-agnostic, locally runnable agentic applications, including the agent loop, tool calling, context management, provider integration, and support for open protocols such as MCP and ACP. This session traces GDK\u2019s evolution from the original Goose project and explains how GDK relates to the Goose Reference Client, including Goose Desktop and CLI. We\u2019ll provide a candid assessment of what is available today, what is still being extracted or standardized, and the roadmap toward stronger client-runtime separation, ACP interoperability, open plugin support, local and open models, orchestration, and easier embedding in custom applications. We\u2019ll also examine early adoption: Block\u2019s shared Goose substrate already supports internal automation and customer-facing agents, while Stripe adapted Goose to power its Minions coding system. Finally, we\u2019ll explore the likely next adopters\u2014from enterprise AI platform teams and IDE developers to vertical-software companies that want agent capabilities without surrendering control to a single model or proprietary platform. Attendees will leave understanding where GDK fits in the agent stack and when to build on it rather than creating another agent harness from scratch.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: We recognize that and thought that the most of the way we can deliver the most value is by deliv- delivering a platform an SDK that allows other people to build on top of that core engine and create a custom experience for their users and their use cases. That can range from a single developer looking to improve their development workflow with AI. That will continue to be a way that if you're building an application and you want to interface with Goose, you can do it through ACP.", "takeaways": "\u2022 **Operational Discipline:** But, you if this is going to grow, if there's a lot of demand for this, then it's very important to be able to pay people for the compute as well.\n\u2022 **Production Finding:** I guess another really important point too, who's going to supply compute?"}, {"session_id": "1258061", "title": "Gotta Catch 'Em All: Agent Skills", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "rWrQ0MddvA4", "recording_link": "https://www.youtube.com/watch?v=rWrQ0MddvA4", "company": "Entire", "speaker": "Lizzie Siegle", "word_count": 3083, "has_transcript": true, "premise": "Right now, developers are collecting Agent Skills like Pok\u00e9mon.There's skills for planning, testing, reviewing PRs, and searching through documentation. In this session, we'll break down what Agent Skills are, why they're becoming an important layer in agent workflows, and how they give agents repeatable capabilities they can carry across tasks. Then we'll put a few Skills into battle using Entire. You'll see how an agent can search past sessions, trace how a project evolved, uncover previous decisions, connect changes to commits, and rebuild the context behind the code without making you read every transcript yourself. In practice, the primary operational challenge stems from this breakdown: Agent agnostic sometimes you might run out of Codex tokens might need a reset, no problem. If the problem is code, reproduce it wherever possible, fix it, and rerun the check that failed.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: You can inspect what you told the agent instead of wondering whether it remembered an earlier conversation, an earlier chat. It still needs the current tasks, inputs, and the right tools, but the recurring instructions are still there. References hold details needed in specific certain situations.", "takeaways": "\u2022 **Operational Discipline:** It keeps the agent conversation connected to the code change so we can recover the reasoning behind that get-only rule.\n\u2022 **Production Finding:** Served as useful when you remember a topic but don't know where the relative relevant conversation is.\n\u2022 **Failure Mode Mitigation:** The important behavior is the get only retry, so I would check three cases.\n\u2022 **Deployment Rule:** Otherwise, you've packaged yesterday's advice very efficiently."}, {"session_id": "1291876", "title": "Stop Vibe-Testing: Run Real Agent Evals", "category": "Observability & Evaluations", "topic": "Evals & Testing", "type": "Breakout", "video_id": "", "recording_link": "", "company": "Arize AI", "speaker": "Laurie Voss", "word_count": 0, "has_transcript": false, "premise": "Most engineering teams deploy AI agents using 'vibe-testing'\u2014running a handful of manual test prompts, subjectively eyeballing the outputs, deciding it 'looks good,' and shipping to production. This approach catastrophically breaks down because autonomous agents are non-deterministic, multi-turn, and stateful. Vibes cannot catch silent regressions, cannot survive prompt refactoring, and provide zero statistical confidence on whether a new foundation model or updated system prompt actually improves production performance.", "technical_depth": "To replace subjective vibe-testing with empirical engineering, Laurie Voss (Arize AI) details a closed-loop evaluation architecture structured around five continuous operational stages:\n1. Instrument & Trace: Capture full distributed execution traces across the entire agent lifecycle\u2014recording intermediate reasoning steps, multi-turn tool calls, memory retrievals, and latency profiles (using open standards like OpenInference / OpenTelemetry).\n2. Evaluate: Run programmatic evaluation functions (LLM-as-a-judge, deterministic regex/JSON schema validators, and code execution checks) over individual trajectory spans rather than solely on the final turn output.\n3. Validate the Evaluator (Meta-Evaluation): Audit the evaluators themselves against labeled ground-truth datasets to eliminate judge bias, hallucinated scores, and metric noise.\n4. Iterate & Gate: Integrate benchmark scores into CI release pipelines to enforce quality thresholds before agent versions are deployed.", "takeaways": "\u2022 **Vibes Mask Regressions:** Subjective manual spot-checks create a false sense of security; prompt modifications or model upgrades inevitably introduce edge-case regressions that only structured datasets expose.\n\u2022 **Trace Spans, Not Just End Results:** Multi-step agent failures usually occur during early reasoning or intermediate tool calling; evaluation must instrument each trace span to pinpoint where execution derailed.\n\u2022 **Meta-Evaluate Your Judges:** LLM-as-a-judge evaluators can drift or hallucinate; teams must continuously validate evaluator accuracy against curated human-labeled benchmarks before trusting automated scoring.\n\u2022 **Close the Feedback Loop:** Evals are useless in a vacuum; production traces must feed back into a curated evaluation dataset to continuously stress-test subsequent agent releases."}, {"session_id": "1242744", "title": "Who Watches the On-Call Agent?", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "ovEpyYxKJPg", "recording_link": "https://www.youtube.com/watch?v=ovEpyYxKJPg", "company": "Meta", "speaker": "Neelakshi Soni", "word_count": 3935, "has_transcript": true, "premise": "Modern AI systems are no longer limited by models alone. They are increasingly constrained by infrastructure scalability, attribution pipelines, reliability, latency, and operational complexity. In this session, Neelakshi Soni shares lessons from building and scaling high throughput distributed systems at Meta and Amazon that process millions of requests per second. The talk covers real world engineering challenges in AI driven infrastructure, including attribution systems, config driven platform architectures, experimentation frameworks, performance optimization, and reliability engineering. Attendees will learn practical approaches for designing scalable backend systems, reducing operational overhead, improving developer velocity, and building production ready AI platforms that operate reliably at massive scale. This session is intended for backend engineers, infrastructure engineers, AI platform teams, and software engineers building production AI systems. In practice, the primary operational challenge stems from this breakdown: That's exa exactly the problem I want to talk about today. The biggest challenge is that you spend too much time gathering information from the different places before it even start figuring out what went wrong.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Why did it burn 400k tokens and why was the road course wrong and is the is it getting better or worse how many calls that particular model is making and how many times it is retrieving the information that is not relevant. The matrix tells us what is happening across the system. They can capture the tool results, errors, decisions and relevant context and traces connect the steps of one investigation.", "takeaways": "\u2022 **Operational Discipline:** But we also need to understand what it did, why it reached to that conclusion and whether that conclusion deserves our trust.\n\u2022 **Production Finding:** That's what makes an AI on call agent something we can operate responsibly in the production."}, {"session_id": "1345774", "title": "Workshop: Hands-on A2A: Service Discovery and Multi-Agent Delegation", "category": "Protocols & Standards", "topic": "Workshops", "type": "Workshop", "video_id": "E5r9PfAtw_I", "recording_link": "https://www.youtube.com/watch?v=E5r9PfAtw_I", "company": "Google", "speaker": "Pedro Melendez, Sergio Villani, Sirisha Karra", "word_count": 14055, "has_transcript": true, "premise": "This 75-minute interactive workshop provides a hands-on environment for engineers to explore agent-to-agent (A2A) protocols through practical execution rather than product pitches. Key takeaways and exercises include: - Building & Publishing Agent Cards: Attendees configure and publish agent cards to expose capabilities securely. - Dynamic Discovery & Delegation: Participants discover peer agents via card metadata and delegate complex tasks in real time without upfront schema agreements. - Handling Real-World Objections: The lab directly addresses common protocol objections through immersive scenarios. *Infrastructure & Approach:* - Environment: We will use GCP as our standard infrastructure for workshops, leveraging pre-deployed agents on Cloud Run within isolated attendee projects to minimize custom setup. - Protocol Focus: Emphasizes generic, open-source (OSS) solutions and vendor-neutral, protocol-level mechanics rather than specific product surfaces. *Space Limited - First Come, First Served. Please bring a fully charged laptop to the workshop* In practice, the primary operational challenge stems from this breakdown: There's going to be data privacy issues, isolated access, networking constraints, multiple things that your agent is not going to be able to access everything, When you have an agent with, let's say, a hundred different tools, you can hit the limit of the context of whatever model that you use very quickly.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: You can click on this lab and then you land on the Quick Labs interface. I'm calling awesome agent because it already has access to MCP tools. You could add more features to it, I don't know, more tools.", "takeaways": "\u2022 **Operational Discipline:** You meant You remember that I a couple of utilities that we created.\n\u2022 **Production Finding:** I would say my recommendation would be a lot of you don't have that error.\n\u2022 **Failure Mode Mitigation:** How the authentication works in this lab is if anybody noticed on the local JSON file for the MCP, there was a very insecure and completely not recommended approach to save the API key or the password that you have for this."}, {"session_id": "1363919", "title": "Demo Theater: OpenAI Shares How to Bring Your App into ChatGPT with Plugin Extensions", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "OpenAI", "speaker": "Ted Ramert", "word_count": 0, "has_transcript": false, "premise": "Bring your app\u2019s interactive features directly into ChatGPT. Bring your app\u2019s interactive features directly into ChatGPT.", "technical_depth": "The technical architecture presented by Ted Ramert (OpenAI) establishes concrete mechanisms to resolve these failure modes: See how plugin extensions power an interactive design workspace where users can browse designs, edit a canvas, and guide changes through conversation, selections, and annotations. We\u2019ll use MagicPath, a design startup that saw a 2,000% increase in new users after launching its ChatGPT plugin, as an example. See its interactive workspace in action, then learn what founder Pietro Schirano took away from the launch\u2014with practical lessons for building and growing your own ChatGPT plugin.", "takeaways": "\u2022 **Production Strategy:** See how plugin extensions power an interactive design workspace where users can browse designs, edit a canvas, and guide changes through conversation, selections, and annotations.\n\u2022 **Production Strategy:** See its interactive workspace in action, then learn what founder Pietro Schirano took away from the launch\u2014with practical lessons for building and growing your own ChatGPT plugin."}, {"session_id": "1333318", "title": "Demo Theater: Device Connect in Action: Bringing AI Agents to Real-World Devices", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Arm", "speaker": "Kavya Sri Chennoju", "word_count": 0, "has_transcript": false, "premise": "See Device Connect in action as an AI agent discovers and interacts with real-world devices.", "technical_depth": "The technical architecture presented by Kavya Sri Chennoju (Arm) establishes concrete mechanisms to resolve these failure modes: We\u2019ll demo the end-to-end flow live, showing how developers can connect agents to device capabilities and extend agentic experiences beyond the cloud and into the physical world.", "takeaways": "\u2022 **Production Strategy:** We\u2019ll demo the end-to-end flow live, showing how developers can connect agents to device capabilities and extend agentic experiences beyond the cloud and into the physical world.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1304152", "title": "Demo Theater: Don't Let the Agent Freelance Your API Calls", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Celigo", "speaker": "Tyler Lamparter", "word_count": 0, "has_transcript": false, "premise": "It has to handle partial failures. If you are building MCP servers by wrapping endpoints one at a time, this talk shows the problem with that approach and a way to fix it.", "technical_depth": "The technical architecture presented by Tyler Lamparter (Celigo) establishes concrete mechanisms to resolve these failure modes: If you expose your APIs as MCP tools one endpoint at a time, you leave it to the agent to run a multi-step business process on its own. This session shows a different way to build MCP tools. A composite tool wraps an entire multi-step process, including validation and rollback, into one action the agent calls once instead of five. A multi-step order fulfillment process becomes a single governed MCP tool, with every call tied to the real user making the request instead of a shared service account.", "takeaways": "\u2022 **Protocol Specification:** If you are building MCP servers by wrapping endpoints one at a time, this talk shows the problem with that approach and a way to fix it.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1256677", "title": "A2A v1 Deep Dive: The Specification, Extensions, and Custom Protocol Bindings", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Breakout", "video_id": "-jBG0cIMiuY", "recording_link": "https://www.youtube.com/watch?v=-jBG0cIMiuY", "company": "Cisco, Microsoft", "speaker": "Luca Muscariello, Darrel Miller", "word_count": 4074, "has_transcript": true, "premise": "A2A 1.0 is the first stable specification for agent-to-agent communication \u2014 tasks, agent cards, message parts, and a transport model designed for both cloud-native deployments and end devices. But the spec was designed to be extended, and understanding where core semantics end. This session walks through A2A v1 at a technical level: how tasks are structured, what agent cards encode and how they are published for federated discovery via AI Catalog, and how the protocol adapts its transport model across cloud-native deployments and end devices. The second half covers what's open: the extension mechanism that lets the ecosystem add capabilities without forking the spec, and custom protocol bindings that let you replace the default transport while preserving full A2A semantics. We walk through a concrete example \u2014 implementing a custom binding, registering an extension in an agent card, and verifying interoperability against the reference implementation. The session closes with a practical framework: when should a new capability be an extension, when a new binding, and when does it belong in the core spec?", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: You can get native support to MCP, but we built a skill and we built a CLI. I'm going to show you a little dashboard that we built so that you can see the interactions that are going on. Let's go and tell it specifically, don't use that model, just use Luna.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Luca Muscariello, Darrel Miller.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1348467", "title": "Building Agents with Decision Models", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "DilEiawSCjM", "recording_link": "https://www.youtube.com/watch?v=DilEiawSCjM", "company": "LangChain", "speaker": "Sydney Runkle", "word_count": 4359, "has_transcript": true, "premise": "LLMs are powerful but slow and expensive, yet most agent loops repeatedly invoke massive LLMs for trivial, deterministic decisions like tool routing, conditional branching, and guardrail checks.", "technical_depth": "Sydney Runkle (LangChain) introduces Decision Models (such as Jev from TypeSafe AI) into the agent harness:\n1. Fast Structured Choices: Instead of generating unstructured natural language tokens, decision models return calibrated probability distributions over fixed action sets in milliseconds.\n2. Hybrid Agent Architecture: Decision models handle high-frequency routing, tool pre-filtering, and guardrail classification, handing off to heavyweight LLMs only for open-ended synthesis.\n3. Real-Time Online Evals: Decision models score intermediate agent behavior in production without inflating latency budgets.", "takeaways": "\u2022 **10x Cost & Latency Reduction:** Offloading routing and tool selection from LLMs to decision models slashes token costs and eliminates execution lag.\n\u2022 **Deterministic Action Sets:** Decision models eliminate JSON schema parsing failures and syntax errors by returning direct probability tensors.\n\u2022 **Handoff Boundaries:** Establish clear heuristics for when structured decision models suffice vs. when open-ended generative LLM reasoning is required."}, {"session_id": "1257913", "title": "Configured for Autonomy: Making Enterprise Agents Useful and Safe at Scale", "category": "Enterprise & Production", "topic": "Enterprise Adoption in Practice", "type": "Breakout", "video_id": "Zozjsr2j1pM", "recording_link": "https://www.youtube.com/watch?v=Zozjsr2j1pM", "company": "OpenAI", "speaker": "Viyat Bhalodia, Casey Silver", "word_count": 5016, "has_transcript": true, "premise": "Enterprise coding agents are only useful if they can edit files, run code, install dependencies, and access the network. Giving them broad access creates risk, but asking users to approve every action creates fatigue and trains them to click \u201callow.\u201d We'll explore how enterprises can configure agents with enough authority to complete real work with profiles that define where an agent can write, which network destinations it can reach, and which actions are always prohibited. A secure sandbox enforces those org defined boundaries, while an LLM judge evaluates ambiguous actions and escalates only when human input is necessary. We will show how this works across common development tasks and how organizations can improve their configurations over time. Sandbox denials, judge decisions, task outcomes, and unnecessary prompts become a feedback cycle: proposed policy changes can be replayed against previous workflows, reviewed by administrators, and rolled out gradually. Attendees will leave with a practical model for increasing agent autonomy without granting unrestricted access or turning users into permission reviewers. In practice, the primary operational challenge stems from this breakdown: Either you provide the agent with its own credentials, or you use your own credentials and you give it to the agent, which is a little bit risky. We want the model to delegate the high-risk and the critical risk decisions back to you, saving your attention.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: On the right, when the model makes that request, our sandbox proxy checks two things. We talk about credentials, but when a model or an agent wants to run something in the sandbox, not all of your workflows are going to fit in that sandbox, In order to do useful work, it's going to prompt you for an approval to run it outside that sandbox.", "takeaways": "\u2022 **Operational Discipline:** So on the response side, what we think about is building a deterministic set of rules,\n\u2022 **Production Finding:** So a human reviewing that as well as building deterministic rules is just it just not feasible.\n\u2022 **Failure Mode Mitigation:** And then, humans being in the loop also a very important part, but human attention is very scarce.\n\u2022 **Deployment Rule:** It's really important that we use things an LLM reviewer to help filter down what humans are looking at."}, {"session_id": "1257529", "title": "Engineering Multiagent Systems", "category": "Multi-Agent & Orchestration", "topic": "Multi-Agent & Distributed Systems", "type": "Breakout", "video_id": "lnRUY44RNSw", "recording_link": "https://www.youtube.com/watch?v=lnRUY44RNSw", "company": "North Carolina State University", "speaker": "Munindar Singh", "word_count": 5305, "has_transcript": true, "premise": "MCP and A2A set the stage for building systems of agents that interact with each other and legacy information systems. Current multiagent systems in industry are limited to problem solving, where the agents are orchestrated to solve a problem for the same stakeholder (person or organization). Orchestration is over-constrained and inapplicable when agents represent different stakeholders. We need protocols such as the Universal Commerce Protocol (UCP). However, current methods (as used for specifying UCP) are rigid and lack a formal model. Thus, they prevent us from benefiting from the power of modern AI. This session will summarize years of peer-reviewed research on engineering multiagent systems. (1) How to specify interaction protocols to gain high flexibility with correctness guarantees. (2) How to program an agent to participate in a protocol, without being limited to message reactions. (3) How to represent and reason about the social or business meaning of an interaction (for business agreements and safety guardrails). The session will include examples, including a proper reconstruction of UCP, and brief demonstrations. The underlying code is open source. In practice, the primary operational challenge stems from this breakdown: The link on the top left doesn't work because the PHP attack my university shut down the website for now. From my base on the PhD, the field has changed quite a lot since then as you can imagine, but many of the old problems that we tackled then has are still not being addressed properly.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: The essence of it, which is still true today with current protocols, is that people build on finite state machines. In the finite state machine, here we start off with state S0 at the top left. This is a protocol that lays out an interaction It's an interaction protocol between customer and a merchant.", "takeaways": "\u2022 **Operational Discipline:** I the broader approach is that we want to combine this norm reasoning, the commitments part with the with the with and the commit norms could be, explicitly specified or just learned and they are, an arbitrary can reason about them.\n\u2022 **Production Finding:** In production, would you always want that would you want that to be a sub agent and essentially have an agent as the main gatekeeper that approves the purchasing decision?"}, {"session_id": "1235481", "title": "From DCR to CIMD: MCP Client Identity in Production", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "uJ_YscSjBXI", "recording_link": "https://www.youtube.com/watch?v=uJ_YscSjBXI", "company": "Runlayer", "speaker": "Alvaro Inckot", "word_count": 3887, "has_transcript": true, "premise": "MCP's authorization spec now points implementers to Client ID Metadata Documents (CIMD) as the preferred path when clients and servers have no prior relationship, with Dynamic Client Registration (DCR) as fallback. That shift changes how client identity is created, verified, rotated, cached, and audited. For server authors, gateway operators, and client platform teams running auth across many providers. We unpack the spec change, show how CIMD fits the OAuth handshake, and map the open production problems: redirect URI trust, SSRF hardening, metadata caching, key rotation, revocation, and tenant isolation. DCR creates operational pressure at scale: registration sprawl, stale records, tenant drift, unclear ownership. CIMD replaces much of that with stable HTTPS client identifiers backed by URL-resolved metadata. Grounded in running an MCP gateway, we walk through a migration matrix across DCR, pre-registration, and CIMD; a pattern for translating identity across heterogeneous servers; and an audit model preserving attribution from human to agent to tool to API. Attendees leave with a model of MCP client identity in 2026, a decision tree for registration, and a checklist. In practice, the primary operational challenge stems from this breakdown: Today I want to share some knowledge that we had implementing the CR first and the problems that we figured out techniques to mitigate issues and incidents that we faced. Along of the years since the implementation of the DCR we see a few MCP servers and providers having the same problem as I had this day.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: But MCP when MCP picked OAUTH this changed because again the protocol made everything agents wanting to access anything and bring this dynamic of things need to be discoverable and be easily pluggable. It's just not scalable to all the clients register to all the providers and make that work. Then the to solve that problem of the mutual registration the spec picked DCR to have these clients being registered on the fly.", "takeaways": "\u2022 **Operational Discipline:** You can just show, \" you are being redirect to cursor, the sing link, and you want to add that to the rules and then we create a special wildcard for that.\n\u2022 **Production Finding:** This is the I was talking about more the upstream so MCP clients but also for downstream or layer we support all the specs that are recommended.\n\u2022 **Failure Mode Mitigation:** But, even CMD and all its evolution that brings, it has a few a few open questions in productions that you have to take care about, especially for a gateway.\n\u2022 **Deployment Rule:** You could have some private network rules for addressing your apps for your client."}, {"session_id": "1257865", "title": "Generative UI at Scale with A2UI", "category": "Enterprise & Production", "topic": "Human-Agent Collaboration", "type": "Breakout", "video_id": "orJ26CU2zxg", "recording_link": "https://www.youtube.com/watch?v=orJ26CU2zxg", "company": "Google", "speaker": "Alan Blount, Vishal Motwani", "word_count": 4195, "has_transcript": true, "premise": "As AI agents reason, plan, and execute multi-step workflows, collapsing their rich outputs into a static 'wall of text' or standard markdown severely bottlenecks user interaction. Conversely, transmitting raw executable code (such as arbitrary HTML/JS) across network boundaries creates critical cross-site scripting (XSS) and code injection vulnerabilities. Generative UI (GenUI) solves this dilemma by allowing agents to orchestrate dynamic, interactive interfaces without transmitting vulnerable executable code.", "technical_depth": "Alan Blount and Vishal Motwani detail Google's open-source A2UI (Agent-to-User Interface) toolkit and runtime architecture:\n1. Declarative JSONL Streaming: Agents transmit lightweight, declarative JSONL configuration streams representing UI intent rather than executable logic.\n2. Client-Owned Component Catalogs: The frontend client (Web, Flutter, Android, iOS) maintains full authority over its native design system, brand styling, and allowed component schemas. The agent simply binds parameters to existing registered components.\n3. Parallel Decision APIs: In live flight-booking demonstrations, the agent makes up to 46 UI layout and field decisions in parallel using specialized decision models (Jev / Decisions API), eliminating multi-turn LLM generation latency.", "takeaways": "\u2022 **Declarative Schemas Over Raw Code:** Never transmit executable JavaScript or raw HTML across trust boundaries; stream declarative component configurations that the client renders safely.\n\u2022 **Client Retains Design Authority:** The client platform owns the component catalog, accessibility standards, and safety boundaries, preventing agents from breaking brand or layout rules.\n\u2022 **Optimize GenUI Latency:** Users tolerate 30-second delays in chat, but expect UI rendering within hundreds of milliseconds; utilize streaming JSONL express formats and parallel decision APIs to prevent rendering lag."}, {"session_id": "1258153", "title": "Rethinking CI/CD Release Gates for Agent-native Software", "category": "Observability & Evaluations", "topic": "Evals & Testing", "type": "Breakout", "video_id": "FmeuQdSLWiI", "recording_link": "https://www.youtube.com/watch?v=FmeuQdSLWiI", "company": "MCPJam", "speaker": "Prathmesh Patel", "word_count": 4678, "has_transcript": true, "premise": "Traditional CI/CD release gates (unit tests, linters, code coverage) are completely blind to agent-native failure modes: tool schema drift, subtle protocol version incompatibilities, prompt regressions, and OAuth handshake drops across heterogeneous client runtimes.", "technical_depth": "Drawing on data from testing over 100,000 MCP servers across 300+ enterprises, MCPJam introduced a three-tier agent-native CI/CD release gate architecture:\n1. Protocol & Schema Compatibility Gate: Enforces strict MCP JSON-RPC protocol compliance, checks capability negotiation, and flags client-server version skew.\n2. Security & OAuth Gate: Verifies scoped authorization boundaries, token lifespans, and identity-bound session routing.\n3. Behavioral Eval Gate: Replays representative user flows as behavioral test assertions, treating Product Requirement Documents (PRDs) as automated evaluation suites.", "takeaways": "\u2022 **Client Version Skew is the #1 Killer:** Minor differences between client-side MCP protocol parsers represent the single largest cause of production outages in enterprise MCP deployments.\n\u2022 **Gate on Interaction Fidelity:** Software releases must gate on whether autonomous agents successfully discover and invoke tools, not just whether the underlying API returns HTTP 200.\n\u2022 **Automated Tool Drift Detection:** Instrument CI release pipelines to immediately fail builds if tool descriptions become ambiguous or induce model hallucination."}, {"session_id": "1348566", "title": "Securing the Agentic Universe, One Layer at a Time", "category": "Developer Tools & Frameworks", "topic": "Building Reliable Agent Systems", "type": "Sponsored Session", "video_id": "cjdDDq7bfYw", "recording_link": "https://www.youtube.com/watch?v=cjdDDq7bfYw", "company": "Runlayer", "speaker": "Aidan Sochowski", "word_count": 5088, "has_transcript": true, "premise": "Every enterprise runs agents that call tools, use MCP servers, and touch production systems, at volumes that outpace any human review loop. That creates exposure: prompt injection, over-permissioned agents, MCP sprawl, and behavioral drift. At enterprise scale, defense in depth is the only architecture that holds. No single control catches everything. You need policies, runtime threat detection, and fine-grained access controls applied at every layer of the agentic stack, paired with full-session observability and behavioral baselines so you can find signals in the noise. You'll leave with a practical framework for securing AI agents without slowing adoption down. ************************* _In order to facilitate networking and business relationships at the event, you may choose to visit a third party\u2019s booth or access sponsored content. You are never required to visit third party booths or to access sponsored content. When visiting a booth or participating in sponsored activities, the third party will receive some of your registration data. This data includes your first name, last name, title, company, address, email, standard demographics questions (i.e. job function, industry), and details about the sponsored content or resources you interacted with. If you choose to interact with a booth or access sponsored content, you are explicitly consenting to receipt and use of such data by the third-party recipients, which will be subject to their own privacy policies._ In practice, the primary operational challenge stems from this breakdown: You could, argue that, \" maybe this cost is justified. Go spend this within a week.\" it's a complex problem and I think everybody's still trying to wrangle down what does, proper ROI look here, but this is just the start of it.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: You can have access to send emails from, over MCP or just however exactly you're doing it, You will go ahead and, have some you'll authenticate against an MCP server. Maybe even just the network it's coming from or it's running on the client.", "takeaways": "\u2022 **Operational Discipline:** Maybe it goes ahead and it stops and says, \", you know, this is this is still not the rules that I'm following.\", but the user could go ahead and, instruct this agent, if they have the ability to just, inject context into it.\n\u2022 **Production Finding:** So we really found that it's important to, in this case right, track this entire run against the instructions it's been given,\n\u2022 **Failure Mode Mitigation:** This is one of those cases in which looking at or having a model look at the entire run of an agent is really important.\n\u2022 **Deployment Rule:** Budgeting not just on, who is the user, but the agent that's running, the task that's going on, it becomes a lot more important as you scale these up."}, {"session_id": "1304142", "title": "Demo Theater: AI Gateway: Route, Govern, and Learn From Every Agent Interaction", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "CData Software", "speaker": "Jerod Johnson", "word_count": 0, "has_transcript": false, "premise": "An AI gateway is only as performant as the data layer powering it. An AI gateway is only as performant as the data layer powering it.", "technical_depth": "The technical architecture presented by Jerod Johnson (CData Software) establishes concrete mechanisms to resolve these failure modes: An AI gateway is only as performant as the data layer powering it. Join Jerod Johnson, CData\u2019s Director of Technology Evangelism, for a live walk through of the Connect AI Gateway, built to govern what agents do at the data layer, and ground them in context that spans the organization.", "takeaways": "\u2022 **Security Boundary:** Join Jerod Johnson, CData\u2019s Director of Technology Evangelism, for a live walk through of the Connect AI Gateway, built to govern what agents do at the data layer, and ground them in context that spans the organization.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1369196", "title": "Demo Theater: Design Tools for Your Intent, Not Your API", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Workato", "speaker": "Alex Stewart", "word_count": 0, "has_transcript": false, "premise": "See how Workato lets you build smarter, more reliable, and more token-efficient MCP servers by leveraging structured tool calls that rely on deterministic logic rather than probabilistic intent.", "technical_depth": "The technical architecture presented by Alex Stewart (Workato) establishes concrete mechanisms to resolve these failure modes: See how Workato lets you build smarter, more reliable, and more token-efficient MCP servers by leveraging structured tool calls that rely on deterministic logic rather than probabilistic intent.", "takeaways": "\u2022 **Protocol Specification:** See how Workato lets you build smarter, more reliable, and more token-efficient MCP servers by leveraging structured tool calls that rely on deterministic logic rather than probabilistic intent.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1261288", "title": "Auth.md - The Open Protocol for Agentic Registration", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Breakout", "video_id": "p7y0PAAQrts", "recording_link": "https://www.youtube.com/watch?v=p7y0PAAQrts", "company": "WorkOS", "speaker": "Michael Grinich", "word_count": 5405, "has_transcript": true, "premise": "AI agents are becoming users of software \u2014 but most apps still only know how to authenticate humans. Auth.md is an open spec for agent-native authentication: a way for AI agents to discover how to register for a service, prove identity, request scopes, receive tokens, and start using an API without breaking out of the agent workflow. This talk introduces our work on Auth.md and the emerging pattern for AI agent auth standards \u2014 including agent-native signup, identity assertions, ID-JAG, delegated authorization, and service discovery through an auth.md file. You\u2019ll also see a live demo where an AI agent discovers that Cloudflare supports agent registration, uses an Acme identity to create an account, receives an API token and account ID, sets up the Wrangler CLI, connects to Firecrawl, and deploys a live app. Auth.md is designed to help agents become legitimate users in your system \u2014 not fake humans, not spam, and not impersonators \u2014 but real agentic users with clear identity and authorization boundaries.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: I think the change that's happening here with engineering, this idea of removing the IDE, removing the interactive development environment, is quite profound. What's happening in software engineering, we're going to see elsewhere. The question I think here is why is it happening to software engineering, so quickly?", "takeaways": "\u2022 **Operational Discipline:** What it's doing here is it's finding the Neon Auth Indie document.\n\u2022 **Production Finding:** If you're interested in working on this or finding ways to help make your product agent ready, please come chat with me."}, {"session_id": "1268908", "title": "How Agents Really See the Web", "category": "Developer Tools & Frameworks", "topic": "Human-Agent Collaboration", "type": "Breakout", "video_id": "OC2LB_E6kzs", "recording_link": "https://www.youtube.com/watch?v=OC2LB_E6kzs", "company": "MCP Apps", "speaker": "Liad Yosef", "word_count": 6860, "has_transcript": true, "premise": "As AI assistants grow autonomous, agents are becoming the web's leading users - bot traffic recently surpassed human traffic, and everyone's racing to be \"agent ready.\" But what does that mean? And can we, as humans, even define it? Agents need to discover, identify, authenticate, pay, use your tools, and retrieve your data - ideally headlessly. When headless falls short, they spin up a browser. Standards like WebMCP assume agents use your actual site. So where does \"agent readiness\" lie, and what do agents really want? llms.txt? Auth protocols? Any of it? The problem with guessing: every \"best practices\" article goes obsolete the moment models improve. We keep designing for last month's agents. So how do we keep the web agent-friendly in a way that survives the next model release? We've researched how agents really use the web - how they discover, interact, authenticate, and pay, what they look for, what they fall back to, and what drives their choices at each step of the agentic journey. I'll share the key (and sometimes surprising) findings, a framework for becoming and staying agent-ready, and what this means for the web as we know it.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Why would we let agent interact with interfaces that have been perfected for 20 years for the human psychology, for the human flaws? WebMCP, as you probably heard, it's a good solution. WebMCP, as a primer, it's a way for website to declare tools for the agents to use, so that the agents won't have to use the website's interface anymore.", "takeaways": "\u2022 **Operational Discipline:** For every use case, you have the recommendation of which protocol to use or which standard to use.\n\u2022 **Production Finding:** Again, it's important to to remember, we have the web ecosystem that we built for 30 years, and now all of its layers need to adjust to adapt themselves to agents.\n\u2022 **Failure Mode Mitigation:** First, you're right that the entire model of e-commerce should change recommendation ads, those things.\n\u2022 **Deployment Rule:** But you're right that for e-commerce that the entire recommendation system is needs to change."}, {"session_id": "1298884", "title": "LLMs Are a Commodity. Choice and Control Aren't", "category": "Enterprise & Production", "topic": "Enterprise Adoption in Practice", "type": "Sponsored Session", "video_id": "v1FKGB05h48", "recording_link": "https://www.youtube.com/watch?v=v1FKGB05h48", "company": "Safe Software", "speaker": "Matt Meeboer", "word_count": 3370, "has_transcript": true, "premise": "The most important capabilities in an AI stack are the ability to choose which model you use, and the ability to control what data that model sees. LLMs are a commodity. Choice and control are the point. Choice means picking the cheap model for routine lookups and the frontier model when it matters, on-prem model when the data can't leave the building and the freedom to swap any of it out at any time without rearchitecting anything. Control means the data architecture, not the model, decides what data an agent can see. The right MCP layer lets you define exactly what data each tool exposes, so data architects know precisely what's going into AI instead of hoping the model behaves. Trusting a model not to leak or misuse what it's been handed is a bet, not control. Neither matter if the data isn't reachable. Most enterprises depend on harder data than the easy 80 percent of SaaS APIs MCP servers already cover: on-prem systems, CAD/BIM/GIS formats, regulated records under GDPR, HIPAA, or SOX, hybrid environments split by design. Leave that out of the MCP layer and choice and control both collapse, however good the model selection or governance policy is. Drawing on three decades of spatial and enterprise data integration, and real patterns from building a system that\u2019s both an MCP server and an MCP client, this talk covers what it takes to make hard, hybrid, and on-prem data first-class MCP tools, governed and audited as architecture so choice and control stay real and, not theoretical. ******************************* _In order to facilitate networking and business relationships at the event, you may choose to visit a third party\u2019s booth or access sponsored content. You are never required to visit third party booths or to access sponsored content. When visiting a booth or participating in sponsored activities, the third party will receive some of your registration data. This data includes your first name, last name, title, company, address, email, standard demographics questions (i.e. job function, industry), and details about the sponsored content or resources you interacted with. If you choose to interact with a booth or access sponsored content, you are explicitly consenting to receipt and use of such data by the third-party recipients, which will be subject to their own privacy policies._ In practice, the primary operational challenge stems from this breakdown: It's an issue of representation, so 3D data, spatial data, the locality, I just mentioned, data that can't or shouldn't move, computation, and authority. At Safe Software, we've been for over 30 years solving that hard data problem.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: If you need to host this close to your data on a Windows server on prem and Linux, containerized in any cloud, however you need to deploy, we can support that. All data and any AI, the velocities I just spoke about, all locations, all data types, structured, unstructured, semi-structured, spatial, and any AI technology you need to bring into your workflow or serve your data to through MCP. With FME's MCP capabilities, you can take any workflow you've developed.", "takeaways": "\u2022 **Operational Discipline:** It's finding the associated neighborhood polygon, doing an overlay."}, {"session_id": "1258042", "title": "Should This Be an AI Agent? A Product Framework for Enterprise Adoption", "category": "Enterprise & Production", "topic": "Enterprise Adoption in Practice", "type": "Breakout", "video_id": "O7czSnUtZ14", "recording_link": "https://www.youtube.com/watch?v=O7czSnUtZ14", "company": "Uber", "speaker": "Takeshwari Kamal", "word_count": 4994, "has_transcript": true, "premise": "As enterprises rush to adopt AI agents, many teams skip the most important product question: should this workflow be agentic at all? This session introduces a practical framework for deciding when an AI agent is the right solution, when a simpler automation or human-in-the-loop workflow is safer, and how to scope agentic systems around business value, autonomy, and risk. I\u2019ll walk through how product and technical leaders can evaluate agent readiness across task complexity, tool use, data sensitivity, reversibility, permissioning, customer impact, and failure tolerance. Drawing from experience building AI governance, LLM, and GenAI risk products in production environments, I\u2019ll introduce a \u201cblast radius\u201d model for agent deployment: how to limit permissions, define escalation paths, monitor failure signals, and add guardrails before expanding autonomy. Attendees will leave with a clear enterprise framework for evaluating agent use cases, communicating trade-offs with stakeholders, and designing safer agentic systems for real-world deployment. In practice, the primary operational challenge stems from this breakdown: What are some adoption challenges you're facing and I can try debug those with you. Every day as a PM, I'm dealing with this problem where I'm at the front line with the customers.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: We're not going to discuss the solution yet in typical PM fashion. Before we dive in, this is the general framework I've built. Feel free to use this to debug anytime before you start building your next agent for any customer, you feel free to use this workflow.", "takeaways": "\u2022 **Operational Discipline:** That's another thing that we're noticing as we're launching a lot of these AI solutions to production."}, {"session_id": "1205245", "title": "The Autonomous Pipeline: Using Agentic AI to Automate FCRA Compliance from API Spec to Production", "category": "Protocols & Standards", "topic": "Enterprise Adoption in Practice", "type": "Breakout", "video_id": "DQuw4OfmEck", "recording_link": "https://www.youtube.com/watch?v=DQuw4OfmEck", "company": "CapitalOne", "speaker": "Gokul Prabagaren", "word_count": 3695, "has_transcript": true, "premise": "Modernizing legacy data systems often fails at the \"Human Bottleneck\": months spent translating regulatory rules into API specs and production Spark code. At Capital One, we are breaking this cycle by moving mission-critical privacy ecosystems from cloud services to an Agentic Workflow. This session deep-dives into a multi-agent system that automates the engineering lifecycle for FCRA-regulated pipelines\u2014generating specs, writing code, and self-correcting via compliance guardrails. Attendees will learn: Agentic API Design: Using agents to ingest \"Filter\" requirements and generate standardized OpenAPI/Swagger specs. The Automated Auditor: A \"Validator Agent\" that uses metadata to verify code against data integrity rules, ensuring an immutable audit trail. Model-Driven Code Gen: Leveraging agents to consume specs and generate optimized code to kick off our Databricks Compute", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Depersonalization is the act or a process of really peeling off personally identifiable information in the data so that can be stripped off and that can be consumed for any of the analysis modeling aspects of what really the user does. For brevity, I have just kept it as a engine which does all of this. Some of this specs, if it is really complicated, those specs really can take multiple iterations in your I am just calling it as COE or center of excellence to give a thumbs up, go ahead and take care of your code.", "takeaways": "\u2022 **Operational Discipline:** Also all the knowledge whatever the team possesses, or your organizational institutional knowledge, whatever you process, those things now is qualified as a senior engineer knowledge, and those things can be repeated as a rules."}, {"session_id": "1258174", "title": "The Restraint Pattern: A Reliability Model for Agents That Act in Public", "category": "Developer Tools & Frameworks", "topic": "Building Reliable Agent Systems", "type": "Breakout", "video_id": "fFKtjp6neI0", "recording_link": "https://www.youtube.com/watch?v=fFKtjp6neI0", "company": "Independent", "speaker": "Bharat Patel", "word_count": 3594, "has_transcript": true, "premise": "An agent that posts in a live, public channel plays by different rules than one in a notebook. It can be wrong in front of customers, spam a channel, talk over a human mid-reply, or get coaxed into things it shouldn\u2019t do. Reliability here is barely about uptime. It\u2019s about restraint: answer what you\u2019re sure of, step back otherwise. I\u2019ll walk through a multi-channel first responder built to deflect the routine 60-70% and escalate the hard rest. The core move: classify every question by topic regardless of channel, then drive both the answer and the escalation target off one routing table, with per-channel scope in config. Three mechanisms enforce restraint: cross-post de-duplication, human-takeover backoff (the moment a human replies, it stands down), and confidence-gated answering that escalates when unsure. Hardening is built in: no execution layer, no secret handling, and skills guarded so an accidental run can\u2019t post or pollute the learner. The tools it calls return structured signals (anomaly flags, event funnels) rather than raw logs, so the agent reasons over shaped data. The failure modes are universal to anything that talks in public. In practice, the primary operational challenge stems from this breakdown: We today we are going to talk about the patents that can help solve some of these problems. The second one is the more costlier mistake because that can make your customers lose the confidence in your AI system.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: The most important thing is it's about the restraint pattern. For more judgment based questions, the high stake questions where judgment is needed whether to call this incident, whether to kill the job or resume the job, all those needs to be escalated to the humans or more specialized domain specific agents. This is the first sub pattern of the restraint pattern which is having one routing table.", "takeaways": "\u2022 **Operational Discipline:** Instead of providing the raw logs from the application where the important information would be somewhere in between these log lines.\n\u2022 **Production Finding:** Where providing right answer correctly is more important and avoiding confident wrong answer is absolutely necessary to ensure customer trust."}, {"session_id": "1291877", "title": "There's No Dark Factory Without Better Software Verifiers", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "zY3kZTVN6V8", "recording_link": "https://www.youtube.com/watch?v=zY3kZTVN6V8", "company": "HumanLayer", "speaker": "Dexter Horthy", "word_count": 5265, "has_transcript": true, "premise": "While the \"do you have to read the code\" debate rages on, we've been hard at work figuring out how to get models to write code that gets better over time, not worse. We'll discuss why current model training approaches and benchmarks checking \"do the tests pass\" are not enough, and how we're approaching evaluating the long-term-quality of LLM-generated code. In practice, the primary operational challenge stems from this breakdown: We all got really excited about going way faster and, I will say probably using too much AI is a better problem to have than using not enough. But, and some people will tell you this is a skill issue that if you're if you're if you have more incidents and bugs you're just you're holding it wrong.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: We're just going to see what happens if we just don't do that.\" and as engineers, it's really I don't know. I gave a talk in the end of June this year at the AI Engineer Summit, where we did a intuition-based exploration of how benchmarks work and how a lot of RL verifiers work that tries to build the intuition for this. But the basic idea is, the cost of bad architecture is measured in months and years.", "takeaways": "\u2022 **Operational Discipline:** Finding slop with deterministic tools is really, really high leverage.\n\u2022 **Production Finding:** And so all of these things write complexity and then there's tons and tons of custom rules that you can do.\n\u2022 **Failure Mode Mitigation:** Most people have a single source of truth for what is production, what is our main branch, what is our canary.\n\u2022 **Deployment Rule:** We believe that as engineers it's really important to be able to assemble the bottom parts of this stack, especially the dev environment."}, {"session_id": "1253858", "title": "What Your MCP Server Does When Nobody's Looking", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "YF3SxZAtK3o", "recording_link": "https://www.youtube.com/watch?v=YF3SxZAtK3o", "company": "honeycomb.io", "speaker": "Austin Parker", "word_count": 4602, "has_transcript": true, "premise": "Everyone, and I mean everyone, is shipping an MCP server. How do you know if yours is any good? At Honeycomb, we've been running MCP in production for over a year, and agentic use of our platform has skyrocketed \u2014 over 40% of weekly query volume now comes through agents rather than humans. That's great, except most observability tooling assumes a world where a person clicks through a coherent workflow you can see and reason about. Agents break that assumption: no stable session boundaries, non-deterministic call ordering, and a caller that'll fire a dozen speculative tool calls and abandon half of them. So our challenge: how do we know whether agents are actually having a good experience with our MCP? In this talk I'll cover how we instrumented high-fidelity tracing across our entire MCP server to profile real agent transactions and find where latency and confusion actually accumulate, and how we built a continuous feedback loop on that production data \u2014 with evals on agent workflows baked in \u2014 to keep optimizing context usage and output formats as new models and agent harnesses keep landing. In practice, the primary operational challenge stems from this breakdown: We knew when we were building our MCP that we had to answer these questions, cuz these are questions and problems that we had seen ourselves in prototyping. That was very valuable, because we really quickly realized that this pattern of just saying, \" agent, here's our API, go run our API go run a query through our API.\" ran into this problem.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: We knew when we were building our MCP that we had to answer these questions, cuz these are questions and problems that we had seen ourselves in prototyping. What is how do we get that observability for our MCP? That was very valuable, because we really quickly realized that this pattern of just saying, \" agent, here's our API, go run our API go run a query through our API.\" ran into this problem.", "takeaways": "\u2022 **Operational Discipline:** With evals we looked at our actual production data, we looked at that client attribute to see where should we focus?\n\u2022 **Production Finding:** What we learned is that shape beats precision."}, {"session_id": "1304153", "title": "Demo Theater: Smartsheet AI: Building the Future of Work Management, Live!", "category": "Developer Tools & Frameworks", "topic": "De tegory": "Security & Governance", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "WorkOS", "speaker": "Pavan Kulkarni", "word_count": 0, "has_transcript": false, "premise": "A look at the future of agent authorization beyond coarse OAuth scopes. A look at the future of agent authorization beyond coarse OAuth scopes.", "technical_depth": "The technical architecture presented by Pavan Kulkarni (WorkOS) establishes concrete mechanisms to resolve these failure modes: A live demo of agent intent governance and where nondeterminism belongs in authz.", "takeaways": "\u2022 **Production Strategy:** A live demo of agent intent governance and where nondeterminism belongs in authz.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1312650", "title": "Beyond Scopes: Governing What Agents Are Actually Allowed to Do", "category": "Developer Tools & Frameworks", "topic": "Building Reliable Agent Systems", "type": "Sponsored Session", "video_id": "CBjzNAK2SVM", "recording_link": "https://www.youtube.com/watch?v=CBjzNAK2SVM", "company": "WorkOS", "speaker": "Pavan Kulkarni", "word_count": 4672, "has_transcript": true, "premise": "OAuth scopes tell you an agent can write to your CRM. They don't tell you whether it should have written that. This session goes deep on intent-based authorization for agents: how to model agent identity distinctly from user identity, where policy decisions belong when the caller is nondeterministic, and what a real permission check looks like in an agentic call chain. Includes a recap of the concepts from our demo theater session, plus the architecture and failure modes we didn't have time for. *********************** bit about the rules behind it, but one other thing that we understood scaling and building Airlock internally at WorkOS is that we have to make writing policies extremely simple.\n\u2022 **Failure Mode Mitigation:** That sounds pretty obvious, but if writing every new rule and updating it requires a lot of work, then people generally end up reverting back to broad permissions.\n\u2022 **Deployment Rule:** One other interest important thing for any authorization system, but even more so with things that are scaling at machine speed is we need a really robust audit trail of every single thing that agent tries to do."}, {"session_id": "1254183", "title": "Building an Agentic Eval Pipeline: Battle-Tested Lessons with EvalBench", "category": "Observability & Evaluations", "topic": "Evals & Testing", "type": "Breakout", "video_id": "0cBJ4X1LS1A", "recording_link": "https://www.youtube.com/watch?v=0cBJ4X1LS1A", "company": "Google", "speaker": "Kurtis Van Gent, Haoyu Wang", "word_count": 0, "has_transcript": false, "premise": "Agents are easy to demo but brutally hard to evaluate. Once your system handles planning and tool calls, traditional LLM evaluations\u2014like exact match or eyeballing\u2014fail entirely. You ship a prompt change and break edge cases invisibly.", "technical_depth": "The technical architecture presented by Kurtis Van Gent, Haoyu Wang (Google) establishes concrete mechanisms to resolve these failure modes: This talk shares engineering lessons from building Evalbench, an open-source evaluation framework, and how we scaled it from NL2SQL testing to complex agent workflows. You\u2019ll leave with a concrete blueprint to instrument your agents, including: 1. Beyond the Final Answer: Measuring trajectory, tool accuracy, and sub-goals. Modular Architecture: Inside Evalbench\u2019s evaluators, scorers, and reporters. Production A/B Testing: Running rigorous experiments for model, prompt, or tool swaps", "takeaways": "\u2022 **Production Strategy:** Production A/B Testing: Running rigorous experiments for model, prompt, or tool swaps\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Evals & Testing workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1348458", "title": "Hermes Agent: The Agent That Grows With You", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "", "recording_link": "", "company": "Nous", "speaker": "Sam Herring", "word_count": 0, "has_transcript": false, "premise": "Hermes Agent is the self-improving AI agent built by Nous Research. Hermes Agent is the self-improving AI agent built by Nous Research.", "technical_depth": "The technical architecture presented by Sam Herring (Nous) establishes concrete mechanisms to resolve these failure modes: The only agent with a built-in learning loop that creates skills from experience, improves them during use, nudges itself to persist knowledge, and builds a deepening model of who you are across sessions. Install Hermes, connect a model provider, and give it a first task; you choose which tools and services to connect.", "takeaways": "\u2022 **Production Strategy:** Install Hermes, connect a model provider, and give it a first task; you choose which tools and services to connect.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Agentic Engineering workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1228294", "title": "ID-JAG: Solving OAuth Sprawl for Enterprise AI Agents", "category": "Security & Governance", "topic": "Enterprise Adoption in Practice", "type": "Breakout", "video_id": "k8PVWNbnKQs", "recording_link": "https://www.youtube.com/watch?v=k8PVWNbnKQs", "company": "Okta, Anthropic", "speaker": "Aaron Parecki, Den Delimarsky", "word_count": 5196, "has_transcript": true, "premise": "Enterprise AI agents are moving from demos into production, and auth is becoming a blocker. Demo agents can connect to tools with OAuth, but real enterprise agents may need SaaS services for thousands of employees. Per-user, per-service consent does not scale. This session explains ID-JAG, the Identity Assertion JWT Authorization Grant pattern behind MCP's Enterprise-Managed Authorization extension. ID-JAG turns an existing SSO login into centrally governed, auditable access to approved MCP servers, without repeated OAuth prompts. We'll cover the production problem, protocol flow, and lessons from implementing ID-JAG support in Archestra, one of the first MCP clients to support it. We'll also discuss what identity provider support enables. Attendees will leave with a model for production agent auth: one SSO login, centralized policy, scoped MCP-native access tokens, fewer consent screens, and a cleaner security review story. We'll close with the missing piece: SaaS provider adoption. To unlock enterprise deployments, authorization servers need to support this flow so agents can access approved business systems without key-sharing, manual credentials, or one-off integrations. In practice, the primary operational challenge stems from this breakdown: You might have different MCP servers that will just start prompting you and it becomes again an untenable problem. Prompt fatigue is very real, and not just that, but also the problem that we've seen in the industry is the fact that when people get these prompts, sometimes you're going to be SSO'd in.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Then you have to authorize each server individually. You have the refresh tokens that can
