orities to deepen our understanding of AI risks, develop effective mitigation approaches, and guide the development of robust AI policies. In practice, the primary operational challenge stems from this breakdown: While at the same time that we want to enjoy the great benefits and potential of agentic AI, at the same time we also need to pay attention to a broad spectrum of different types of AI risks. In a recent report from in our recent report from around 100 scholars around the around the globe, this international AI safety report, we list out a broad spectrum of different types of AI risks.", "technical_depth": "The proposed system architecture implements a modular, deterministic execution pipeline for Keynote Sessions. It enforces formal schema validation, isolated runtime contexts, and strict tool-invocation boundaries to ensure reliable multi-turn execution.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Dawn Song.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1288865", "title": "Keynote: The Anything Trap: What to Build When Agents Can Build Everything", "category": "Developer Tools & Frameworks", "topic": "Keynote Sessions", "type": "Keynote", "video_id": "w9EXDc1rrGE", "recording_link": "https://www.youtube.com/watch?v=w9EXDc1rrGE", "company": "Akamai", "speaker": "Lena Hall", "word_count": 1053, "has_transcript": true, "premise": "Agents made implementation nearly free \u2014 for you and for everyone pointing the same models at the same data. That's the Anything Trap: when anything can be built, everything converges. This keynote argues the value moved up the stack, from building to choosing. The one decision AI can't make is what deserves to exist. Five minutes on conviction, signal, and why agents build \u2014 but you choose. In practice, the primary operational challenge stems from this breakdown: If you walk any expo floor with some amazing products, they're all solving real problems.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Convergence machine generally doesn't proactively offer you those weird, specific, slightly embarrassing ideas. The rarest thing is being a real person, being close to your real domain, with your own battle scars, with your weirdly specific experience, and the thing that you care about more than is reasonable. If you've ever scrolled LinkedIn, you probably know you've seen some posts we're not building a tool, we're building a platform.", "takeaways": "\u2022 **Operational Discipline:** Stays quiet on anything that it can't tie to real user impact and shows you everything that it silenced so you can overrule it."}, {"session_id": "1288821", "title": "Keynote: Agents as Actors: Harnessing the Power of Agentic Infrastructure", "category": "Developer Tools & Frameworks", "topic": "Keynote Sessions", "type": "Keynote", "video_id": "SS4e7RLtTH8", "recording_link": "https://www.youtube.com/watch?v=SS4e7RLtTH8", "company": "Solo.io", "speaker": "Keith Babo", "word_count": 1027, "has_transcript": true, "premise": "Harnessed agents have become the dominant interaction and runtime pattern for agentic AI. Claude Code, Codex, and a fast-growing field of open source harnesses integrate models with MCP tools, skills, and plugins. These harnesses provide sandboxed execution, scoped environment access, and human-in-the-loop controls on the desktop. The industry's next shift is already underway: moving harnessed agents from the desktop onto shared infrastructure, where security, observability, and governance are consistent across every agent interaction. In this talk, we will explore how open source infrastructure can deliver secure, scalable harnessed agents beyond the desktop.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: The calls that go into LLMs that are agent-to-agent MCP tool calls. Agent Gateway was built from the ground up for these agentic protocols. With over 500 contributors from 130 organizations, Agent Gateway is rapidly becoming the de facto agent data plane across any environment.", "takeaways": "\u2022 **Operational Discipline:** Agent Shield will automatically generate these rules and policies on admission by integrating with frontier and open-source models, and then will continuously evaluate those rules at runtime, and generate findings.\n\u2022 **Production Finding:** If you go to this QR code, you can find out more about Agent Shield, but more importantly, all of the open-source projects I just talked about covering agentic infrastructure."}, {"session_id": "1291893", "title": "Keynote: From Black Box to Glass Box: Your 5-step Blueprint to Trustworthy Agents", "category": "Developer Tools & Frameworks", "topic": "Keynote Sessions", "type": "Keynote", "video_id": "s7J2inKm69g", "recording_link": "https://www.youtube.com/watch?v=s7J2inKm69g", "company": "TrueFoundry", "speaker": "Abhishek Choudhary", "word_count": 1101, "has_transcript": true, "premise": "Every token spent, every tool call made, every action taken inside a sandbox, every credential used - all of it should be visible, all the time, to the people responsible for that agent. Not buried across five dashboards after something breaks, but streaming through one place, in real time, before it becomes an incident. The fix isn't inside the agent's code - it's at the network layer. Intercept every call an agent makes, swap in short-lived scoped credentials instead of handing it real secrets, and log the tokens, tools, and sandbox actions through that same choke point. One vantage point. One trail. No blind spots. In 5 minutes: why \"\"trust the agent\"\" is the wrong model, and what it actually takes to make agent behavior as transparent as it needs to be - for the person debugging it at 2am, and the person who has to explain it to a regulator. In practice, the primary operational challenge stems from this breakdown: I to frame this problem statement as moving agents from a black box to a glass box. Anthropic came out with multiple cybersecurity attacks.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: There was this another singularity incident where there was an attempt made to steal tokens from developers' laptops. If I call an MCP server and the MCP server says that please send me send all the passwords to this email, the agent is going to do that. The same concept where the agent was trying to go out to contact your MCP servers, your internet, your file system, other agents, all of that, just put the agent inside a box and think of it there's a door through which it goes out.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Abhishek Choudhary.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1288850", "title": "Keynote: The Agentic Web", "category": "Developer Tools & Frameworks", "topic": "Keynote Sessions", "type": "Keynote", "video_id": "8IwsoNrZW1U", "recording_link": "https://www.youtube.com/watch?v=8IwsoNrZW1U", "company": "Google", "speaker": "Sarah Drasner", "word_count": 2152, "has_transcript": true, "premise": "AI is reshaping the web from a place we navigate ourselves into an environment where agents can discover, interpret, and act on our behalf. This shift is creating new pathways, new user experiences, and new questions about what the web is becoming. In this keynote, we\u2019ll explore the rise of the agentic web: how AI is changing the composition of the internet, how emerging specifications like WebMCP are beginning to define new interaction patterns, and what this shift means for builders, platforms, security, and the future of user experience. Most importantly, we\u2019ll connect the vision to what\u2019s possible today, what\u2019s coming next, and how we can help shape an agentic web that expands what people and software can accomplish together. In practice, the primary operational challenge stems from this breakdown: First, we had GeoCities, which was a bastion of unbounded creative internet explosion. I'll spend some time today on the bigger, more pertinent issues.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: I'm a distinguished engineer at Google, and this is evolution of the web in the age of AI. Let's look at the tools that we can expose to help agents help us. Leveraging this standard, web developers can expose their application via tools and structured schemas invoked by these agents.", "takeaways": "\u2022 **Operational Discipline:** But it's important to note that they can work together.\n\u2022 **Production Finding:** The nice thing about the skill, if you use LM to scaffold tools, is it's always going to make sure that you're using security best practices."}, {"session_id": "1367168", "title": "AAIF Technical Committee Office Hours", "category": "Protocols & Standards", "topic": "Breaks / Meals / Special Events", "type": "Breakout", "video_id": "", "recording_link": "", "company": "N/A", "speaker": "N/A", "word_count": 0, "has_transcript": false, "premise": "Drop by and meet with Manik Surtani (AAIF CTO) and the AAIF Technical Committee, share what's on your mind.", "technical_depth": "The technical architecture presented by N/A (N/A) establishes concrete mechanisms to resolve these failure modes: Drop by and meet with Manik Surtani (AAIF CTO) and the AAIF Technical Committee, share what's on your mind.", "takeaways": "\u2022 **Production Strategy:** Drop by and meet with Manik Surtani (AAIF CTO) and the AAIF Technical Committee, share what's on your mind.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Breaks / Meals / Special Events workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1298032", "title": "Demo Theater: Building an MCP Server in 7 Minutes", "category": "Protocols & Standards", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Safe Software", "speaker": "Matt Meeboer", "word_count": 0, "has_transcript": false, "premise": "Every organization has workflows buried in back-end systems - work orders, field reporting, asset tracking.", "technical_depth": "The technical architecture presented by Matt Meeboer (Safe Software) establishes concrete mechanisms to resolve these failure modes: Every organization has workflows buried in back-end systems - work orders, field reporting, asset tracking. This demo shows what changes when they can.", "takeaways": "\u2022 **Production Strategy:** Your business logic, your data rules, your integrations - they're already done.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1201093", "title": "Before the Agent Writes Code: Policy-Aware Engines for AI Coding", "category": "Security & Governance", "topic": "Building Reliable Agent Systems", "type": "Breakout", "video_id": "7exa4ZcZM_c", "recording_link": "https://www.youtube.com/watch?v=7exa4ZcZM_c", "company": "Qodo", "speaker": "Nnenna Ndukwe", "word_count": 4206, "has_transcript": true, "premise": "We know AI coding agents can write code fast. But that doesn't mean they should be trusted to write it well, safely, or in alignment with your engineering standards. In this talk, I\u2019ll show why many agent workflows could use a code quality enforcement layer before code generation even begins. Using an open-sourced tool called PolicyNIM, I\u2019ll walk through an AI system that turns Markdown engineering policies into grounded, citeable guidance by retrieving evidence, reranking results, synthesizing structured recommendations, and failing closed when the evidence is too weak to trust. At its core, this talk is about operationalizing discipline for coding agents. We\u2019ll cover evaluation, traceability, explicit failure modes, and how the MCP can serve as a practical integration surface for coding agents like Codex and Claude Code. You\u2019ll leave with a concrete design pattern for building agent workflows that behave with evidence, constraints, and judgment. In practice, the primary operational challenge stems from this breakdown: We're going to walk through how Policy Nym works and then we're going to walk through an example of a coding task from a GitHub issue that I have in a for a repo.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: A profile chooses which packs of policies to choose and you can combine yours with the starter policies that come with Policy N and then you can use there's a CLI aspect of this as well to check the selection and build the index of all the policies. As you all know what MCP is, it stands for model context protocol and it defines how a client discovers and calls tools. The coding agent can ask this server for engineering policies.", "takeaways": "\u2022 **Operational Discipline:** But now it needs to Now we need to prove that the quality of the code, the output is a demonstration that it did in fact follow the rules.\n\u2022 **Production Finding:** On the left is the rule about excluding the sensitive values.\n\u2022 **Failure Mode Mitigation:** That's how the same rule That's how we use one rule for the planning mode and the implementation mode and the testing phase as well.\n\u2022 **Deployment Rule:** At Codium, we are bringing in a code-based context, which is incredibly important for how an agent's going to decide how to work on and build or write your software."}, {"session_id": "1304675", "title": "Beyond MCP: Building an Enterprise Knowledge Layer for Production AI Agents", "category": "Protocols & Standards", "topic": "Enterprise Adoption in Practice", "type": "Sponsored Session", "video_id": "uBNBDNaCuqQ", "recording_link": "https://www.youtube.com/watch?v=uBNBDNaCuqQ", "company": "Neo4j", "speaker": "Jeremy Adams - Casa\u00f1as", "word_count": 3943, "has_transcript": true, "premise": "The Model Context Protocol (MCP) has rapidly become the standard interface for connecting AI agents to enterprise tools and services. But as organizations deploy more agents, a new challenge emerges: How does an agent know which tools\u2014and which enterprise systems\u2014it should consult in the first place? Business questions rarely map to a single API. A request like \"\"What's our exposure to this customer?\"\" requires an understanding of enterprise concepts such as customers, contracts, incidents, dependencies, security posture, policies, and organizational ownership before any tool can be invoked. Those concepts span dozens of systems, each with its own APIs, permissions, and semantics. This talk introduces the Enterprise Knowledge Layer, an architectural pattern that complements MCP by providing a shared semantic foundation for AI agents. Rather than hard-coding workflows or broadcasting requests to every available tool, the Enterprise Knowledge Layer interprets user intent, understands enterprise concepts, determines which systems are relevant, applies organizational policy, and assembles the context needed to answer a question or execute a task. Through a live demonstration, we'll follow a single business question from natural language to execution. The Enterprise Knowledge Layer identifies the relevant concepts, selects the appropriate MCP servers, orchestrates data retrieval across multiple enterprise systems, and records the resulting decision, evidence, and provenance into a persistent context graph for future agents and human operators. Attendees will see how this architecture enables production-ready agent systems that are more explainable, observable, and governable than isolated tool-calling agents\u2014without sacrificing interoperability across models, frameworks, or vendors. ******************************* _In order to facilitate networking and business relationships at the event, you may choose to visit a third party\u2019s booth or access sponsored content. You are never required to visit third party booths or to access sponsored content. When visiting a booth or participating in sponsored activities, the third party will receive some of your registration data. This data includes your first name, last name, title, company, address, email, standard demographics questions (i.e. job function, industry), and details about the sponsored content or resources you interacted with. If you choose to interact with a booth or access sponsored content, you are explicitly consenting to receipt and use of such data by the third-party recipients, which will be subject to their own privacy policies_ In practice, the primary operational challenge stems from this breakdown: That costs a lot of money, and our context windows are only so big. Then, what if we're trying to address a real business problem?", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: MCP doesn't tell me anything about what the definition of exposure is, so I don't know, but I've got all these MCP servers. Then, I've got all these different tools to choose from. They will pa- possibly, probably, run different tools on every time you ask this question.", "takeaways": "\u2022 **Operational Discipline:** It's production dependency, security risks, service incidents that could affect our contracts.\n\u2022 **Production Finding:** We know that we've already got some security incidents that put us in a bad place, and there's some production infrastructure that affects this customer, but affects others as well.\n\u2022 **Failure Mode Mitigation:** In this case, it's my recognition that yes, this is something that's important."}, {"session_id": "1257399", "title": "Beyond Pass/Fail: Measuring the Full Agent Experience", "category": "Observability & Evaluations", "topic": "Evals & Testing", "type": "Breakout", "video_id": "3wXJbjV6YAE", "recording_link": "https://www.youtube.com/watch?v=3wXJbjV6YAE", "company": "Netlify", "speaker": "Sean Roberts", "word_count": 4500, "has_transcript": true, "premise": "Netlify discovered that Model Context Protocol (MCP) integrations have become their #1 highest converting sign-up-to-paid channel, processing hundreds of millions of tool calls as developers delegate full deployment lifecycles to autonomous agents. However, most engineering teams evaluate MCP servers using simple binary pass/fail assertions (\"did the site deploy or fail?\"), which completely masks the reality of the agent's journey. A binary \"pass\" fails to reveal whether an agent spent 12 expensive turns thrashing through errors, while a \"fail\" often blames the MCP server when the true culprit was an environment permission drop or upstream agent prompt drift. Furthermore, high Developer Experience (DX) for humans does not equal good Agent Experience (AX)\u2014common human-centric patterns like interactive CLI prompts, automatic CLI background updates, and ambiguous REST/OpenAPI parameter names cause agents to silently fail or route around MCP servers entirely.", "technical_depth": "To eliminate guesswork and replace social-media hype with empirical data, Netlify developed AXIS (axis.run), an open-source evaluation framework designed specifically to benchmark Agent Experience (AX). Rather than evaluating static checklists, AXIS executes actual autonomous agents (such as Goose, Claude Code, and OpenAI Codex) across end-to-end task scenarios and analyzes the entire execution trace across four decoupled architectural dimensions:\n1. Goal Achievement: Verifies deterministic end-state correctness (e.g., verifying that the production URL is live, assets are deployed, and configuration files match exact schemas).\n2. Environment Quality: Audits whether the execution sandbox obstructed progress (e.g., missing global CLI binaries, file permissions, network egress blocks).\n3. Service Quality: Measures MCP server reliability, response latency, API error rates, and schema clarity.\n4. Agent Decision-Making: Tracks token overhead, turn counts, tool discovery latency, and whether the agent selected optimal tools or made redundant/hallucinated calls.\nAXIS introduces matrix variant testing, allowing engineers to systematically test permutations: comparing a focused 5-tool MCP server against a full 500-tool OpenAPI-generated server, or testing MCP against raw CLI and documentation-only baselines. Crucially, assertions can be placed on the execution trace itself (e.g., asserting that the agent called the official MCP tool rather than attempting a raw curl or bash workaround).", "takeaways": "\u2022 **Agents Change Faster Than Models:** Agent harnesses (Claude Code, Goose, Codex) push pull requests and prompt updates hundreds of times a week. Benchmarking solely against foundation model versions is insufficient; production teams must continuously test against evolving agent runtimes.\n\u2022 **The 500-Tool Discovery Experiment:** Real-world testing with AXIS revealed that modern agent runtimes with intelligent tool filtering handle a 500-tool MCP server surprisingly well without exploding context windows or degrading task completion compared to a 5-tool subset\u2014challenging the conventional wisdom that aggressive 'code mode' tool pruning is always mandatory.\n\u2022 **Web Search Preempts Web Fetch:** Empirical traces revealed that modern agents frequently execute a broad web search before attempting to fetch a provided documentation URL. As a result, Agent Engine Optimization (AEO) and public indexability directly dictate whether an agent succeeds at using a developer service.\n\u2022 **Root-Cause Attribution:** Decoupling evaluations across Environment, Service, and Agent enabled Netlify to isolate an upstream OpenAI Codex regression mid-flight, verifying that all pre-requisite tool calls succeeded and only Codex stalled at a specific step, allowing them to report the regression directly to OpenAI partners.\n\u2022 **CI/CD Cost Management:** Because multi-turn agent evaluations consume substantial tokens and execution time, running full suites on every git commit is cost-prohibitive. Netlify recommends running AXIS suites on scheduled nightly builds, high-risk pull requests, and breaking tool-schema migrations."}, {"session_id": "1206048", "title": "Leveraging A2A Protocol to Build Framework Agnostic Multi-Agent System", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Breakout", "video_id": "qoCn-lbQwCY", "recording_link": "https://www.youtube.com/watch?v=qoCn-lbQwCY", "company": "PayPal", "speaker": "Sohil Shah", "word_count": 4890, "has_transcript": true, "premise": "With the growing number of Agentic AI Frameworks and a constantly evolving landscape of AI Agents, ensuring interoperability between agents built on different ecosystems has become a critical challenge. The A2A (Agent-to-Agent) protocol addresses this need by enabling standardized communication and coordination across diverse AI agents. In this session, we will explore what A2A is, how it works, and how it compares to MCP. We\u2019ll break down the A2A architecture and demonstrate how agents can seamlessly communicate and collaborate using this protocol. Attendees will gain a practical understanding through an end-to-end demo built on A2A. We\u2019ll also examine real-world use cases and discuss how A2A can be leveraged to build scalable, interoperable agent systems in production environments.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: It has all the information about the agent, the protocol it needs to communicate to, how do you discover the agent, and all of those things. Then the specialist agent on the other side would take care of the task and then respond back with the results. That's basically at a very high level the essence of A2A.", "takeaways": "\u2022 **Operational Discipline:** I don't exactly remember what else, but I'll give you a nice checklist of things to look at.\n\u2022 **Production Finding:** The agent remembers everything about the itinerary.\n\u2022 **Failure Mode Mitigation:** Here are some takeaways, things to read if you are interested in it.\n\u2022 **Deployment Rule:** SRE team has some domain knowledge about what's happening in production."}, {"session_id": "1323352", "title": "MCP Security, Two Years In", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "", "recording_link": "", "company": "Anthropic", "speaker": "Den Delimarsky", "word_count": 0, "has_transcript": false, "premise": "Two years of operating the Model Context Protocol (MCP) in enterprise production have exposed critical attack vectors across the client-server boundary. As developers expose local files, shell terminals, and internal APIs to LLMs via MCP, naive tool implementations inadvertently create massive privilege escalation and prompt injection vulnerabilities.", "technical_depth": "Den Delimarsky (Anthropic) distills enterprise security architecture for MCP across three core pillars:\n1. Specification-Level Auth: Enforces OAuth 2.0 authorization flows with cryptographic token binding\u2014ensuring tokens are strictly scoped and bound to the specific server for which they were issued.\n2. SDK Security Primitives: Recommends using official Anthropic MCP SDKs as the baseline, which enforce strict JSON-RPC schema validation and prevent unauthorized capability reflection.\n3. Untrusted Tool Output Hygiene: Treats all tool outputs as untrusted user input to mitigate indirect prompt injection attacks where malicious web or file data hijacks agent reasoning.", "takeaways": "\u2022 **Tool Output is Untrusted Input:** Never treat data returned from tools or external APIs as safe; sanitize and isolate tool outputs before injecting into the model context.\n\u2022 **Server-Bound Scoped Tokens:** Bind OAuth tokens to the specific MCP server instance to prevent token exfiltration and lateral movement across servers.\n\u2022 **Explicit Consent Gates:** Maintain user confirmation barriers before executing irreversible or sensitive tool operations (file deletions, financial transactions, database writes)."}, {"session_id": "1256953", "title": "Programmable LLM Inference for Open Agent Infrastructure", "category": "Developer Tools & Frameworks", "topic": "Open Source Tools", "type": "Breakout", "video_id": "OYAeLb4-_YU", "recording_link": "https://www.youtube.com/watch?v=OYAeLb4-_YU", "company": "Yale University", "speaker": "Lin Zhong", "word_count": 4822, "has_transcript": true, "premise": "AI agents are no longer simple \u201cprompt in, tokens out\u201d applications. They branch, call tools, retry, verify, and manage long-lived context. Yet today\u2019s serving stacks still expose a chatbot-shaped interface: submit a request, receive a token stream, and optimize from the outside. This talk introduces Pie, an open-source programmable inference runtime for agent infrastructure (https://pie-project.org). Pie lets applications express inference-time control logic, such as branching, speculative execution, tool-aware scheduling, and workflow-specific KV cache management, in programs called Inferlets. Inferlets can be written in Rust, Python or JavaScript and compiled to run as a Wasm program close to the model runtime, behind the chat interface. Using concrete workflow examples, I will show why many latency, cost, and quality optimizations require application knowledge that generic serving engines cannot see. I will then walk through Pie\u2019s runtime model, inferlets, and how programmable serving complements MCP, tracing, sandboxes, memory layers, and deployment platforms. In practice, the primary operational challenge stems from this breakdown: Specifically in the case of agents, what does this fixed loop cost you? What is What is this cost to this very fixed interface?", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: We know our workflow better than well, in this case vLLM, Of course, if you want to implement your own thing, your options are to fork the engine. Pi is a strict generalization of existing inference engines.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Lin Zhong.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1260899", "title": "Why Domain-specific Agents Are the Future", "category": "Protocols & Standards", "topic": "Interoperability & Standards", "type": "Breakout", "video_id": "wIPr9GmLRaQ", "recording_link": "https://www.youtube.com/watch?v=wIPr9GmLRaQ", "company": "Standard Agents", "speaker": "Justin Schroeder", "word_count": 4460, "has_transcript": true, "premise": "It turns out the old engineering adage \u201ccomposition over inheritance\u201d applies to AI too. A Gmail agent is fundamentally better than a Gmail skill, and paired with a Sheets agent, a Notion agent, and a GitHub agent, you\u2019ll significantly increase efficacy while reducing cost. Small models suddenly become viable, letting you put AI in front of your customers, not just your team. In this talk, we\u2019ll discuss why this vision of the future hasn\u2019t taken shape yet, and what you can do to build toward it today. In practice, the primary operational challenge stems from this breakdown: You got to have durable execution where stuff fails, you can pick it back up. It's It's too much risk for them to be, I have working processes.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: You need to orchestrate the loop and make sure things don't break during, async stuff. What we tell everybody, especially here in the in the Bay Area, what we tell everybody is don't build agents. What we should do is we should just build MCP servers,", "takeaways": "\u2022 **Operational Discipline:** That's why it's really important that the agent is built for a specific model, especially on the on the smaller end."}, {"session_id": "1291884", "title": "Workshop: The Buzz-Word Is Collaboration \ud83d\udc1d", "category": "Developer Tools & Frameworks", "topic": "Workshops", "type": "Workshop", "video_id": "R9RxerT1xJU", "recording_link": "https://www.youtube.com/watch?v=R9RxerT1xJU", "company": "Block", "speaker": "Morgan Martin, Wes Billman, Bradley Axen, Tyler Longwell, Lucas Isaza", "word_count": 7140, "has_transcript": true, "premise": "Most teams made a person the API between their agents and everyone else: copy the output into chat, paste the reply back into the harness. This hands-on workshop shows the alternative: put the agents where the work is. We use Buzz, Block's open source, channel-driven workspace where people and AI agents share conversations, repositories, and reviews. We begin in the middle of a live project, with four people and a swarm of agents working across shared channels and code. Then we rewind and bring the room in. Attendees will join a shared Buzz community, work with an agent, form channels with other participants, and practice delegating, steering, reviewing, and coordinating work as it happens. Along the way, we examine how Buzz approaches portable identity, scoped capabilities, signed work, and collaboration across different agent runtimes and models. By the end, the room itself becomes part of the workflow: everyone contributes code, assets, and reviews to one shared project in a Buzz-hosted Git repository. Bring a laptop. Leave with practical experience running many agents in one shared workspace, where the whole team can see, steer, and use them. **Space Limited - First Come, First Served. Please bring a fully charged laptop to the workshop** In practice, the primary operational challenge stems from this breakdown: So I wanted to start with the problem, which is that, collaborating with humans and agents at the same time is hard. We become the bottleneck in this whole system.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: I think for a lot of us here at Buzz, it really started as a single player tool. So I think for a lot of us it started as a single player tool and quickly it became a team player tool and then a full-on project and organizational level tool. So I think for those of you wondering how do we get there, it's really good to think about just starting with it as a single player tool.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Morgan Martin, Wes Billman, Bradley Axen, Tyler Longwell, Lucas Isaza.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1304090", "title": "Demo Theater: Beyond Models: Open Source Drives the AI Ecosystem", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Red Hat", "speaker": "Wesley Chun", "word_count": 0, "has_transcript": false, "premise": "For this session, we invite technical practitioners and engineering leaders to join Red Hat and open source expert Wesley Chun to learn what some of these critical pieces are, including but not limited to: PyTorch, vLLM, llm-d, OpenShell, OGX (formerly Llama Stack), Docling, and others.", "technical_depth": "The technical architecture presented by Wesley Chun (Red Hat) establishes concrete mechanisms to resolve these failure modes: When people talk about \"open source\" in today's AI & ML landscape, they likely think of open models and kick off _another_ debate between \"open weights\" and truly \"open source\" models. But open source goes beyond models... it's behind the most well-known and critical pieces of the ecosystem, from **training** to **chunking** data & **embedding** for **RAG** to **inference** to **scaling**, **evals**, **observability**, and **optimization**. Open source is _everywhere_ and driving much of the AI ecosystem.", "takeaways": "\u2022 **Production Strategy:** For this session, we invite technical practitioners and engineering leaders to join Red Hat and open source expert Wesley Chun to learn what some of these critical pieces are, including but not limited to: PyTorch, vLLM, llm-d, OpenShell, OGX (formerly Llama Stack), Docling, and others.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1304143", "title": "Demo Theater: Mission-Critical AI in Extreme Environments: An Open-Source Stack for On-Prem", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "GlobalLogic", "speaker": "Georgy Okrokvertskhov", "word_count": 0, "has_transcript": false, "premise": "Learn how to deploy and operate a resilient, air-gapped AI agent platform tailored for harsh industrial environments, including smart factories, offshore oil rigs, and cargo ships.", "technical_depth": "The technical architecture presented by Georgy Okrokvertskhov (GlobalLogic) establishes concrete mechanisms to resolve these failure modes: Learn how to deploy and operate a resilient, air-gapped AI agent platform tailored for harsh industrial environments, including smart factories, offshore oil rigs, and cargo ships. This session demonstrates a production-grade, open-source stack built on Red Hat, Kubernetes, ArgoCD, Keycloak, APISIX, Temporal, and Hitachi Agentic Runtime designed for 24/7 operational continuity without internet connectivity. Discover how to run, orchestrate, and observe stateful LangGraph and Agent Development Kit (ADK) agents directly on the plant floor and remote edge locations with zero telemetry leaks and industrial-grade reliability.", "takeaways": "\u2022 **Production Strategy:** Discover how to run, orchestrate, and observe stateful LangGraph and Agent Development Kit (ADK) agents directly on the plant floor and remote edge locations with zero telemetry leaks and industrial-grade reliability.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1333303", "title": "Agentic Messaging Primitives in MCP", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "h4ZvZpkdslc", "recording_link": "https://www.youtube.com/watch?v=h4ZvZpkdslc", "company": "Microsoft", "speaker": "Caitie McCaffrey", "word_count": 3312, "has_transcript": true, "premise": "Modern agentic workloads no longer fit the standard request-and-response pattern. Loops can run for longer, servers can push streamed results, and there is a clear need to steer work mid-flight. MCP has been growing to meet these requirements. This talk will discuss what message patterns are currently in the protocol and where it's going. In practice, the primary operational challenge stems from this breakdown: But you end up with different challenges where that doesn't always work.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: So, the concerns about how we talk about building up these different messaging patterns are technically decoupled. The basic bread and butter what MCP started with is request response. A client sends a request, it waits for a corresponding response from the server.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Caitie McCaffrey.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1354174", "title": "Are We Ready? Security in a Headless World", "category": "Security & Governance", "topic": "Human-Agent Collaboration", "type": "Panel", "video_id": "gEiM4HBtPAU", "recording_link": "https://www.youtube.com/watch?v=gEiM4HBtPAU", "company": "HumanLayer, Keycard, Socket, Fly.io", "speaker": "Dexter Horthy, Ian Livingstone, Allie Howe, Andrew Becherer, Scott Johnston", "word_count": 5254, "has_transcript": true, "premise": "As software becomes something agents call directly through APIs, MCP endpoints, and tools, the human-facing UI may become optional. But the UI did more for security than we gave it credit for: it constrained actions, showed humans what they were authorizing, and added friction before mistakes compounded. This panel debates whether a headless future is inevitable, whether it makes software more or less secure, and what replaces the security functions the UI once provided. If agents become the new interface, identity, authorization, and audit trails may have to take its place. In practice, the primary operational challenge stems from this breakdown: [ ] It's just it is it is out there and so, and there are going to be disasters, brilliant disasters and I hope that nobody in the audience is in that tail risk category. The first question that we're debating, which is the level of security of the permission there broadly speaking, that's directly tied to what's the level of damage when that fails?", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: There's going to be some incremental step-ups to this it had this feature where today you and Century's MCP or other ones also as MCP you might not be able to be trusting the ability to delete projects. There's a new production, reference architecture for production agents called agent baseline. Whereas an agent is getting entire API spec, is getting an entire MCP server.", "takeaways": "\u2022 **Operational Discipline:** Oh, I have 10 policies and you wake up one day and you have 300 and you don't even remember what you've allowed or not."}, {"session_id": "1224166", "title": "Between Intent and Execution", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "t3ptdhYCbWg", "recording_link": "https://www.youtube.com/watch?v=t3ptdhYCbWg", "company": "PayPal", "speaker": "Hemanth hm", "word_count": 5381, "has_transcript": true, "premise": "You wire up a framework, add tools, write a prompt. It works. Keep adding tools and your context fills up fast, leaving less room for the actual conversation. Try multi-turn and state bleeds between sessions. Run it overnight and it dies at step four, restarting from scratch. None of this is the LLM's fault. It's the harness, everything between the model and the tools. In this talk, I'll share what I learned building agentu across 27 releases. You'll walk away with patterns for scaling tools without eating your context window, composing multi-agent workflows with crash recovery, and wiring self-correction loops that fix problems instead of logging them. Live demos included ;) In practice, the primary operational challenge stems from this breakdown: Say if the agent fails at the review stage, when it recovers, does it know where it failed? If one of the steps fails, in this case we were talking about review failing.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Just because tools are visible in the prompt, it doesn't mean that every tool have access for execution. You should you should be very careful when there are rights there are tools which does right and it's used across multiple agents, How do you control that is basically you intercept all tool.execute before the real execution happens,", "takeaways": "\u2022 **Operational Discipline:** So each of these agentic runs comes back with good amount of data and context in its thinking and then you also could also measure the cost, which is very important,\n\u2022 **Production Finding:** How do you know between all of these lessons four three and four and nine that we have seen, how can I how can I make sure that when that agents are distributed, how do I control them?\n\u2022 **Failure Mode Mitigation:** So, these are the 12 lessons that we saw so far,\n\u2022 **Deployment Rule:** Quickly going through load the tools on demand, one agent per session, save each step, resume on crash, enforce rules, feed exact errors for retries, test the outcomes, not the locks, block the three risk combo,"}, {"session_id": "1259081", "title": "Building Production-Ready Agents with a Regression Test Suite", "category": "Observability & Evaluations", "topic": "Evals & Testing", "type": "Breakout", "video_id": "t69jk07lMxE", "recording_link": "https://www.youtube.com/watch?v=t69jk07lMxE", "company": "Databricks", "speaker": "Yuki Watanabe", "word_count": 4189, "has_transcript": true, "premise": "Standard aggregate LLM benchmarks (like SWE-bench or generic accuracy scores) fail to prevent catastrophic production failures in autonomous agents. In production, fixing one customer failure mode often silently regresses three other edge cases without triggering aggregate eval score drops.", "technical_depth": "Databricks designed an end-to-end regression testing pipeline powered by MLflow Tracing:\n1. Full-Trace Telemetry: Captures every multi-step LLM call, prompt template, tool invocation (read_file, grep), step-by-step latency (e.g. 150s cliffs), and token costs.\n2. Trace-to-Test Generation: Converts real production failure traces directly into deterministic, runnable regression test cases in CI/CD.\n3. Multi-Turn Anomaly Detection: Employs specialized MLflow evaluators to monitor live agent trajectories and flag behavioral drift before pull requests are merged.", "takeaways": "\u2022 **Codify Production Outages:** Every production bug or customer ticket must be codified into a permanent, replayable regression test that asserts against the tool-call trace.\n\u2022 **Trace Assertions vs. Output Assertions:** Asserting solely on final output masks critical inefficiencies; test suites must assert against turn count, tool error recovery, and intermediate token consumption.\n\u2022 **Continuous Regression Hygiene:** Running targeted regression suites on high-risk pull requests prevents catastrophic regressions while keeping CI token spend manageable."}, {"session_id": "1258014", "title": "Don't Share the Database: Interface Contracts Between Isolated AI Agents", "category": "Multi-Agent & Orchestration", "topic": "Multi-Agent & Distributed Systems", "type": "Breakout", "video_id": "xZXGPyUVSp4", "recording_link": "https://www.youtube.com/watch?v=xZXGPyUVSp4", "company": "At Your Company!", "speaker": "Martin Bliss", "word_count": 5718, "has_transcript": true, "premise": "Every multi-agent system hits the same wall: context isolation. Separate harnesses, sessions, and projects keep one agent's state out of another's, but they impose a synchronization tax \u2014 coordinate too loosely and your agents fork reality; too tightly and you reintroduce the bleed it was meant to prevent. This talk treats that tax as a classic interface problem, already solved by microservices and, before them, by Parnas's 1972 case for information hiding. I'll walk through a coordination protocol I built and run across multiple agent harnesses \u2014 a reasoning context, a code-execution context, and a shared store \u2014 where each publishes a facade: a stable interface that exposes its decisions and state while hiding its internals. Others consume them through a producer/consumer handshake \u2014 one proposes a compacted update for human approval, the other fetches it \u2014 and it refuses to fail silently: when an artifact can't be retrieved, it pushes back rather than confabulate. You'll leave with portable patterns: publish facades, not raw context; never share the database; gate shared writes through a human; and treat silent retrieval failure as a bug, not a default.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: It has very clear required attributes with have very specific enume values as well as very tur vocabulary for describing what the change is. David Parnoff said the same thing about information hiding and the need to be clear about using interfaces to hide extra implementation details from different modules of your system and your architecture. Every agent has to import that and interpret it and infer it using its own tokens and context capacity.", "takeaways": "\u2022 **Operational Discipline:** It and the most important one here is step one, gauge hits red, which is this session, this transcript has gotten pretty full."}, {"session_id": "1208407", "title": "Governing MCP at Scale: Enforcing Agentic Architecture from Code Generation to Merge", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "POAbGlwrS5M", "recording_link": "https://www.youtube.com/watch?v=POAbGlwrS5M", "company": "Archrails LLC", "speaker": "Marc Daniel Registre, MBA", "word_count": 1899, "has_transcript": true, "premise": "MCP adoption is accelerating across enterprises, and a new class of drift is emerging: agent architectures that look compliant in docs but diverge in code. Agents wire into tools they shouldn't reach, MCP servers register unapproved interfaces, and by the time anyone notices, the blast radius is wide and remediation is reactive. This session shows how FINOS CALM, the open standard for machine-readable architecture, pairs with PR-time enforcement to govern MCP deployments before they merge. We'll walk through validation patterns: catching a coding agent that adds an MCP server with unapproved interfaces, detecting unauthorized nodes when an agent extends a system beyond its declared boundary, and flagging control violations. A live demo shows a coding agent blocked from making an unauthorized architectural change. Attendees leave with a framework for treating MCP architecture as enforceable policy, plus an open-source CALM-backed MCP server they can run against their own graph. Especially relevant in regulated environments, but the patterns generalize to any team running agents in production. In practice, the primary operational challenge stems from this breakdown: We know that three ways things drift in the MCP world. I've seen a lot of talks that people talks about having another model in the mids that can detect when those drifts are taking place.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: We, every team has an architecture that they have said they want the their team to follow. I think that we can allow agents to code because they know how to code, but guide them and knowing that when the code that is being generated follows the architecture that you have set. If you describe your architecture as a JSON or type graph or a schema validated JSON file that lives in the repo, next to the code, now you have would have created something that is machine readable,", "takeaways": "\u2022 **Operational Discipline:** Now we by having that schema JSON readable format architecture settings done, you can run check rules that you want to put in your PR."}, {"session_id": "1304679", "title": "The Control Plane Your MCP Gateway Forgot", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Sponsored Session", "video_id": "A2uMmhT7dyw", "recording_link": "https://www.youtube.com/watch?v=A2uMmhT7dyw", "company": "Arcade.dev", "speaker": "Alex Salazar", "word_count": 3996, "has_transcript": true, "premise": "As more companies adopt MCP, they run into tool sprawl fast. Duplicate servers pile up, authentication turns into a patchwork of one-off schemes, and there's no single place to set policy, observe behavior, or onboard new agents and systems. Most teams reach for a gateway to fix it, but routing every call through one entry point doesn't tell you which agent should get which tools, who's allowed to call what downstream, or how you'd know if something broke. This talk names that pattern: a control plane that federates multiple MCP servers into curated tool surfaces for each agent, workflow, or IDE. Borrowing lessons from the API boom, we'll structure capabilities into layered building blocks: system access, reusable orchestration, and channel-specific experiences, so you avoid point-to-point spaghetti while keeping integrations composable. You'll see a reference architecture that separates front-door caller identity from downstream tool authorization (scoped OAuth or API keys), supports tool allowlists and LLM-facing usage guidance, and adds the controls a real deployment needs: routing, versioning, rate limits, audit logs, end-to-end tracing. You'll leave with a checklist for turning tool sprawl into a governed platform. One that stays interoperable as new agents, clients, and systems keep showing up. ******************************* _In order to facilitate networking and business relationships at the event, you may choose to visit a third party\u2019s booth or access sponsored content. You are never required to visit third party booths or to access sponsored content. When visiting a booth or participating in sponsored activities, the third party will receive some of your registration data. This data includes your first name, last name, title, company, address, email, standard demographics questions (i.e. job function, industry), and details about the sponsored content or resources you interacted with. If you choose to interact with a booth or access sponsored content, you are explicitly consenting to receipt and use of such data by the third-party recipients, which will be subject to their own privacy policies_ In practice, the primary operational challenge stems from this breakdown: Arcade.dev, we solve a very straightforward problem that's very difficult to solve. 37% reduction in total token costs for an individual session.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: On any single tool request, we're going to check both. You heard a lot of talk last year about MCP not being production grade. In the fourth quarter of last year, a feature got released in the spec called URL elicitation, which is jargon, but it really is tool level authorization that supports this.", "takeaways": "\u2022 **Operational Discipline:** It has to be very granular, otherwise it's not going to work cuz the agents are accessing too many things too fast and they're and they're they're they're too good at finding workarounds.\n\u2022 **Production Finding:** This is an important point people don't talk enough about.\n\u2022 **Failure Mode Mitigation:** The agent just overreached and said, \" instead of trying to pass it, let me go break in and get the answer key.\" And so, that's why human in the loop is such a big important piece of a governance flow for these systems as well."}, {"session_id": "1247305", "title": "Where Did All My Tokens Go? Using Agentgateway to Keep Your AI Usage Under Control", "category": "Enterprise & Production", "topic": "Enterprise Adoption in Practice", "type": "Breakout", "video_id": "jABgf748zHc", "recording_link": "https://www.youtube.com/watch?v=jABgf748zHc", "company": "solo.io", "speaker": "Shane O'Donnell", "word_count": 5794, "has_transcript": true, "premise": "Industry trends are pushing companies to use more AI, often \"at all costs\". However, once CFOs start seeing the bills, the reality of \"at all costs\" really starts to sink in, and we start to turn to more pragmatic approaches to AI budgets. The first step to managing AI spend is to have good monitoring in place. You need to know who your big users are, and which projects or workflows are draining your token budget. The answers can often be surprising! In this talk, I'll walk through a live demo of how you can set up monitoring across multiple providers, with centralized access, using agentgateway. We'll talk about what metrics are important to track, and some gateway patterns we can use to keep costs from becoming unmanageable, like token-based rate-limiting. The full step-by-step demo will be available on Github and the audience can optionally follow along on their own machines. In practice, the primary operational challenge stems from this breakdown: Today we're going to be using Agent Gateway to answer the question, \"Where did all my tokens go?\" to do this, we're basically going to keep going back to these three things that we're going to use to solve this problem. There's there's a bunch of assumptions that have held true for decades that are now broken by AI.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Assuming we want to do Agent Gateway, let's get back to how we're going to get back to our controls. If you don't have one, and what I'll be demoing today is having the gateway issue what we call virtual keys. We've got, a gateway that is now AI aware, so it can tell you how many tokens in you're getting, how many tokens out you're getting.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Shane O'Donnell.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1304144", "title": "Demo Theater: From AI Answers to Trusted Expertise: Grounding Enterprise AI in Expert Knowledge", "category": "Enterprise & Production", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "OReilly", "speaker": "Ro Recio", "word_count": 0, "has_transcript": false, "premise": "See how organizations can bring trusted, practitioner expertise directly into AI workflows like Claude, Copilot, and coding environments.", "technical_depth": "The technical architecture presented by Ro Recio (OReilly) establishes concrete mechanisms to resolve these failure modes: We\u2019ll demonstrate how grounding AI in authoritative sources improves technical decisions, code quality, and confidence without slowing teams down.", "takeaways": "\u2022 **Production Strategy:** We\u2019ll demonstrate how grounding AI in authoritative sources improves technical decisions, code quality, and confidence without slowing teams down.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1304145", "title": "Demo Theater: Which Agent Spent That?", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "DolT", "speaker": "Amit Kinha", "word_count": 0, "has_transcript": false, "premise": "We will put a live agent workload on screen and break a single shared pod down to the team, feature, and customer that actually caused the spend, with no tags, no SDKs, and no code changes.", "technical_depth": "The technical architecture presented by Amit Kinha (DolT) establishes concrete mechanisms to resolve these failure modes: One agent invocation fans out into dozens of model calls and tool calls, across shared inference, shared retrieval, and shared infrastructure. By the time it shows up on a bill it is one anonymous number billed to whoever provisioned the cluster. Tags cannot decompose it, and a gateway only sees the traffic that went through the gateway. This session shows a different approach: read the runtime instead of the invoice.", "takeaways": "\u2022 **Production Strategy:** We will put a live agent workload on screen and break a single shared pod down to the team, feature, and customer that actually caused the spend, with no tags, no SDKs, and no code changes.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1242030", "title": "AI Collaboration Maturity: A Framework Beyond Engineering", "category": "Developer Tools & Frameworks", "topic": "Human-Agent Collaboration", "type": "Breakout", "video_id": "uUKOXTKf5RI", "recording_link": "https://www.youtube.com/watch?v=uUKOXTKf5RI", "company": "Block", "speaker": "Dakota Fabro", "word_count": 5271, "has_transcript": true, "premise": "Most AI maturity models measure one thing: how advanced are your tools? But tool sophistication alone doesn't predict collaboration quality. Imagine a hobbyist and Hendrix both hold the same guitar. The instrument is identical -- what emerges is not. This session introduces the Three Dimensions of AI Collaboration Maturity \u2014 a profession-agnostic framework for understanding where you are, where the growth opportunity lives, and what growth looks like: Cognitive Complexity (Webb\u2019s Depth of Knowledge - DOK) \u2014 How deeply are you thinking with AI? Ways of Working (Tool Maturity - TM) \u2014 How well do your AI tools match the demands of your professional practice? Delegation Trust (Agentic Delegation Trust - ADT) \u2014 How much autonomy do you grant AI, and how skillfully do you manage it? Developed in practice, through building AI-assisted development workflows with Goose (Block's open-source AI agent), this framework started as an engineering tool (rp-why) and evolved into something applicable to any profession. Attendees will leave with a self-assessment they can apply immediately and a shared language for diagnosing AI adoption challenges on their teams. In practice, the primary operational challenge stems from this breakdown: So this is the problem space that I'm working in. We can learn a lot as engineers, as designers, as business people from other systems that have already solved our problem.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Where it started, I was thinking about my own thinking and my workflow. But so it's it's, it's an overpowered tool with a simple task. Then there's ways of working, which is tool maturity, that as we just talked about.", "takeaways": "\u2022 **Operational Discipline:** If you're building a lesson plan, if you're building a unit of learning, if you are in health care, whatever, anything."}, {"session_id": "1250924", "title": "Counting Tokens Before They Hatch: Predicting Agent Costs Before Execution", "category": "Developer Tools & Frameworks", "topic": "Agentic Engineering", "type": "Breakout", "video_id": "39It_-bjhtw", "recording_link": "https://www.youtube.com/watch?v=39It_-bjhtw", "company": "Together AI", "speaker": "Kirah Sapong", "word_count": 3301, "has_transcript": true, "premise": "Agent workloads are fundamentally different from chat. A single request can trigger tool calls, recursive planning, retries, and long-running loops, making costs difficult to predict and even harder to control. In this talk, I'll explore the emerging challenge of agent inference economics through the lens of pre-execution cost estimation. I'll present research investigating whether prompt embeddings and other pre-generation signals can be used to estimate output length before a model generates a response. We'll examine how these techniques can help address one of the core challenges in agent systems: making cost-aware decisions before execution. I'll show how practitioners can adapt these ideas to build rough cost forecasts, enforce budget constraints, guide model routing decisions, and create more predictable agent systems. Attendees will leave with a practical framework for managing agent costs before work begins rather than after the bill arrives. In practice, the primary operational challenge stems from this breakdown: We help teams cut down on agent token costs by running models on device and in hybrid environments. Today, we are going to talk about predicting agent token costs before generation.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: We said, \"Plan a complete trip from San Francisco to Bali and do all of these extra things.\" The chatbot consumed around 4 to 5,000 tokens. The agent consumed over 42 times more tokens than that. Then I established a target, which would just be the token counts of the final responses, and I converted all of the inputs into embeddings.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Kirah Sapong.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1254972", "title": "MCP Rug Pulls in the Wild: Live Attacks and How to Stop Them", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "PPcbuMGGiAE", "recording_link": "https://www.youtube.com/watch?v=PPcbuMGGiAE", "company": "Broadcom, Adobe", "speaker": "Advait Patel, Charit Upadhyay", "word_count": 3976, "has_transcript": true, "premise": "Most MCP security conversations stop at prompt injection. Rug pull attacks are a different, nastier problem and they are already happening in production. Your agent approves a tool. The tool definition gets silently modified after approval. The agent keeps trusting it. No re-validation. No alerts. Nothing in your existing security stack catches it because nothing was built to watch for it. Three real incidents from the past year made this concrete: a fake npm MCP package that built trust over 15 versions before exfiltrating emails, a gateway exposure that leaked credentials and conversation histories from 2000+ MCP instances, and a GitHub MCP injection that hijacked agents into pulling private repo data through a fully legitimate tool. This session is a live demo of all three attack patterns against a real MCP setup, followed by a practical defense framework built around cryptographic tool identity, definition change detection, and runtime monitoring. You will see the attack land, see what traditional tooling misses, and then see the controls that actually catch it. Everything demoed is open source and reproducible. In practice, the primary operational challenge stems from this breakdown: This is a legitimate problem that we found out from one of the open source was when MCPE email helper was introduced. The second to the attacker at the evil example with the entire inbox line.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: We found out 2,000 plus MCP instances and one leaky endpoint was their gateway. Public gateways were helping out in credentials, in making sure that the patches are going wrong, as well as all the patches are approved. You can also discuss the whole full conversation history, tool definitions, and session identifier.", "takeaways": "\u2022 **Operational Discipline:** You can make sure you can use keywords to make sure that this specific agent cannot go above and beyond certain rule.\n\u2022 **Production Finding:** It is going above it, or it is not following the rules.\" This is how you can make sure that using the policies, as well as making sure that what type of allowance that you are providing to your MCP.\n\u2022 **Failure Mode Mitigation:** With that, I would say that if you remember three things, treat the tool definition as a code."}, {"session_id": "1258183", "title": "Multi-Agent SRE: What Happens When Your Agents Want Opposite Things", "category": "Multi-Agent & Orchestration", "topic": "Multi-Agent & Distributed Systems", "type": "Breakout", "video_id": "xDnheQC5GIg", "recording_link": "https://www.youtube.com/watch?v=xDnheQC5GIg", "company": "Apple", "speaker": "Aditi Mewada", "word_count": 3527, "has_transcript": true, "premise": "As SRE teams adopt multi-agent systems, a new class of problem emerges: agents with conflicting objectives operating on the same infrastructure at the same time. Your remediation agent wants to spin up three new nodes to absorb a traffic spike. Your cost-optimization agent wants to terminate underutilized instances to hit budget targets. Both are correct. Both are about to make things worse. This talk explores the real-world failure modes of multi-agent SRE systems - what happens when agents act on stale state, override each other's changes, or reach a deadlock - and how to design your way out of it. We'll cover conflict detection, priority hierarchies, shared state management, and when to hand control back to a human. You'll leave with practical patterns for building multi-agent systems that disagree productively, rather than destructively. In practice, the primary operational challenge stems from this breakdown: When these agents work on same resource that time there can be some issues or there can be some conflicts. Let's understand how can we make this system better so that we can have these agents really go and do some productive work in production environment and not creating any outages.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Let's go through this referee architecture that can help you have a better system that can scale all these multi-agent systems. This will just give what is happening with that specific target, but then this clash statement will help you identify the right conflicts that is with the target. If you're If you're draining a specific zone, and you are terminating everything, but that might fail back, and you can just roll You can just move your traffic back to that agent.", "takeaways": "\u2022 **Operational Discipline:** The most important thing, if it is stale, you have to replan.\n\u2022 **Production Finding:** Do not have LLM take decisions because might do something wrong with the production and then you will have outages."}, {"session_id": "1257253", "title": "No New Authority: Publishing and Finding MCP Agents in DNS", "category": "Protocols & Standards", "topic": "MCPCon", "type": "Breakout", "video_id": "8iv1NuwOHSc", "recording_link": "https://www.youtube.com/watch?v=8iv1NuwOHSc", "company": "Infoblox", "speaker": "Igor Racic, Ingmar Van Glabbeek", "word_count": 3019, "has_transcript": true, "premise": "Most MCP clients still find servers the same two ways: a hardcoded URL, or a central catalog someone has to operate, secure, and be trusted to run. Both break as the agent population grows past what one operator can model \u2014 stale endpoints, scope creep on long-lived tokens, and a registry that takes rent on every relationship. This talk shows a third path: publish and discover MCP servers over DNS, the naming and trust substrate the internet already runs. DNS-AID (an IETF-track draft and the related SDK is a Linux Foundation project) puts an agent's endpoint, capabilities, and cryptographic binding in SVCB and TLSA records under a domain its operator already controls \u2014 resolvable in one lookup, signed with DNSSEC, pinned with DANE, no central index in the path. We'll walk the wire format: the name._agents.domain naming scheme, what goes in SVCB vs. TLSA, how the new MCP discovery binding maps onto it, and the three discovery states (known agent, known domain, neither). Then a live demo \u2014 publish an MCP server into a real zone, discover and invoke it from a fresh client, and watch a capability-policy mismatch get denied. All open source, all reproducible.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: Let's talk about names, records, the MCP binding, and then the discovery states. BAP carries the protocol version that you're being that is being used. Known is a suffix and then the client appends it to its well-known {slash} dot well-known {slash}.", "takeaways": "\u2022 **Interface Isolation:** Standardize tool contracts and enforce strict schema boundaries to prevent prompt pollution and unexpected agent drift as documented by Igor Racic, Ingmar Van Glabbeek.\n\u2022 **Continuous Regression Testing:** Deploy automated eval suites that assert against multi-turn execution traces rather than relying solely on aggregate pass/fail metrics.\n\u2022 **Bounded Authority:** Restrict agent operational permissions to least-privilege perimeters to prevent unintended side-effects across external enterprise services."}, {"session_id": "1292125", "title": "There Is No Loading State: Real-Time Tool Calling for Voice Agents", "category": "Developer Tools & Frameworks", "topic": "Human-Agent Collaboration", "type": "Breakout", "video_id": "cmJcGbLhNyo", "recording_link": "https://www.youtube.com/watch?v=cmJcGbLhNyo", "company": "N/A", "speaker": "Amanda Martin", "word_count": 5210, "has_transcript": true, "premise": "Your chat agent has cute loading states: \"thinking\", \"percolating\", \"vibing\" but your voice agents don't have this luxury. Anything past 1 second of dead air feels broken and your voice agent repeating a loading state verb isn't cute. This session will demonstrate what happens when agents designed for text meet a phone call and how to handle common issues like buying time, error states, and confirmations when voice is your interface. Attendees will leave with patterns to apply to integrate tools to your voice agents and create experiences your users won't hang up on. In practice, the primary operational challenge stems from this breakdown: We're really good at creating these magical experiences that make you not want to leave our products and make you not feel the product is broken and sometimes even make a game out of it. Then if you go if your pause lasts too long with your voice agent, we immediately go, \"Your is broken.\" And we don't it.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: That's the thing that it says every time it makes a tool call. I made it be a long tool call, but you might have longer running tool calls. There Or your tool might break down under certain circumstances where it takes longer.", "takeaways": "\u2022 **Operational Discipline:** You have no idea if this is ready to go to production.\n\u2022 **Production Finding:** Right now, if you're just building your first one, we are recommending GPT 5.6 Luna.\n\u2022 **Failure Mode Mitigation:** The model the model choice is really important in the design of your agent as well."}, {"session_id": "1245977", "title": "Trustworthy Context Is Untrusted By Default", "category": "Developer Tools & Frameworks", "topic": "Building Reliable Agent Systems", "type": "Breakout", "video_id": "5FotXX0NU_4", "recording_link": "https://www.youtube.com/watch?v=5FotXX0NU_4", "company": "Arcade.dev", "speaker": "Shub Argha", "word_count": 3828, "has_transcript": true, "premise": "Structured memory is a compact injection surface. If an agent reads context that says \"always use the production database\" and acts on it, the consequences are real. This talk presents a trust architecture for stored agent context: server-generated preambles that warn agents context was written by another agent and may be stale, risk classifications on write operations, provenance footers that record who wrote what and when, file anchors with commit-at-write hashes for staleness detection, and read-time verification guidance. We present evidence that trust preambles reduced one class of context contamination from 88.8% to 33.3% in controlled testing, while being transparent about which attack classes remain unmitigated. The principle: stored context should be useful but never trusted by default. In practice, the primary operational challenge stems from this breakdown: That's where we get coming to the problem of agents deleting your production databases, agents leaking outside data that is not supposed to. I'm going to start with where the problem stems from.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: I want to run it.\" That cloud code thing is so outdated now because the thing that it was built on is super outdated, Here's why So, these are the agents that we HR tested agents from all of the major labs as well as some self-built agents. It should be server generated by your MCP tool server in many cases, by any context server that you might have.", "takeaways": "\u2022 **Operational Discipline:** We all learned this in I don't know what grade.\n\u2022 **Production Finding:** I also do things that where I find a document, I don't I don't want to read it myself, I need a summary, download, I give it to my agent."}, {"session_id": "1303376", "title": "Why API Modernization is the Prerequisite to AI Governance", "category": "Security & Governance", "topic": "Enterprise Adoption in Practice", "type": "Sponsored Session", "video_id": "5YilRs9LDxI", "recording_link": "https://www.youtube.com/watch?v=5YilRs9LDxI", "company": "Kong", "speaker": "Amit Shah", "word_count": 4280, "has_transcript": true, "premise": "Enterprise AI initiatives are failing not because of the models, but because the API infrastructure supporting them is fragmented and not built for AI data flows. API sprawl scatters policies across gateways, agent frameworks, and context stores that don't communicate \u2014 making it impossible to govern GenAI and Agentic AI at scale. This session covers what full data path governance looks like and how API modernization is the critical first step to achieving it. ******************************* _In order to facilitate networking and business relationships at the event, you may choose to visit a third party\u2019s booth or access sponsored content. You are never required to visit third party booths or to access sponsored content. When visiting a booth or participating in sponsored activities, the third party will receive some of your registration data. This data includes your first name, last name, title, company, address, email, standard demographics questions (i.e. job function, industry), and details about the sponsored content or resources you interacted with. If you choose to interact with a booth or access sponsored content, you are explicitly consenting to receipt and use of such data by the third-party recipients, which wi
