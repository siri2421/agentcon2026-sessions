": "", "company": "Keycard", "speaker": "Geoff Goodman", "word_count": 0, "has_transcript": false, "premise": "An agent can have the right credentials, stay inside its sandbox, and still do the wrong thing.", "technical_depth": "The technical architecture presented by Geoff Goodman (Keycard) establishes concrete mechanisms to resolve these failure modes: In this live demo, we'll give an off-the-shelf agent a task and access to ordinary MCP servers. See intent-based authorization at work, without replacing the agent or rewriting the tools.", "takeaways": "\u2022 **Production Strategy:** See intent-based authorization at work, without replacing the agent or rewriting the tools.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1342374", "title": "Demo Theater: Your AI Model Needs More Than an API", "category": "Developer Tools & Frameworks", "topic": "Demo Theater", "type": "Sponsored Session", "video_id": "", "recording_link": "", "company": "Vultr", "speaker": "Mayank Debnath", "word_count": 0, "has_transcript": false, "premise": "Inference, GPUs, networking, storage and scale all matter. Inference, GPUs, networking, storage and scale all matter.", "technical_depth": "The technical architecture presented by Mayank Debnath (Vultr) establishes concrete mechanisms to resolve these failure modes: Come see the infrastructure behind production AI workloads with Vultr.", "takeaways": "\u2022 **Production Strategy:** Come see the infrastructure behind production AI workloads with Vultr.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Demo Theater workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1288834", "title": "Coffee Break", "category": "Protocols & Standards", "topic": "Breaks / Meals / Special Events", "type": "Breakout", "video_id": "", "recording_link": "", "company": "N/A", "speaker": "N/A", "word_count": 0, "has_transcript": false, "premise": "Official conference schedule event: Coffee Break.", "technical_depth": "Designated time for attendee networking, badge pick-up, sponsor booth visits, and informal technical collaboration across the Breaks / Meals / Special Events track.", "takeaways": "\u2022 **Logistics:** Scheduled event taking place on site at AGNTCon + MCPCon North America 2026.\n\u2022 **Community Engagement:** Connect with peer practitioners, open-source maintainers, and speakers."}, {"session_id": "1288835", "title": "Coffee Break", "category": "Protocols & Standards", "topic": "Breaks / Meals / Special Events", "type": "Breakout", "video_id": "", "recording_link": "", "company": "N/A", "speaker": "N/A", "word_count": 0, "has_transcript": false, "premise": "Official conference schedule event: Coffee Break.", "technical_depth": "Designated time for attendee networking, badge pick-up, sponsor booth visits, and informal technical collaboration across the Breaks / Meals / Special Events track.", "takeaways": "\u2022 **Logistics:** Scheduled event taking place on site at AGNTCon + MCPCon North America 2026.\n\u2022 **Community Engagement:** Connect with peer practitioners, open-source maintainers, and speakers."}, {"session_id": "1255406", "title": "From Pilot to Production: Lessons from Operating Multi-Agent Systems at Scale", "category": "Multi-Agent & Orchestration", "topic": "Multi-Agent & Distributed Systems", "type": "Breakout", "video_id": "", "recording_link": "", "company": "Click2Cloud Inc", "speaker": "Rupal Shirpurkar", "word_count": 0, "has_transcript": false, "premise": "Production agentic systems are fleets of agents that must discover each other's capabilities, hand off work, share context, and keep running when a component fails, across runtimes and tools never designed to cooperate. That interoperability problem is what open protocols like MCP exist to solve. The hard problem was the same: how do heterogeneous agents and tools talk without bespoke glue for every pair? We cover how a standardised context-and-tool layer like MCP becomes the coordination layer, plus patterns: orchestration versus choreography, capability- and content-based routing, shared state without coupling or silent drift, and resilience adapted to model non-determinism.", "technical_depth": "The technical architecture presented by Rupal Shirpurkar (Click2Cloud Inc) establishes concrete mechanisms to resolve these failure modes: A single agent calling one tool is a demo. This talk distills patterns from running multi-agent systems across three production domains: a public-safety platform that tracked 558,000+ people and pre-empted nearly 400 overcrowding incidents, a banking fleet of agents, and a clinical-assistance system bound by strict accuracy and audit rules. Attendees leave with a vendor-neutral model for when a workload needs multiple agents and patterns for systems that stay observable and resilient in production.", "takeaways": "\u2022 **Production Strategy:** Attendees leave with a vendor-neutral model for when a workload needs multiple agents and patterns for systems that stay observable and resilient in production.\n\u2022 **Formal Boundary Enforcement:** Establish explicit runtime contracts and eliminate unmonitored lateral tool permissions across the Multi-Agent & Distributed Systems workflow.\n\u2022 **Closed-Loop Feedback:** Feed operational failures and telemetry traces directly back into regression suites to prevent recurring production drift."}, {"session_id": "1330465", "title": "Keynote Sessions to be Announced", "category": "Developer Tools & Frameworks", "topic": "Keynote Sessions", "type": "Keynote", "video_id": "", "recording_link": "", "company": "N/A", "speaker": "N/A", "word_count": 0, "has_transcript": false, "premise": "Technical presentation delivered by N/A (N/A) focusing on Keynote Sessions.", "technical_depth": "Presents architecture patterns, interface boundaries, and operational deployment practices for Keynote Sessions to be Announced within Developer Tools & Frameworks.", "takeaways": "\u2022 **Operational Pattern:** Implement verified interface boundaries and decoupled execution perimeters as recommended by N/A (N/A).\n\u2022 **Reliability Standard:** Maintain continuous automated monitoring across agent tool executions."}, {"session_id": "1288870", "title": "Keynote: MCP in the Wild", "category": "Protocols & Standards", "topic": "Keynote Sessions", "type": "Keynote", "video_id": "LDMzI0jGDb0", "recording_link": "https://www.youtube.com/watch?v=LDMzI0jGDb0", "company": "OpenAI", "speaker": "Thomas Sarlandie", "word_count": 1903, "has_transcript": true, "premise": "What makes an MCP server work well with models? Drawing on real-world MCP deployments, this talk shares practical lessons on tool design, schemas, instructions, annotations, and discovery. It also looks at how apps, events, skills, and file transfers are expanding what developers can build with MCP. In practice, the primary operational challenge stems from this breakdown: Should I limit myself to 10 tools, five tools, 50 tools? My message strong and clear to you today is that there's no limit.", "technical_depth": "The technical architecture establishes formal execution contracts and runtime perimeters: You can go and expose all the tools you want to the model. We have developers today exposing hundreds of tools. We're planning for a future where users will have dozens of MCP servers connected and authenticated and hundreds of tools in each of their servers.", "takeaways": "\u2022 **Operational Discipline:** In our documentation, we recommend n     let isHomeView = true;
    let showAbstracts = false; // Default: show recorded sessions only!

    // Group talks by Topic
    const topicsMap = {};
    allTalks.forEach(t => {
      const top = t.topic || 'General';
      if (!topicsMap[top]) {
        topicsMap[top] = [];
      }
      topicsMap[top].push(t);
    });

    const sortedTopics = Object.keys(topicsMap).sort();
    let activeTopic = '';

    const topicListEl = document.getElementById('topicList');
    const container = document.getElementById('mainContentContainer');
    const topicTitleEl = document.getElementById('currentTopicTitle');
    const topicCountEl = document.getElementById('currentTopicCount');
    const searchInput = document.getElementById('searchInput');
    const headerRightControls = document.getElementById('headerRightControls');
    const showAbstractsCheckbox = document.getElementById('showAbstractsCheckbox');
    const btnHome = document.getElementById('btnHome');

    function onAbstractsCheckboxToggle(checked) {
      showAbstracts = checked;
      renderSidebar(searchInput.value);
      if (!isHomeView && activeTopic) {
        renderTopicView(activeTopic);
      }
    }

    function showHomePage() {
      isHomeView = true;
      btnHome.classList.add('active');
      headerRightControls.style.display = 'none';
      topicTitleEl.innerText = 'Conference Overview';
      topicCountEl.innerText = 'Executive Whitepaper & Architectural Synthesis across 254 Sessions';

      // Clear sidebar selection
      document.querySelectorAll('.topic-item').forEach(el => el.classList.remove('active'));

      renderHomeView();
    }

    function selectTopic(top) {
      isHomeView = false;
      activeTopic = top;
      btnHome.classList.remove('active');
      headerRightControls.style.display = 'flex';
      renderSidebar(searchInput.value);
      renderTopicView(top);
    }

    function renderSidebar(filter = '') {
      topicListEl.innerHTML = '';
      const f = filter.toLowerCase();

      sortedTopics.forEach(top => {
        const talks = topicsMap[top] || [];
        const recCount = talks.filter(t => t.recording_link || t.has_transcript).length;

        // When searching, filter topics
        if (f && !top.toLowerCase().includes(f) && !talks.some(t => t.title.toLowerCase().includes(f) || t.speaker.toLowerCase().includes(f) || t.company.toLowerCase().includes(f))) {
          return;
        }

        const item = document.createElement('div');
        item.className = 'topic-item' + (!isHomeView && top === activeTopic ? ' active' : '');
        item.onclick = () => selectTopic(top);

        const badgeText = showAbstracts 
          ? `${talks.length} (${recCount} 🎥)` 
          : `${recCount} 🎥`;

        item.innerHTML = `
          <span>${top}</span>
          <span class="topic-badge">${badgeText}</span>
        `;
        topicListEl.appendChild(item);
      });
    }

    function renderTopicView(top) {
      let talks = topicsMap[top] || [];
      const totalInTopic = talks.length;
      const recInTopic = talks.filter(t => t.recording_link || t.has_transcript).length;
      const absInTopic = totalInTopic - recInTopic;

      // Filter by checkbox
      if (!showAbstracts) {
        talks = talks.filter(t => t.recording_link || t.has_transcript);
      }

      // Apply search query if typed
      const f = searchInput.value.toLowerCase();
      if (f) {
        talks = talks.filter(t => t.title.toLowerCase().includes(f) || t.speaker.toLowerCase().includes(f) || t.company.toLowerCase().includes(f) || top.toLowerCase().includes(f));
      }

      topicTitleEl.innerText = top;

      if (!showAbstracts) {
        topicCountEl.innerText = `Showing ${talks.length} recorded talk(s) with analyzed technical transcripts (${absInTopic} in-person abstract sessions hidden)`;
      } else {
        topicCountEl.innerText = `Showing all ${talks.length} session(s) (${recInTopic} recorded with transcript, ${absInTopic} in-person abstract deep dives)`;
      }

              <ul>
                <li><strong>Don't Share the Database:</strong> Decoupled agent contracts preventing distributed transaction race conditions.</li>

              </ul>
            </div>

            <div class="pillar-header">
              <span class="pillar-icon">⚙️</span>
              <h3 class="pillar-title">5. Developer Tools & Frameworks</h3>
            </div>
            <p class="pillar-text">
              Engineering harnesses between models and tools. Building local-first autonomous development kits, declarative monorepo constraints, and lightweight decision models that slash execution latency and token spend.
            </p>
            <div class="pillar-highlights">
              <ul>
                <li><strong>Temporal Browser Agents:</strong> Event-sourced workflow engines delivering durable replay and API bypass patterns.</li>
                <li><strong>LangChain Decision Models:</strong> Offloading high-frequency routing from slow LLMs to calibrated probability models.</li>
                <li><strong>Block Goose & AGENTS.md:</strong> Standardizing developer workstations with declarative repository guardrails.</li>
              </ul>
            </div>
          </div>

          <div class="pillar-card">
            <div class="pillar-header">
              <span class="pillar-icon">⚡</span>
              <h3 class="pillar-title">6. Production Economics & Tokenomics</h3>
            </div>
            <p class="pillar-text">
              Treating autonomous agents as autonomous financial buyers. Managing token consumption, cloud egress costs, and energy constraints by measuring intelligence delivered per watt and cost per completed enterprise task.
            </p>
            <div class="pillar-highlights">
              <ul>
                <li><strong>Tokenomics Foundation:</strong> Dual-ledger accounting balancing financial spend against data center energy constraints.</li>
                <li><strong>Datadog 10,000 PR Reviewer:</strong> Multi-stage risk scoring and reflection loops preventing runaway reviewer token spend.</li>
                <li><strong>Arm Hybrid Edge/Cloud:</strong> Partitioning reasoning between on-device NPU inference and cloud frontier models.</li>
              </ul>
            </div>
          </div>

        </div>

        <!-- Topic Directory Navigator -->
        <h2 style="font-size: 20px; font-weight: 800; color: #fff; margin: 0 0 14px;">🧭 Explore Track Deep Dives</h2>
        <div class="topic-directory-grid">
          ${sortedTopics.map(top => {
            const talks = topicsMap[top] || [];
            const recCnt = talks.filter(t => t.recording_link || t.has_transcript).length;
            return `
              <div class="dir-card" onclick="selectTopic('${top}')">
                <span class="dir-card-name">${top}</span>
                <span class="dir-card-badge">${recCnt} 🎥 / ${talks.length} total</span>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    searchInput.addEventListener('input', (e) => {
      if (isHomeView && e.target.value.trim()) {
        // Auto-switch to first matching topic if user starts searching on home page
        const f = e.target.value.toLowerCase();
        const match = sortedTopics.find(top => top.toLowerCase().includes(f) || (topicsMap[top] || []).some(t => t.title.toLowerCase().includes(f) || t.speaker.toLowerCase().includes(f)));
        if (match) {
          selectTopic(match);
          return;
        }
      }
      renderSidebar(e.target.value);
      if (!isHomeView && activeTopic) {
        renderTopicView(activeTopic);
      }
    });

    // Initialize with Home View
    renderSidebar();
    showHomePage();
  </script>
</body>
